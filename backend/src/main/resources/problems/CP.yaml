    აინთება თუ არა შუქდიოდები თუ მიმდევრობით ჩავრთავთ წითელ შუქდიოდსაც?
    როგორ იმუშავებს წრედი თუ დავტოვებთ მხოლოდ ლურჯ შუქდიოდებს?
  methodology: "ეს არის კარგი სავარჯიშო კონდესატორის მუშაობის პრინციპისა და პრაქტი\
    კული გამოყენების გასააზრებლად, ასევე გადამრთველებისა და კონდესატორის ერთად სწო\
    რად ჩასართავად. გადამრთველებით კონდესატორი ხან კვების პარალელურად ირთვება (დამ\
    უხტვა), ხან მიმდევრობით (გაორმაგება). შუქდიოდებით ვიზუალურად ჩანს შედეგი."
  validation:
    cases:
    - label: idle_charge_leds_off
      labelKa: "ორივე გადამრთველი A–B — კონდესატორი იტენება, LED-ები ჩამქრალია"
      switchStates:
        slide_switch_1: left
        slide_switch_2: left
      checks:
      - role: led_1
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      - role: led_4
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      simPhase: idle
    - label: boost_pulse_leds_on
      labelKa: ორივე გადართულია A–C — ოთხივე LED მოკლედ აინთება
      switchStates:
        slide_switch_1: right
        slide_switch_2: right
      checks:
      - role: led_1
        metric: tran_forward_current_peak
        op: gt
        value: 8.0E-4
      - role: led_4
        metric: tran_forward_current_peak
        op: gt
        value: 8.0E-4
      - role: led_1
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      simPhase: pressed
    - label: return_charge_leds_off
      labelKa: ორივე უკან A–B — LED-ები ჩამქრალია (კონდესატორი ისევ იტენება)
      switchStates:
        slide_switch_1: left
        slide_switch_2: left
      checks:
      - role: led_1
