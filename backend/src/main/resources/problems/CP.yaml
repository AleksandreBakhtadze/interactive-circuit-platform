        metric: tran_forward_current_start
        op: lt
        value: 0.001
      - role: led_green
        metric: tran_forward_current_start
        op: lt
        value: 0.001
      - role: led_green
        metric: tran_lit_before:led_red
        op: gt
        value: 0.0
      - role: led_red
        metric: tran_forward_current_end
        op: gt
        value: 5.0E-4
      - role: led_green
        metric: tran_forward_current_end
        op: gt
        value: 5.0E-4
      simPhase: pressed
    - label: release_green_faster
      labelKa: "ღილაკის გაშვება — ორივე ჩაქრება, მწვანე უფრო ჩქარა"
      switchStates:
        button_1: open
      checks:
      - role: led_red
        metric: tran_forward_current_start
        op: gt
        value: 5.0E-4
      - role: led_green
        metric: tran_forward_current_start
        op: gt
        value: 5.0E-4
      - role: led_green
        metric: tran_extinguish_before:led_red
        op: gt
        value: 0.0
      - role: led_red
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      - role: led_green
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      simPhase: discharge
