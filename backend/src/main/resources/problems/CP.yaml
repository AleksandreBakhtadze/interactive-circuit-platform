- code: CP.L2.14
  title: CP.L2.14
  displayOrder: 10004
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ღილაკი, კონდესატორი, ერთი წითელი შუქდიოდი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდი უნდა აინთოს;
    თუ დავაწვებით ღილაკს, შუქდიოდის ნათებამ თანდათან უნდა მოიმატოს;
    თუ ავუშვებთ ღილაკს, შუქდიოდის ნათებამ თანდათან უნდა მოიკლოს და დაუბრუნდეს საწყის მდგომარეობას.

    ღილაკზე დაჭერით უნდა იცვლებოდეს შუქდიოდის ნათება; ნათების ცვლილება არ უნდა იყოს მყისიერი და უნდა მოხდეს თანდათან.
  hint: |-
    შუქდიოდი მუდმივად უნდა იყოს ჩართული მაღალი წინაღობის გავლით; ღილაკის და რეზისტორის გავლით შუქდიოდს მიაწოდეთ დამატებითი დენის ნაკადი.
    კონდესატორი ჩართეთ ისე, რომ ღილაკზე დაჭერისას რეზისტორის გავლით იმუხტებოდეს, ხოლო აშვების შემდეგ რეზისტორის და შუქდიოდის გავლით განიმუხტებოდეს.
  questions: |-
    როგორ შეიცვლება წრედის მუშაობის პრინციპი თუ შუქდიოდს პარალელურად ჩავრთავთ ანალოგიურ შუქდიოდს?
    როგორ შეიცვლება წრედის მუშაობის პრინციპი თუ შუქდიოდს შემოვატრიალებთ?
  methodology: "ეს და მომდევნო სამი სავარჯიშო რეალურად ერთი ამოცანის (შედეგის) გან\
    ვითარებაა: ყოველ ახალ ამოცანაში პირობა მცირედ იცვლება, შემოდის დამატებითი დეტა\
    ლები, თუმცა შედეგი თითქმის იგივე რჩება. ოთხივე ამოცანა გათვლილია უკან გავლილი\
    \ მასალის გამოყენებაზე და მასთან ერთად დამატებითი დეტალების სწორად გამოყენებაზ\
    ე."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — შუქდიოდი ჩამქრალია
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.001
    - label: baseline_dim
      labelKa: ჩამრთველი ჩართულია — შუქდიოდი ანთებულია (საწყისი ნათება)
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 2.0E-4
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.0025
    - label: press_gradual_brighten
      labelKa: ღილაკის დაჭერა — ნათება თანდათან იზრდება
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: led_1
        metric: tran_forward_current_start
        op: gt
        value: 2.0E-4
      - role: led_1
        metric: tran_forward_current_start
        op: lt
        value: 0.0025
      - role: led_1
        metric: tran_forward_current_rise
        op: gt
        value: 2.5E-4
      - role: led_1
        metric: tran_forward_current_early_ratio
        op: lt
        value: 0.92
      simPhase: pressed
    - label: release_fade_to_baseline
      labelKa: ღილაკის გაშვება — ნათება თანდათან უბრუნდება საწყისს
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: led_1
        metric: tran_forward_current_start
        op: gt
        value: 5.0E-4
      - role: led_1
        metric: tran_forward_current_fall
        op: gt
        value: 2.5E-4
      - role: led_1
        metric: tran_forward_current_end
        op: gt
        value: 2.0E-4
      - role: led_1
        metric: tran_forward_current_end
        op: lt
        value: 0.0025
      simPhase: discharge
- code: CP.L2.15
  title: CP.L2.15
  displayOrder: 10005
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ღილაკი, კონდესატორები, ერთი წითელი და ერთი მწვანე შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ორივე შუქდიოდი უნდა იყოს ჩამქრალი;
    თუ დავაწვებით ღილაკს, ორივე შუქდიოდი თანდათან უნდა აინთოს — მწვანე შუქდიოდი შედარებით უფრო ჩქარა, ვიდრე წითელი;
    თუ ავუშვებთ ღილაკს, ორივე შუქდიოდი თანდათან უნდა ჩაქრეს — მწვანე შუქდიოდი შედარებით უფრო ჩქარა, ვიდრე წითელი.

    ანთება და ჩაქრობა უნდა ხდებოდეს თანდათან და არა მყისიერად.
  hint: "გამოიყენეთ ორი განსხვავებული ტევადობის კონდესატორი — ერთი წითელისთვის, მე\
    ორე მწვანისთვის. მწვანესთან ჩართეთ უფრო მცირე ტევადობა (მაგ. 100 µF ან 10 µF),\
    \ წითელთან — უფრო დიდი (მაგ. 470 µF). კონდესატორები ჩართეთ შუქდიოდებთან პარალე\
    ლურად და გამოიყენეთ როგორც შუქდიოდის კვების წყარო ღილაკის გაშვებისას."
  questions: |-
    გამოიყენეთ მხოლოდ გამტარი და წრედი შეცვალეთ ისე, რომ მწვანე შუქდიოდი უფრო გვიან ინთებოდეს, ვიდრე წითელი.
    შეიცვლება თუ არა წრედის მუშაობის პრინციპი თუ წითელ შუქდიოდს ჩავანაცვლებთ ლურჯით?
  methodology: წინა სავარჯიშოს შედეგის გათვალისწინებით არ არის რთული ამოცანა; შედეგის
    მისაღწევად საკმარისია შუქდიოდებთან განსხვავებული ტევადობის კონდესატორების გამოყენება.
  validation:
