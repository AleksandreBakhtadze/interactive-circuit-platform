    თუ დავაწვებით ღილაკს, ჯერ უნდა აინთოს წითელი შუქდიოდი, შემდეგ მწვანე და ბოლოს ლურჯი შუქდიოდი;
    თუ ავუშვებთ ღილაკს, ჯერ უნდა ჩაქრეს ლურჯი, შემდეგ მწვანე და ბოლოს წითელი შუქდიოდი.
