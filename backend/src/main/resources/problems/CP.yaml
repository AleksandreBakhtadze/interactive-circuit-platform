    • გამოთვალეთ, რა ენერგიას მოიხმარს ძრავი გადართვის დროს?
  methodology: "წინა სავარჯიშოს მსგავსად, აქაც მიიღებენ ცვალადი პოლარობის დენს, მა\
    გრამ არ უნდა გამოიყენონ კვების ნახევარი ძაბვა — შეუძლიათ გამოიყენონ მეორე გადა\
