chapter: CP
problems:
- code: CP.L1.1
  title: კონდესატორით შუქდიოდის ნელი ჩაქრობა
  displayOrder: 1
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: კონდესატორი, ღილაკი, ერთი წითელი შუქდიოდი, რეზისტორი და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ შუქდიოდი არ უნდა აინთოს;
    თუ ღილაკს დავაწვებით, შუქდიოდი უნდა აინთოს;
    თუ ღილაკს ავუშვებთ, შუქდიოდი უნდა ჩაქრეს ნელა.

    ღილაკზე დაჭერით შუქდიოდი უნდა ინთებოდეს მყისიერად, ღილაკის გათიშვით უნდა ქრებოდეს ნელა.
  hint: |-
    შუქდიოდი ჩართეთ კონდესატორის პარალელურად. კონდესატორი განიხილეთ როგორც შუქდიოდის კვების წყარო.
    ღილაკის გავლით უნდა დაიმუხტოს კონდესატორი, ხოლო რეზისტორის და შუქდიოდის გავლით განიმუხტოს კონდესატორი.
  questions: |-
    როგორ იმუშავებს წრედი თუ კონდესატორის ტევადობას შევამცირებთ?
    როგორ შეგვიძლია გავზარდოთ შუქდიოდის ჩაქრობის ხანგრძლივობა?
  methodology: "ეს არის კონდენსატორის გაცნობითი სავარჯიშო. ამ ამოცანაში პრაქტიკულა\
    დ უნდა ნახონ მისი მუშაობის პრინციპი, ენერგიის შენახვისა და გამოყენების ეფექტი\
    . შუქდიოდისა და განსხვავებული რეზისტორების გამოყენებით დინამიკაში უნდა ნახონ კ\
    ონდენსატორის განმუხტვის პროცესი."
  validation:
    cases:
    - label: button_open
      labelKa: ღილაკი არ არის დაჭერილი
      switchStates:
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.001
    - label: button_pressed
      labelKa: ღილაკი დაჭერილი (მყისიერი ანთება)
      switchStates:
        button_1: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.003
    - label: discharge_fade
      labelKa: ღილაკის გაშვების შემდეგ ნელი ჩაქრობა
      switchStates:
        button_1: open
      checks:
      - role: led_1
        metric: tran_forward_current_start
        op: gt
        value: 0.001
      - role: led_1
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      simPhase: discharge
- code: CP.L1.2
  title: კონდესატორის შუქდიოდის ნელი ანთება და ჩაქრობა
  displayOrder: 2
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: კონდესატორი, ღილაკი, ერთი წითელი შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ შუქდიოდი არ უნდა აინთოს;
    თუ ღილაკს დავაწვებით, შუქდიოდი უნდა აინთოს ნელა;
    თუ ღილაკს ავუშვებთ, შუქდიოდი უნდა ჩაქრეს ნელა.

    წინა ამოცანისგან განსხვავებით ღილაკზე დაჭერით შუქდიოდი უნდა ინთებოდეს ნელა, ღილაკის გათიშვით კი — როგორც წინა შემთხვევაში — უნდა ქრებოდეს ნელა.
  hint: "გამოიყენეთ წინა ამოცანის შედეგი, მხოლოდ კონდესატორი არ დამუხტოთ მყისიერად\
    . კონდესატორი დამუხტეთ რეზისტორის გავლით — რეზისტორი ჩართეთ კვებასა და კონდესა\
    ტორს შორის."
  questions: |-
    როგორ გავზარდოთ შუქდიოდის ანთების ხანგრძლივობას?
    როგორ შევცვალოთ წრედში კონდესატორის ტევადობა?
  methodology: კონდენსატორის გაცნობითი სავარჯიშო. წინა სავარჯიშოსგან განსხვავებით
    ამ ამოცანაში შეუძლიათ დააკვირდნენ კონდესატორის დამუხტვის პროცესსაც. შუქდიოდისა
    და განსხვავებული რეზისტორების გამოყენებით დინამიკაში უნდა ნახონ კონდენსატორის
    დამუხტვისა და განმუხტვის პროცესი.
  validation:
    cases:
    - label: button_open
      labelKa: ღილაკი არ არის დაჭერილი
      switchStates:
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.001
    - label: slow_charge
      labelKa: ღილაკის დაჭერისას ნელი ანთება
      switchStates:
        button_1: closed
      checks:
      - role: led_1
        metric: tran_forward_current_start
        op: lt
        value: 0.001
      - role: led_1
        metric: tran_forward_current_early
        op: lt
        value: 0.005
      - role: led_1
        metric: tran_forward_current_end
        op: gt
        value: 0.003
      simPhase: pressed
    - label: discharge_fade
      labelKa: ღილაკის გაშვების შემდეგ ნელი ჩაქრობა
      switchStates:
        button_1: open
      checks:
      - role: led_1
        metric: tran_forward_current_start
        op: gt
        value: 0.001
      - role: led_1
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      simPhase: discharge
- code: CP.L2.3
  title: მწვანე-წითელი გადამრთველი კონდესატორით
  displayOrder: 3
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: კონდესატორები, გადამრთველი, ერთი წითელი და ერთი მწვანე შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    • წრედის აწყობის შემდეგ მწვანე შუქდიოდი უნდა აინთოს;
    • თუ გადამრთველს გადავრთავთ, მწვანე შუქდიოდი ნელა უნდა ჩაქრეს და წითელი შუქდიოდი ნელა უნდა აინთოს;
    • თუ გადამრთველს უკან დავაბრუნებთ, წითელი შუქდიოდი ნელა უნდა ჩაქრეს და მწვანე შუქდიოდი ნელა უნდა აინთოს;

    გადამრთველით უნდა გადაირთოს წითელი და მწვანე შუქდიოდი მხოლოდ ისე, რომ გადართვის დროს შუქდიოდების ანთება და ჩაქრობა მოხდეს შენელებულად.
  hint: |-
    გამოიყენეთ წინა ამოცანის გამოცდილება. გამოიყენეთ ორი კონდესატორი — ორივე შუქდიოდისთვის, როგორც კვების (ენერგიის) წყარო, გამოიყენეთ თითო კონდესატორი.
    კონდესატორების დამუხტვაც და განმუხტვაც გააკეთეთ რეზისტორების გავლით.
  questions: |-
    • გამოიყენეთ მხოლოდ ერთი გამტარი და წრედი შეცვალეთ ისე, რომ შუქდიოდების ანთება მოხდეს მყისიერად.
    • წრედი შეცვალეთ ისე, რომ შუქდიოდები ბოლომდე არ ჩაქრეს — ოდნავ რჩებოდნენ ანთებული.
    • წრედი შეცვალეთ ისე, რომ წითელი შუქდიოდი უფრო ჩქარა აინთოს და ჩაქრეს, ვიდრე მწვანე.
  methodology: "ამ სავარჯიშოში მთავარია მოიფიქრონ, რომ ორივე შუქდიოდისთვის გამოიყე\
    ნონ ცალ-ცალკე კონდესატორი. სტაბილურად უნდა ჩართონ გადამრთველი წრედში და არ გამ\
    ოიყენონ ძალიან ბევრი რეზისტორი."
  validation:
    cases:
    - label: slide_left_green_on
      labelKa: გადამრთველი A–B — მწვანე ანთებული
      switchStates:
        slide_switch: left
      checks:
      - role: led_green
        metric: tran_forward_current_end
        op: gt
        value: 0.003
      - role: led_red
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      simPhase: idle
    - label: slide_right_crossfade
      labelKa: "გადართვა A–C — მწვანე ნელა ქრება, წითელი ნელა ინთება"
      switchStates:
        slide_switch: right
      checks:
      - role: led_green
        metric: tran_forward_current_start
        op: gt
        value: 0.001
      - role: led_green
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      - role: led_red
        metric: tran_forward_current_start
        op: lt
        value: 0.001
      - role: led_red
        metric: tran_forward_current_early
        op: lt
        value: 0.005
      - role: led_red
        metric: tran_forward_current_end
        op: gt
        value: 0.003
      simPhase: pressed
    - label: slide_left_crossfade
      labelKa: "გადართვა A–B — წითელი ნელა ქრება, მწვანე ნელა ინთება"
      switchStates:
        slide_switch: left
      checks:
      - role: led_red
        metric: tran_forward_current_start
        op: gt
        value: 0.001
      - role: led_red
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      - role: led_green
        metric: tran_forward_current_start
        op: lt
        value: 0.001
      - role: led_green
        metric: tran_forward_current_early
        op: lt
        value: 0.005
      - role: led_green
        metric: tran_forward_current_end
        op: gt
        value: 0.003
      simPhase: discharge
- code: CP.L2.4
  title: კონდესატორით შუქდიოდის ჩაქრობა და ნელი ანთება
  displayOrder: 4
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: კონდესატორი, ღილაკი, ერთი წითელი შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    • წრედის აწყობის შემდეგ შუქდიოდი უნდა აინთოს;
    • თუ ღილაკს დავაწვებით, შუქდიოდი უნდა ჩაქრეს მყისიერად და შემდეგ ნელა აინთოს;
    • თუ ღილაკს ავუშვებთ რამდენიმე წამის განმავლობაში და შემდეგ ხელახლა დავაწვებით, უნდა განმეორდეს იგივე პროცესი;

    ღილაკით უნდა მოხდეს შუქდიოდის მყისიერი ჩაქრობა და შემდგომი ნელი ანთება. ღილაკის ხელმეორედ დაჭერამდე საჭიროა რამდენიმე წამიანი პაუზა.
  hint: |-
    კონდესატორი ღილაკის გავლით დამუხტეთ შუქდიოდზე მოთავსებული ძაბვით. კონდესატორი დამუხტვის დროს მოიხმარს მაღალ დენს — გამოიყენეთ ეს ეფექტი შუქდიოდის მყისიერად ჩასაქრობად.
    კონდესატორი ჩართეთ შუქდიოდის პარალელურად.
    იმისთვის, რომ დამუხტული კონდესატორი განიმუხტოს ღილაკის გათიშვის შემდეგ, აუცილებელია მისი განმუხტვა რეზისტორით. განუმუხტავი კონდესატორი ვერ ჩააქრობს შუქდიოდს.
  questions: |-
    • როგორ შეიცვლება შუქდიოდის ანთების პროცესი, თუ ერთი შუქდიოდის ნაცვლად გამოვიყენებთ მიმდევრობით ჩართულ შუქდიოდებს?
    • როგორ შეიცვლება წრედის მუშაობის პრინციპი, თუ ერთ კონდესატორს ჩავანაცვლებთ მიმდევრობით ჩართული ორი ანალოგიური კონდესატორით?
    • რა მინიმალური პერიოდია საჭირო ღილაკების დაჭერებს შორის და რაზეა დამოკიდებული ეს დრო?
  methodology: "ამ სავარჯიშოს შესრულებისას ვიზუალურად უნდა ნახონ კონდესატორის დამუ\
    ხტვის პროცესი — განმუხტული კონდესატორი მოიხმარს საკმაოდ მაღალ დენს, სანამ დაიმ\
    უხტება. ასევე უნდა გაითვალისწინონ, რომ დამუხტული კონდესატორი დიდხანს ინახავს ე\
    ნერგიას; მოკლე დროში განსამუხტად კონდესატორის პარალელურად ჩართეთ თუნდაც მაღალი\
    \ წინაღობის რეზისტორი."
  validation:
    cases:
    - label: button_open
      labelKa: წრედის აწყობის შემდეგ შუქდიოდი ანთებულია
      switchStates:
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.0015
    - label: press_dip_reclaim
