        op: lt
        value: 0.001
      - role: led_4
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      simPhase: discharge
- code: CP.L2.8
  title: CP.L2.8
  displayOrder: 10001
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ძრავი, ერთი გადამრთველი, კონდესატორი და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    • წრედის აწყობის შემდეგ ძრავი უნდა იყოს გაჩერებული;
    • თუ გადამრთველს გადავრთავთ, ძრავი უნდა დატრიალდეს ერთი მიმართულებით მცირე პერიოდით და გაჩერდეს;
    • თუ გადამრთველს უკან დავაბრუნებთ, ძრავი უნდა დატრიალდეს საწინააღმდეგო მიმართულებით მცირე პერიოდით და გაჩერდეს;

    გადამრთველით უნდა იცვლებოდეს ძრავის ბრუნვის მიმართულება და ძრავი გადართვის შემდეგ უნდა დატრიალდეს და გაჩერდეს.
  hint: |-
    გამოიყენეთ წინა ამოცანების შედეგები: რადგან ძრავი მცირე პერიოდით ტრიალებს და შემდეგ ჩერდება, კონდესატორი ჩართული უნდა იყოს ძრავის მიმდევრობით.
    გამოიყენეთ კვებების შეერთების წრედი, გადამრთველის გადართვით შეცვალეთ კვებების პოლარობა და კონდესატორი რევერსულად დაუმუხტეთ ძრავის გავლით.
  questions: |-
    • განსაზღვრეთ, რა ძაბვამდე იმუხტება კონდესატორი გადამრთველის თითოეულ პოზიციაზე?
    • გამოიყენეთ დამატებითი დეტალები და გაზარდეთ ძრავის ბრუნვის ხანგრძლივობა.
    • რა შეიცვალება, თუ ძრავის პარალელურად ჩავრთავთ ნათურას?
    • გამოიყენეთ ჩამრთველი და წრედი შეცვალეთ ისე, რომ ჩამრთველით შეიძლებოდეს წრედის ჩართვა-გამორთვა.
  methodology: "წინა სავარჯიშოების შესრულების შემდეგ ამ ამოცანის შესრულება უფრო გა\
    იმარტივებათ, რადგან ანტიპარალელურად ჩართული შუქდიოდები იქცევა ძრავის ანალოგიურ\
    ად: იქ სადაც შუქის ფერია, ძრავში არის ბრუნვის მიმართულება; იქ სადაც შუქის სიძლ\
    იერეა, ძრავში არის ბრუნვის სიჩქარე. წრედის აწყობის შემდეგ სასურველია შეაფასონ\
    , როგორ მოქმედებს ძრავის (ზოგადად დატვირთვის) სიმძლავრე კონდესატორის რევერსულა\
    დ დამუხტვის პროცესზე."
  validation:
    cases:
    - label: idle_motor_stopped
      labelKa: წრედის აწყობის შემდეგ ძრავი გაჩერებულია
      switchStates:
        slide_switch: left
      checks:
      - role: motor_1
        metric: tran_current_abs_end
        op: lt
        value: 0.005
      simPhase: idle
    - label: slide_right_pulse
      labelKa: გადართვა A–C — ძრავი მოკლედ ტრიალებს და ჩერდება
      switchStates:
        slide_switch: right
      checks:
      - role: motor_1
        metric: tran_current_abs_peak
        op: gt
        value: 0.02
      - role: motor_1
        metric: tran_current_abs_end
        op: lt
        value: 0.005
      simPhase: pressed
    - label: slide_left_pulse
      labelKa: გადართვა A–B — ძრავი მოკლედ ტრიალებს საპირისპიროდ და ჩერდება
      switchStates:
        slide_switch: left
      checks:
      - role: motor_1
        metric: tran_current_flip_sign
        op: lt
        value: 0.0
      - role: motor_1
        metric: tran_current_abs_peak
        op: gt
        value: 0.02
      - role: motor_1
        metric: tran_current_abs_end
        op: lt
        value: 0.005
      simPhase: discharge
- code: CP.L2.9
  title: CP.L2.9
  displayOrder: 10002
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ძრავი, ორი გადამრთველი, კონდესატორი და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    • წრედი ააწყვეთ ისე, რომ ორივე გადამრთველი იყოს ერთნაირ პოზიციაზე — ძრავი არ უნდა ტრიალებდეს;
    • თუ გადამრთველებს გადავრთავთ ერთდროულად, ძრავი უნდა დატრიალდეს ერთი მიმართულებით მცირე პერიოდით და გაჩერდეს;
    • თუ გადამრთველებს უკან დავაბრუნებთ, ძრავი უნდა დატრიალდეს საწინააღმდეგო მიმართულებით მცირე პერიოდით და გაჩერდეს;
    • მხოლოდ ერთი გადამრთველის გადართვით ძრავი არ უნდა დატრიალდეს (ან მხოლოდ სუსტად — სრული პულსი ორივეს ერთად გადართვას სჭირდება).

    ეს წინა სავარჯიშოს მსგავსია, მაგრამ ძრავი უფრო ძლიერად და უფრო ხანგრძლივად უნდა დატრიალდეს: გადამრთველების ერთდროული გადართვით იცვლება პოლარობა სრული ძაბვით.
  hint: |-
    წინა ამოცანისგან განსხვავებით, რადგან ძრავი უფრო ძლიერად უნდა დატრიალდეს, ძრავი ჩართეთ სრული ძაბვაზე — არ გამოიყენოთ კვებების შეერთების (შუა წერტილის) წრედი.
    კონდესატორი და ძრავი ჩართეთ მიმდევრობით; ორი გადამრთველით შეცვალეთ კვების პოლარობა და კონდესატორი რევერსულად დაუმუხტეთ ძრავის გავლით.
  questions: |-
    • განსაზღვრეთ, რა ძაბვამდე იმუხტება კონდესატორი?
