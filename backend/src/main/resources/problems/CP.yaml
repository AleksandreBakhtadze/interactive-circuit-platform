  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: კონდესატორი, ერთი ღილაკი, წითელი, მწვანე და ლურჯი შუქდიოდები, რეზისტორები და ორი კვების წყარო.

