chapter: DI
problems:
- code: DI.L1.1
  title: ნათურის ნათების მომატება დიოდით და ღილაკით
  displayOrder: 1
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    დიოდი, ნათურა, ღილაკი და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ნათურა უნდა აინთოს სუსტად;
    თუ დავაწვებით ღილაკს, ნათურის ნათებამ უნდა მოიმატოს;
    თუ ავუშვებთ ღილაკს, ნათურამ ისევ სუსტად უნდა გაანათოს.

    ნათურის ნათების მომატება მხოლოდ დიოდისა და ღილაკის გამოყენებით უნდა მოხერხდეს — სხვა დეტალების გამოყენების უფლება არ გაქვთ.
  hint: |-
    რადგან სხვა დეტალების გამოყენება არ შეიძლება, ნათურაში გამავალ დენს წინაღობით ვერ შეზღუდავთ. ნათების გაზრდა მხოლოდ ნათურაზე ძაბვის მომატებითაა შესაძლებელი.
    გამოიყენეთ კვების წყაროების შეერთების წერტილი — კვების ნახევარი ძაბვა.
    გამოიყენეთ დიოდის მთავარი თვისება: დიოდი დენს მხოლოდ ერთი მიმართულებით ატარებს.
  questions: |-
    გამოიყენეთ ჩამრთველი და წრედში ჩასვით ისე, რომ ჩამრთველის გამორთვით წრედი მთლიანად ითიშებოდეს.
    როგორ იმუშავებს წრედი თუ დიოდს შემოვატრიალებთ?
  methodology: ეს დიოდის მუშაობის პრინციპისა და გამოყენების გაცნობითი სავარჯიშოა.
    მოსწავლეები პრაქტიკულად ნახავენ დიოდის მიერ დენის ცალმხრივად გატარების უნარს.
    დიოდის არასწორად ჩართვის შემთხვევაში ვიზუალურად ნახავენ კვების წყაროს დამოკლების
    ეფექტს. შედეგის მისაღებად უნდა გამოიყენონ კვების ნახევარი ძაბვა.
  validation:
    cases:
    - label: button_open_dim
      labelKa: ღილაკი არ არის დაჭერილი — ნათურა სუსტად ანათებს
      switchStates:
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.02
      - role: lamp
        metric: current
        op: lt
        value: 0.09
      - role: diode_1
        metric: forward_current
        op: gt
        value: 0.02
    - label: button_pressed_bright
      labelKa: ღილაკი დაჭერილია — ნათურის ნათება მომატებულია
      switchStates:
        button_1: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.08
      - role: lamp
        metric: current_vs_prior
        op: gt
        value: 1.5
- code: DI.L2.2
  title: ნათურის ნათების მომატება ორი დიოდით და ღილაკით
  displayOrder: 2
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ორი დიოდი, ნათურა, ღილაკი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ნათურა უნდა აინთოს;
    თუ დავაწვებით ღილაკს, ნათურის ნათებამ უნდა მოიმატოს;
    თუ ავუშვებთ ღილაკს, ნათურამ ისევ სუსტად უნდა გაანათოს.

    ეს წინა სავარჯიშოს ანალოგიური ამოცანაა, იმ განსხვავებით, რომ აქ ორი დიოდია მოცემული და კვების ნახევარი ძაბვა არ უნდა გამოიყენოთ. ნათურის ნათების მომატება ისეთი ძლიერი არ იქნება, როგორც წინა ამოცანაში.
  hint: |-
    წინა ამოცანასთან შედარებით პირობა კიდევ უფრო გამკაცრებულია. ნათურის ნათების მომატება ამ შემთხვევაშიც მხოლოდ ძაბვის მომატებითაა შესაძლებელი.
    დიოდში პირდაპირი დენის გავლისას მასზე მცირე ძაბვა ვარდება. გამოიყენეთ ეს ეფექტი ნათურაზე ძაბვის შესამცირებლად.
  questions: |-
    როგორ იმუშავებს წრედი თუ ორივე დიოდს შემოვატრიალებთ?
    როგორ იმუშავებს წრედი თუ ნათურასა და ერთ დიოდს ადგილებს გავუცვლით?
  methodology: დიოდის მუშაობის პრინციპისა და გამოყენების გაცნობითი სავარჯიშოა. მოსწავლეები
    პრაქტიკულად ნახავენ დიოდზე ძაბვის ვარდნის ეფექტს მასში პირდაპირი დენის გავლის
    დროს და გაიხსენებენ წინაღობის ღილაკით შუნტირების ეფექტს.
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ნათურა ჩამქრალია
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_button_open_dim
      labelKa: ჩამრთველი ჩართულია — ნათურა სუსტად ანათებს
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.08
      - role: diode_1
        metric: forward_current
        op: gt
        value: 0.02
      - role: diode_2
        metric: forward_current
        op: gt
        value: 0.02
    - label: switch_on_button_pressed_bright
      labelKa: ღილაკი დაჭერილია — ნათურის ნათება მომატებულია
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.1
      - role: lamp
        metric: current_vs_prior
        op: gt
        value: 1.08
- code: DI.L1.4
  title: შუქდიოდების ერთნაირად განათება ღილაკით და დიოდებით
  displayOrder: 4
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    დიოდები, ღილაკი, ორი წითელი შუქდიოდი, მხოლოდ ერთი რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ორივე შუქდიოდი უნდა აინთოს, ერთი ცოტა უფრო ძლიერად ვიდრე მეორე;
    თუ დავაწვებით ღილაკს, ორივე შუქდიოდის ნათება უნდა გათანაბრდეს;
    თუ ავუშვებთ ღილაკს, ისევ ძველ მდგომარეობაში დაბრუნდეს.

    ღილაკზე დაჭერით შუქდიოდების განათებები უნდა გათანაბრდეს — სუსტად განათებულმა უნდა გაანათოს ისე ძლიერად, როგორც მეორემ. არ გამოიყენოთ კვების წყაროების შეერთების წერტილი.
  hint: |-
    გამოიყენეთ წინა ამოცანების შედეგები: გამოიყენეთ დიოდზე ძაბვის ვარდნის ეფექტი და შეამცირეთ ძაბვა ერთ-ერთ შუქდიოდზე.
    მიმდევრობით ჩართეთ ორი დიოდი ძაბვის ვარდნის ეფექტის გასაზრდელად; შუქდიოდის ნათების მოსამატებლად დიოდების პარალელურად ჩართეთ ღილაკი.
  questions: |-
    იმუშავებს თუ არა ანალოგიურად წრედი, თუ წითელ შუქდიოდებს სხვა ფერის შუქდიოდით ჩავანაცვლებთ?
    როგორ შეიცვლება წითელი შუქდიოდების ნათება, თუ ერთ-ერთ დიოდს მწვანე შუქდიოდით ჩავანაცვლებთ? ახსენით რატომ.
  methodology: "ამ სავარჯიშოში წინაღობების რაოდენობა შეზღუდულია, შესაბამისად უნდა\
    \ მიხვდნენ, რომ ერთ შუქდიოდზე ძაბვის შესამცირებლად გამოიყენონ დიოდზე (პირდაპირ\
    ი ჩართვის დროს) ძაბვის ვარდნის ეფექტი. შუქდიოდების განათებებს შორის განსხვავებ\
    ის გასაზრდელად ერთმანეთის მიმდევრობით უნდა ჩართონ ორი დიოდი."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — შუქდიოდები ჩამქრალია
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 5.0E-4
      - role: led_2
        metric: forward_current
        op: lt
        value: 5.0E-4
    - label: switch_on_button_open_unequal
      labelKa: "ჩამრთველი ჩართულია — ორივე ანთია, ერთი უფრო ძლიერად"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 3.0E-4
      - role: led_2
        metric: forward_current
        op: gt
        value: 3.0E-4
      - role: leds
        metric: current_ratio
        op: gt
        value: 1.3
      - role: leds
        metric: led_min_forward_current
        op: gt
        value: 2.0E-4
    - label: switch_on_button_pressed_equal
      labelKa: ღილაკი დაჭერილია — სუსტი შუქდიოდიც სრულად ანათებს
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.003
      - role: led_2
        metric: forward_current
        op: gt
        value: 0.003
      - role: leds
        metric: led_min_forward_current
        op: gt_ref:switch_on_button_open_unequal
        value: 1.3
      - role: leds
        metric: current_ratio
        op: lt
        value: 1.5
- code: DI.L3.5
  title: მბრუნავი ძრავით დენის გენერაცია II
  displayOrder: 5
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    დიოდი, ღილაკი, ორი კვების წყარო და ასევე შეგიძლიათ გამოიყენოთ ნაკრებში არსებული თქვენთვის უკვე ნაცნობი ნებისმიერი დეტალები.

    ააწყვეთ წრედი, რომლის საშუალებითაც ვიზუალურად დავინახავთ, როგორ გარდაქმნის მუდმივი დენის ძრავი მექანიკურ ენერგიას ელექტრულ ენერგიად.

    ანალოგიური ამოცანა უკვე იყო ძრავის თემაში. წინასგან განსხვავებით, ამ სავარჯიშოში უნდა გამოიყენოთ მხოლოდ ერთი ღილაკი; სხვა დეტალებთან ერთად შეგიძლიათ გამოიყენოთ დიოდიც.
  hint: |-
    ამოცანაში „მბრუნავი ძრავით დენის გენერაცია I“ გამოყენებული იყო ორი ღილაკის ერთდროულად დაჭერისა და აშვების ეფექტი.
    გაითვალისწინეთ, რომ დიოდი დენს მხოლოდ ერთი მიმართულებით ატარებს. გამოიყენეთ ეს თვისება და ძრავის მიერ გენერირებული დენი მხოლოდ ერთ მოწყობილობაში გაატარეთ.
  questions: |-
    რომელი შუქდიოდები აინთება, თუ ძრავს ხელოვნურად დავატრიალებთ ჯერ ერთი და შემდეგ მეორე მიმართულებით?
    შეაფასეთ, დაახლოებით რამდენ ხანს გაგრძელდებოდა გამორთულ ღილაკზე შუქდიოდის ნათება იდეალური, უდანაკარგო (ხახუნის გარეშე) ძრავის შემთხვევაში.
    როგორ შეიცვლებოდა წრედის მუშაობა, თუ ძრავზე გარკვეული მასის დისკოს ან ბორბალს დავამაგრებდით?
  methodology: "მსგავსი ამოცანა ძრავითა და ორი ღილაკით უკვე შესრულებული აქვთ. ამ შ\
    ემთხვევაშიც მოეთხოვებათ კრეატიული აზროვნება და აქვთ სრული თავისუფლება, გამოიყე\
    ნონ ნებისმიერი უკვე ნასწავლი დეტალი ნაკრებიდან. წრედში დიოდის სწორად ჩასმით მე\
    ორე ღილაკი აღარ იქნება საჭირო და უფრო თვალსაჩინო გახდება ძრავის ბრუნვის ენერგი\
    ის ხარჯზე შუქდიოდის გახანგრძლივებული ნათება."
- code: DI.L3.6
  title: სინქრონული ანთება და ასინქრონული ჩაქრობა
  displayOrder: 6
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ერთი ცვლადი რეზისტორი, ერთი დიოდი, კონდენსატორი, ორი შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ცვლადი რეზისტორის ცოცია დააყენეთ შუაში. წრედის აწყობის შემდეგ ორივე შუქდიოდი თითქმის ერთნაირად უნდა აინთოს;
    თუ ცოციას გადავაადგილებთ ერთი მიმართულებით, ორივე შუქდიოდის ნათებამ ერთნაირად და თანაბრად უნდა მოიმატოს;
    თუ ცოციას გადავაადგილებთ მეორე მიმართულებით, ერთი შუქდიოდის ნათება უნდა მცირდებოდეს ცოციას გადაადგილების შესაბამისად, ხოლო მეორის ნათება უფრო ნელა და მდორედ უნდა მცირდებოდეს.

    ერთი მიმართულებით ნათება სინქრონულად უნდა მატულობდეს, მეორე მიმართულებით კი ერთი შუქდიოდი უფრო სწრაფად უნდა ქრებოდეს, მეორე კი დროში ჩამორჩებოდეს.
  hint: |-
    კონდენსატორი და დიოდი ისე ჩართეთ, რომ ძაბვის ზრდისას კონდენსატორი იმუხტებოდეს, ხოლო ძაბვის შემცირებისას დიოდმა მისი სწრაფი განმუხტვა შეაფერხოს.
    თანაბარი ნათებისთვის ორივე შუქდიოდს მიმდევრობით ჩაურთეთ ერთნაირი წინაღობები.
  questions: |-
    როგორ შეიცვლება წრედის მუშაობის პრინციპი, თუ დიოდს მოვატრიალებთ?
    როგორ შეიძლება მეორე შუქდიოდის დროში ჩამორჩენის ეფექტის გაზრდა ან შემცირება?
  methodology: "ცვლადი რეზისტორი უნდა გამოიყენონ როგორც ძაბვის გამყოფი და ცოციას გ\
    ადაადგილებით მიიღონ ხან მზარდი, ხან კლებადი ძაბვა. დიოდისა და კონდენსატორის წყ\
    ვილით ენერგია მხოლოდ ერთი შუქდიოდისთვის უნდა შეინახონ. ერთი შუქდიოდი ზუსტად ას\
    ახავს ძაბვის ცვლილებას, მეორე კი კლებისას დროში მნიშვნელოვნად ჩამორჩება. მოსწა\
    ვლეებმა კარგად უნდა გაიაზრონ დიოდის გავლით კონდენსატორის დამუხტვა-განმუხტვის ც\
    იკლი."
  validation:
    cases:
    - label: pot_mid_equal
      labelKa: ცოცია შუაში — ორივე შუქდიოდი თითქმის ერთნაირად ანთია
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 2.0E-4
      - role: led_2
        metric: forward_current
        op: gt
        value: 2.0E-4
      - role: leds
        metric: current_ratio
        op: lt
        value: 5.0
      potPositions:
        variable_resistor: 0.5
    - label: pot_bright_sync
      labelKa: ცოცია ერთ ნაპირზე — ორივე ნათება სინქრონულად მატულობს
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 5.0E-4
      - role: led_2
        metric: forward_current
        op: gt
        value: 5.0E-4
      - role: leds
        metric: lit_forward_current_vs_prior
        op: gt
        value: 1.2
      - role: leds
        metric: current_ratio
        op: lt
        value: 5.0
      potPositions:
        variable_resistor: 0.0
    - label: pot_dim_async_hold
      labelKa: "ცოცია მეორე ნაპირზე — ერთი სწრაფად ქრება, მეორე ჩამორჩება"
      checks:
      - role: leds
        metric: tran_forward_current_start_max
        op: gt
        value: 5.0E-4
      - role: leds
        metric: tran_forward_current_at_0.2_min
        op: lt
        value: 5.0E-4
      - role: leds
        metric: tran_forward_current_at_0.2_max
        op: gt
        value: 5.0E-4
      simPhase: discharge
      potPositions:
        variable_resistor: 1.0
- code: DI.L3.7
  title: ერთი მიმართულებით მბრუნავი ძრავი
  displayOrder: 7
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ძრავი, დიოდები, ორი ცალი რბილი გამტარი, ორი კვების წყარო და ასევე შეგიძლიათ გამოიყენოთ ნებისმიერი უკვე ნაცნობი დეტალები ნაკრებიდან.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    კვების წყაროს დადებით პოლუსზე მიაერთეთ წითელი რბილი გამტარი, უარყოფითზე — შავი გამტარი; მხოლოდ ამ ორი გამტარით დააკავშირეთ კვების წყარო თქვენს წრედს.

    წრედის აწყობის და რბილი გამტარების შეერთების შემდეგ ძრავი უნდა დატრიალდეს ერთი მიმართულებით;
    თუ წითელ და შავ გამტარებს კვების წყაროზე გავუცვლით ადგილს (ეს ნიშნავს, რომ წრედს მივაწოდეთ უარყოფითი ძაბვა), ძრავი უნდა დატრიალდეს იგივე მიმართულებით;
    თუ წითელ და შავ გამტარებს დავაბრუნებთ ძველ პოზიციაზე, ძრავი იგივე მიმართულებით უნდა დატრიალდეს.

    როგორი პოლარობითაც არ უნდა ჩავრთოთ კვების წყარო წრედში, ძრავი ყოველთვის ერთი მიმართულებით უნდა ბრუნავდეს. არ გამოიყენოთ კვების შეერთების წერტილი.
  hint: "დაბალი წინაღობის რეზისტორების გამოყენებით მიიღეთ კვების ძაბვის ნახევარი ძ\
    აბვა. ამ ძაბვის (რეზისტორების შეერთების წერტილის) მიმართ, კვების პოლარობის მიუ\
    ხედავად, წრედში ყოველთვის გექნებათ როგორც დადებითი, ასევე უარყოფითი ძაბვა. გამ\
    ოიყენეთ დიოდები და ისე ჩართეთ წრედში, რომ დენმა ყოველთვის ერთი მიმართულებით გა\
    იაროს ძრავში."
  questions: "წრედი გადააკეთეთ ისე, რომ ძრავი ყოველთვის ტრიალებდეს მეორე მიმართულე\
    ბით. როგორ შეიცვლება წრედის მუშაობა, თუ წრედში გამოყენებულ დიოდებს მოვატრიალებ\
    თ?"
  methodology: "პირობის თანახმად, რადგან ნახევარი ძაბვის გამოყენების თავისუფლება ა\
    რ აქვთ, უნდა მოიფიქრონ დაბალწინაღობიანი ძაბვის გამყოფის გამოყენება. კარგად უნდ\
    ა აღიქვან კვების პოლარობის შეცვლის შინაარსი, უნდა მიხვდნენ როგორ იცვლება ძაბვე\
    ბი გამყოფი რეზისტორების შეერთების წერტილის (ნახევარი ძაბვის) მიმართ და მოახერხ\
    ონ, რომ დიოდების გამოყენებით დენი ყოველთვის ერთი მიმართულებით გადიოდეს ძრავში."
  validation:
    cases:
    - label: supply_normal
      labelKa: "წითელი (+), შავი (−) — ძრავი ერთი მიმართულებით ტრიალებს"
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.04
    - label: supply_reversed_same_spin
      labelKa: წითელი და შავი გაცვლილი — იგივე მიმართულება
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.04
      - role: motor_1
        metric: current_reversed_vs_prior
        op: lt
        value: 0.5
- code: DI.L4.8
  title: ერთი მიმართულებით გამავალი დენი
  displayOrder: 8
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    დიოდები, ერთი მწვანე და ორი წითელი შუქდიოდი, მხოლოდ ერთი რეზისტორი და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    კვების წყაროს დადებით პოლუსზე მიაერთეთ წითელი რბილი გამტარი, უარყოფითზე — შავი გამტარი; მხოლოდ ამ ორი გამტარით დააკავშირეთ კვების წყარო თქვენს წრედს.

    წრედის აწყობის და რბილი გამტარების შეერთების შემდეგ მწვანე შუქდიოდი უნდა აინთოს;
    თუ წითელ და შავ გამტარებს კვების წყაროზე გავუცვლით ადგილს (ეს ნიშნავს, რომ წრედს მივაწოდეთ უარყოფითი ძაბვა), მწვანე შუქდიოდი უნდა დარჩეს ანთებული — წითელი შუქდიოდების ნათებას ნუ მიაქცევთ ყურადღებას;
    თუ წითელ და შავ გამტარებს დავაბრუნებთ ძველ პოზიციაზე, მწვანე შუქდიოდი ისევ უნდა აინთოს.

    ნაწილობრივ ეს სავარჯიშო გავს წინა ამოცანას: როგორი პოლარობითაც არ უნდა ჩავრთოთ კვების წყარო, მწვანე შუქდიოდი ყოველთვის უნდა აინთოს.
  hint: |-
    ამ სავარჯიშოში წითელი შუქდიოდები გამოიყენება მხოლოდ იმიტომ, რომ ნაკრებში არ არის დამატებით კიდევ ორი დიოდი — ისინი გამოიყენეთ როგორც დიოდები და ნუ მიაქცევთ ყურადღებას მათ ნათებას.
    მიმდევრობით ჩართეთ დიოდი და შუქდიოდი. ორი ასეთი წყვილი ჩართეთ ერთმანეთის პარალელურად.
    კვების პოლუსები მიაერთეთ დიოდისა და შუქდიოდის შეერთების წერტილებში; მიღებულ წრედში მოძებნეთ ორი ისეთი წერტილი, სადაც დენი ყოველთვის ერთი მიმართულებით გაივლის კვების პოლარობის შეცვლის მიუხედავად.
  questions: |-
    იმუშავებს თუ არა წრედი ანალოგიურად, თუ დიოდებს ჩავანაცვლებთ ლურჯი შუქდიოდებით?
    როგორ იმუშავებს წრედი, თუ მწვანე შუქდიოდს შემოვატრიალებთ?
    როგორ იმუშავებს წრედი, თუ მწვანე შუქდიოდის გარდა ორივე დიოდს და ორივე შუქდიოდს შემოვატრიალებთ?
  methodology: "ნაწილობრივ ეს სავარჯიშო გავს წინა ამოცანას. ამ შემთხვევაშიც მავთულ\
    ების პერიოდული გადართვით ხელოვნურად ხდება ცვალადი დენის გენერაცია. ამოცანის ძი\
    რითადი მიზანია, რომ მოსწავლეებმა დამოუკიდებლად მოიფიქრონ და ააწყონ დიოდური ხიდ\
    ი ორი დიოდისა და ორი შუქდიოდის გამოყენებით. ხიდში გამოყენებული შუქდიოდების ნათ\
    ება შეიძლება გამოადგეთ მისი მუშაობის პრინციპის აღქმასა და დენების მოძრაობის ვი\
    ზუალიზაციისთვის."
  validation:
    cases:
    - label: supply_normal
      labelKa: "წითელი (+), შავი (−) — მწვანე შუქდიოდი ანთია"
      checks:
      - role: led_green
        metric: forward_current
        op: gt
        value: 0.001
    - label: supply_reversed_green_on
      labelKa: წითელი და შავი გაცვლილი — მწვანე ისევ ანთია
      checks:
      - role: led_green
        metric: forward_current
        op: gt
        value: 0.001
