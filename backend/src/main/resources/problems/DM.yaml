- code: DM.L3.14
  title: მბრუნავი ძრავით დენის გენერაცია I
  displayOrder: 14
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ძრავი, ორი კვების წყარო; ასევე შეგიძლიათ გამოიყენოთ ნაკრებში არსებული თქვენთვის უკვე ნაცნობი ნებისმიერი დეტალები.

    ააწყვეთ წრედი, რომლის საშუალებითაც ვიზუალურად დავინახავთ, როგორ გარდაქმნის მუდმივი დენის ძრავი მექანიკურ ენერგიას ელექტრულ ენერგიად.

    შედეგისთვის შეგიძლიათ უკვე ნასწავლი დეტალებიდან გამოიყენოთ ნებისმიერი ტიპის და რაოდენობის დეტალები.
  hint: |-
    გამოიყენეთ ძრავის ინერციული ბრუნვა კვების შეწყვეტის შემდეგ — კვების გამორთვის შემდეგ ძრავი მცირე ხნით ინერციით მაინც აგრძელებს ბრუნვას;
    მოიფიქრეთ, ნაკრებში არსებული დეტალებით როგორ შეიძლება გაგრძელდეს გენერირებული დენის ინდიკაცია.
  questions: |-
    რომელი შუქდიოდის გამოყენება ჯობია ამ ამოცანაში — წითლის, ლურჯის თუ მწვანის? რატომ?
    თეორიულად, როგორ შეგვიძლია გავზარდოთ შუქდიოდის ნათების ხანგრძლივობა კვების გათიშვის შემდეგ?
  methodology: "ეს სავარჯიშო განსხვავდება წინა ამოცანებისგან, რადგან მოითხოვს არას\
    ტანდარტული გადაწყვეტების მიღებას — კარგი საშუალებაა ცოდნისა და უნარების შესაფა\
    სებლად: რამდენად კარგად ესმით დეტალების მუშაობის პრინციპი და რამდენად შეუძლიათ\
    \ არსებული რესურსებით საჭირო შედეგის მიღწევა. ეხმარება მუდმივი დენის ძრავის მუ\
    შაობის პრინციპის უკეთ გაგებაში."
