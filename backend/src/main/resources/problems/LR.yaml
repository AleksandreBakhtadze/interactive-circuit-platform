chapter: LR
problems:
- code: LR.L1.1
  title: ორი შუქდიოდის ანთება ღილაკით და ორი კვების წყაროთი
  displayOrder: 1
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ერთი ღილაკი, ორი წითელი შუქდიოდი, ერთი რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდები არ უნდა აინთოს;
    თუ ღილაკს დავაწვებით, ორივე შუქდიოდი უნდა აინთოს;
    თუ ღილაკს ავუშვებთ, ორივე შუქდიოდი უნდა გამოირთოს.
  hint: |-
    იმისათვის რომ ორივე შუქდიოდი აინთოს, ორივე მათგანში ერთდროულად უნდა გადიოდეს დენი; შუქდიოდები ისე უნდა ჩავრთოთ ერთმანეთის მიმართ, რომ თუ ერთში გაივლის დენი აუცილებლად გაიაროს მეორეშიც.
    შუქდიოდები და რეზისტორი ჩართეთ მიმდევრობით.
    შუქდიოდები ჩართეთ პარალელურად და მათ მიმდევრობით ჩაურთეთ რეზისტორი.
  questions: |-
    როგორ აინთება შუქდიოდები თუ ერთ-ერთ მათგანს შებრუნებით ჩავრთავთ? მიმდევრობითი ჩართვის დროს და პარალელური ჩართვის დროს.
    როგორ აინთება შუქდიოდები თუ ორივე მათგანს შებრუნებით ჩავრთავთ? მიმდევრობითი ჩართვის დროს და პარალელური ჩართვის დროს.
  methodology: "ამოცანის ამოხსნა შესაძლებელია ორი გზით: პირველი ვარიანტი, როდესაც\
    \ წრედში შუქდიოდები ჩართულია მიმდევრობით და მეორე, შუქდიოდები ჩართულია პარალელ\
    ურად. სასურველია ორივე ვარიანტით ამოხსნა და წრედში დენის ნაკადების მოძრაობის გ\
    ანხილვა."
  validation:
    cases:
    - label: Switch off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: "Switch off, button pressed"
      labelKa: "ჩამრთველი გამორთული, ღილაკი დაჭერილი"
      switchStates:
        switch: open
        button_1: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: "Switch on, button open"
      labelKa: "ჩამრთველი ჩართული, ღილაკი არ არის დაჭერილი"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: "Switch on, button pressed"
      labelKa: "ჩამრთველი ჩართული, ღილაკი დაჭერილი"
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 2.0
- code: LR.L1.2
  title: ორი შუქდიოდის ანთება ღილაკით და ერთი კვების წყაროთი
  displayOrder: 2
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ერთი ღილაკი, ორი წითელი შუქდიოდი, ერთი რეზისტორი, ერთი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდები არ უნდა აინთოს;
    თუ ღილაკს დავაწვებით, ორივე შუქდიოდი უნდა აინთოს;
    თუ ღილაკს ავუშვებთ, ორივე შუქდიოდი უნდა გამოირთოს.

    ეს არის წინა სავარჯიშოს მსგავსი ამოცანა იმ განსხვავებით, რომ უნდა გამოიყენოთ მხოლოდ ერთი კვების წყარო.
  hint: |-
    გაითვალისწინეთ რა ძაბვაზე იწყებს წითელი შუქდიოდი ანთებას.
    განიხილეთ რა ძაბვები იქნება მოდებული შუქდიოდებზე, მიმდევრობითი და პარალელური ჩართვის დროს.
    განსაზღვრეთ რა ძაბვაა საჭირო მიმდევრობით ჩართული ორი წითელი შუქდიოდის ასანთებად.
  questions: |-
    როგორ შეიცვლება შუქდიოდების ნათება თუ არსებულ წინაღობას შევცვლით უფრო მაღალი წინაღობით?
    როგორ იმუშავებს წრედი თუ ღილაკს და ჩამრთველს გავუცვლით ადგილებს?
  methodology: "გამოიყენონ წინა სავარჯიშოს გამოცდილება; უნდა ახსნან თუ რატომ არ იმ\
    უშავებს მიმდევრობით ჩართული შუქდიოდები. გაითვალისწინონ, რომ შუქდიოდი ანთებას ი\
    წყებს მხოლოდ ზღვრული (მინიმალური) ძაბვის გადალახვის შემდეგ. ორივე წრედში შეადა\
    რონ ანთების ძაბვების მნიშვნელობა კვების ძაბვას."
  validation:
    cases:
    - label: Switch off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: "Switch off, button pressed"
      labelKa: "ჩამრთველი გამორთული, ღილაკი დაჭერილი"
      switchStates:
        switch: open
        button_1: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: "Switch on, button open"
      labelKa: "ჩამრთველი ჩართული, ღილაკი არ არის დაჭერილი"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: "Switch on, button pressed"
      labelKa: "ჩამრთველი ჩართული, ღილაკი დაჭერილი"
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 2.0
- code: LR.L1.3
  title: ორი შუქდიოდის ანთება განსხვავებული ნათებით
  displayOrder: 3
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ერთი ღილაკი, ორი წითელი შუქდიოდი, ერთი ან რამდენიმე რეზისტორი, ერთი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდები არ უნდა აინთოს;
    თუ ღილაკს დავაწვებით, ორივე შუქდიოდი უნდა აინთოს — ერთი უფრო ძლიერად, მეორე კი სუსტად;
    თუ ღილაკს ავუშვებთ, ორივე შუქდიოდი უნდა გამოირთოს.

    ეს არის წინა სავარჯიშოს მსგავსი ამოცანა იმ განსხვავებით, რომ ერთი შუქდიოდი უნდა ანათებდეს უფრო ძლიერად, მეორე კი სუსტად.
  hint: |-
    იმისათვის რომ შუქდიოდები განსხვავებული სიძლიერით ანათებდეს მათში უნდა გადიოდეს განსხვავებული დენის ნაკადი.
    ამოცანის ამოსახსნელად საჭიროა ორი განსხვავებული წინაღობის გამოყენება.
    დაბალი წინაღობის რეზისტორი ჩართეთ პირველი შუქდიოდის მიმდევრობით; მაღალი წინაღობის რეზისტორი ჩართეთ მეორე შუქდიოდის მიმდევრობით.
  questions: |-
    როგორ შეიცვლება შუქდიოდების ნათება თუ წინაღობებს გავუცვლით ადგილებს?
    როგორ შეიცვლება შუქდიოდების ნათება თუ მათ დავაკავშირებთ გამტარით?
  methodology: "ამ ამოცანის მთავარი შინაარსია, რომ შეძლონ წრედში განსხვავებული დენ\
    ის ნაკადების მიღება რეზისტორების გამოყენებით. მიღებული შედეგი ვიზუალურად კარგა\
    დ ჩანს შუქდიოდების ნათების სახით."
  validation:
    cases:
    - label: Switch off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: "Switch off, button pressed"
      labelKa: "ჩამრთველი გამორთული, ღილაკი დაჭერილი"
      switchStates:
        switch: open
        button_1: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: "Switch on, button open"
      labelKa: "ჩამრთველი ჩართული, ღილაკი არ არის დაჭერილი"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: "Switch on, button pressed"
      labelKa: "ჩამრთველი ჩართული, ღილაკი დაჭერილი"
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 2.0
      - role: leds
        metric: current_ratio
        op: gt
        value: 2.0
- code: LR.L2.4
  title: შუქდიოდის და ნათურის ანთება ღილაკით
  displayOrder: 4
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ღილაკი, წითელი შუქდიოდი, ნათურა, ერთი ან რამდენიმე რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, არც შუქდიოდი და არც ნათურა არ უნდა აინთოს;
    თუ ღილაკს დავაწვებით, ორივე — ნათურაც და შუქდიოდიც — უნდა აინთოს;
    თუ ღილაკს ავუშვებთ, ორივე უნდა გამოირთოს.
  hint: |-
    გაითვალისწინეთ, რომ ნათურის ასანთებად საჭიროა ბევრად მეტი დენის ნაკადი, ვიდრე შუქდიოდის ასანთებად.
    წინაღობის გავლით ნათურა აინთება ძალიან სუსტად ან საერთოდ ვერ აინთება.
    ნათურა ჩაირთოს პირდაპირ კვების წყაროზე, შუქდიოდი კი წინაღობის გავლით.
  questions: |-
    შესაძლებელია თუ არა ამ ამოცანის ამოხსნა წინაღობის გამოყენების გარეშე?
    შესაძლებელია თუ არა ნათურის ნათების შემცირება, როგორ?
  methodology: "უნდა გაითვალისწინონ წინა ამოცანის გამოცდილება; განსხვავებაა მხოლოდ\
    \ ის, რომ ნათურას არ სჭირდება წინაღობის ჩართვა მიმდევრობით, შუქდიოდისთვის კი ა\
    უცილებელია. უნდა მიხვდნენ, რომ ნათურის და შუქდიოდის დენის ნაკადები (ღილაკის შე\
    მდეგ) ერთმანეთისგან დამოუკიდებელია."
  validation:
    cases:
    - label: Switch off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      - role: led_1
        metric: current
        op: lt
        value: 0.001
    - label: "Switch off, button pressed"
      labelKa: "ჩამრთველი გამორთული, ღილაკი დაჭერილი"
      switchStates:
        switch: open
        button_1: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      - role: led_1
        metric: current
        op: lt
        value: 0.001
    - label: "Switch on, button open"
      labelKa: "ჩამრთველი ჩართული, ღილაკი არ არის დაჭერილი"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      - role: led_1
        metric: current
        op: lt
        value: 0.001
    - label: "Switch on, button pressed"
      labelKa: "ჩამრთველი ჩართული, ღილაკი დაჭერილი"
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.01
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.001
- code: LR.L2.5
  title: შუქდიოდის და ნათურის ანთება ორი ღილაკით
  displayOrder: 5
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ორი ღილაკი, წითელი შუქდიოდი, ნათურა, ერთი ან რამდენიმე რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, არც შუქდიოდი და არც ნათურა არ უნდა აინთოს;
    თუ დავაწვებით პირველ ღილაკს, უნდა აინთოს მხოლოდ ნათურა;
    თუ დავაწვებით მეორე ღილაკს, უნდა აინთოს მხოლოდ შუქდიოდი;
    თუ დავაწვებით ორივე ღილაკს, უნდა აინთოს ნათურაც და შუქდიოდიც;
    თუ ავუშვებთ ღილაკებს, ორივე უნდა გამოირთოს.
  hint: |-
    ერთმა ღილაკმა გა გაატაროს მხოლოდ ნათურის დენის ნაკადი, ხოლო მეორემ — მხოლოდ შუქდიოდის.
    ერთი ღილაკი ჩართეთ მიმდევრობით მხოლოდ ნათურასთან, ხოლო მეორე ჩართეთ მიმდევრობით მხოლოდ შუქდიოდთან.
  questions: |-
    როგორ იმუშავებს წრედი თუ ნათურას შემოვატრიალებთ?
    როგორ იმუშავებს წრედი თუ შუქდიოდს შემოვატრიალებთ?
    წრედი გადააკეთეთ ისე, რომ ერთ-ერთი ღილაკის დაჭერისას აინთოს ორივე — ნათურაც და შუქდიოდიც.
  methodology: "ამოცანის მთავარი მიზანია სწორად ჩართონ წრედში მეორე ღილაკი. უნდა მ\
    იხვდნენ, რომ ნათურის და შუქდიოდის წრედები (ჩამრთველის შემდეგ) ერთმანეთისგან და\
    მოუკიდებელია, თავიანთი ღილაკებით."
  validation:
    cases:
    - label: Switch off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
        button_1: open
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      - role: led_1
        metric: current
        op: lt
        value: 0.001
    - label: "Switch on, both buttons open"
      labelKa: "ჩამრთველი ჩართული, ღილაკები არ არის დაჭერილი"
      switchStates:
        switch: closed
        button_1: open
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      - role: led_1
        metric: current
        op: lt
        value: 0.001
    - label: Only first button pressed (lamp)
      labelKa: ჩართულია მხოლოდ პირველი ღილაკი — ნათურა
      switchStates:
        switch: closed
        button_1: closed
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.01
      - role: led_1
        metric: current
        op: lt
        value: 0.001
    - label: Only second button pressed (LED)
      labelKa: ჩართულია მხოლოდ მეორე ღილაკი — შუქდიოდი
      switchStates:
        switch: closed
        button_1: open
        button_2: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.001
    - label: Both buttons pressed
      labelKa: "ჩამრთველი ჩართული, ორივე ღილაკი დაჭერილი"
      switchStates:
        switch: closed
        button_1: closed
        button_2: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.01
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.001
- code: LR.L3.6
  title: შუქდიოდის ჩაქრობა ღილაკით
  displayOrder: 6
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ღილაკი, წითელი შუქდიოდი, ერთი ან რამდენიმე რეზისტორი და ერთი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ შუქდიოდი უნდა აინთოს;
    თუ დავაწვებით ღილაკს, შუქდიოდი უნდა ჩაქრეს;
    თუ ავუშვებთ ღილაკს, შუქდიოდი ისევ უნდა აინთოს.

    ეს პირველი შემთხვევაა, როდესაც ღილაკზე დაჭერისას შუქდიოდი უნდა ჩაქრეს.
  hint: |-
    ღილაკი დაჭერილ მდგომარეობაში ჩვეულებრივი გამტარია. ჩართეთ იგი ისე, რომ დენის ნაკადმა შუქდიოდის ნაცვლად ღილაკის გავლით გაიაროს.
    ღილაკი ჩართეთ შუქდიოდის პარალელურად, მაგრამ კვებასთან აუცილებლად რეზისტორის გავლით.
  questions: |-
    როგორ შეიცვლება მუშაობა ერთი კვების წყაროს ნაცვლად ორი კვების წყაროს გამოყენებისას?
    როგორ შეიცვლება მუშაობა ღილაკის ნაცვლად ჩამრთველის გამოყენებისას?
  methodology: "არ უნდა მიიღონ შედეგი კვების წყაროს მოკლე ჩართვით. ღილაკი უნდა ჩაი\
    რთოს მხოლოდ რეზისტორის გავლით და შუქდიოდის პარალელურად, რათა დაჭერისას უსაფრთხ\
    ოდ წაართვას LED-ს დენის ნაკადი."
  validation:
    cases:
    - label: Button released
      labelKa: ღილაკი არ არის დაჭერილი
      switchStates:
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 1.0E-4
    - label: Button pressed
      labelKa: ღილაკი დაჭერილი
      switchStates:
        button_1: closed
      checks:
      - role: led_1
        metric: current
        op: lt
        value: 1.0E-4
- code: LR.L2.7
