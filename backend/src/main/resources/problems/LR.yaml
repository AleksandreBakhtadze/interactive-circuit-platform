      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: Switch on
      labelKa: ჩამრთველი ჩართული — ორივე LED დაახლოებით თანაბრად ანთია
      switchStates:
        switch: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 2.0
      - role: leds
        metric: current_ratio
        op: lte
        value: 1.15
