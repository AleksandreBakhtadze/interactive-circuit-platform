    შესაბამისი შუქდიოდებით.
  questions: |-
    შესაძლებელია თუ არა იგივე ამოცანის გაკეთება მხოლოდ ერთი კვების წყაროს გამოყენებით?
    წრედი გადააკეთეთ ისე, რომ ლურჯი შუქდიოდები ანათებდნენ ყველაზე ძლიერად, შემდეგ მწვანე და ბოლოს ყველაზე სუსტად წითლები.
  methodology: "სავარჯიშოს ძირითადი მიზანია, რომ ერთ წრედში გამოიყენონ ნაკრების ბე\
    ვრი დეტალი, სწორად გადაანაწილონ დაფის სივრცე და გამოიყენონ წინა ამოცანის შედეგ\
    ი."
  validation:
    cases:
    - label: No button pressed
      labelKa: ღილაკები არ არის დაჭერილი — ყველა ჩამქრალი
      switchStates:
        button_1: open
        button_2: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: Only first button pressed
      labelKa: მხოლოდ პირველი ღილაკი დაჭერილი — წითლები
      switchStates:
        button_1: closed
        button_2: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 2.0
    - label: Only second button pressed
      labelKa: მხოლოდ მეორე ღილაკი დაჭერილი — მწვანეები
      switchStates:
        button_1: open
        button_2: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 2.0
    - label: Both buttons pressed
      labelKa: ორივე ღილაკი დაჭერილი — ყველა ანთია
      switchStates:
        button_1: closed
        button_2: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 6.0
