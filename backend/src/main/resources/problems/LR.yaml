    შესაძლებელია თუ არა შედეგის მიღება მხოლოდ ერთი რეზისტორით?
  methodology: "ამოხსნა შესაძლებელია ორი გზით: ღილაკით დამატებითი დენის მიწოდებით\
    \ ან ერთ-ერთი მიმდევრობითი რეზისტორის დამოკლებით, რაც ამცირებს ჯამურ წინაღობას\
    \ და ზრდის LED-ის დენს."
  validation:
