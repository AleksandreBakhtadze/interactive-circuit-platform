    ერთი წითელი და ერთი მწვანე შუქდიოდი, ერთი რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ორივე შუქდიოდი დაახლოებით ერთნაირი ნათებით უნდა აინთოს;
    თუ ჩამრთველით გამოვრთავთ, ორივე შუქდიოდი უნდა ჩაქრეს.
