- code: LR.L2.13
  title: როგორ იმუშავებს შუქდიოდი? ვარიანტი-I
  displayOrder: 13
  difficulty: beginner
  description: |-
    ააწყვეთ სურათზე მოცემული წრედი (ორი 3 ვ კვების წყარო, ჩამრთველი, ღილაკი, წითელი შუქდიოდი და ორი 1 kΩ რეზისტორი).

    გამოიყენეთ სიმულაცია და დააკვირდით:
    • ჩამრთველით წრედის ჩართვისას;
    • ჩართულ წრედში ღილაკზე დაჭერისას;
    • გამორთულ წრედში ღილაკზე დაჭერისას.

    შემდეგ უპასუხეთ ქვემოთ მოცემულ ტესტის კითხვებს და დააჭირეთ შემოწმებას.
  hint: ზედა კვების წყარო შუქდიოდს ჩამრთველისა და ზედა რეზისტორის გავლით კვებავს.
    ღილაკი ქვედა კვების წყაროს შუა წერტილს მეორე რეზისტორის გავლით იმავე LED-ის შტოს
    უერთებს.
  questions: |-
    1. რა მოხდება თუ ჩამრთველით ჩავრთავთ წრედს?
    ა. შუქდიოდი აინთება;
    ბ. შუქდიოდი არ აინთება;
    გ. შუქდიოდი იციმციმებს;

    2. როგორ შეიცვლება შუქდიოდის ნათება თუ დავაწვებით ღილაკს?
    ა. მოიმატებს;
    ბ. მოიკლებს;
    გ. არ შეიცვლება;

    3. რა მოხდება თუ ჩამრთველის ჩართვის გარეშე დავაწვებით ღილაკს?
    ა. შუქდიოდი არ აინთება;
    ბ. შუქდიოდი აინთება;
    გ. მოხდება მოკლე ჩართვა;
  methodology: "ეს ტესტი არის კარგი ვიზუალური მაგალითი, თუ როგორ მიედინება დენი წრ\
    ედში მაღალი ძაბვიანი წერტილიდან დაბლისკენ. შუქდიოდის ნათება კარგად აჩვენებს ამ\
    \ დენის ნაკადების ცვლილებებს."
