    რადგან მოთხოვნილია ერთნაირი ნათება, სასურველია ერთნაირმა დენის ნაკადმა გაიაროს ორივე შუქდიოდში. რომელი ჩართვა ჯობია ამ შემთხვევაში?
  questions: |-
    როგორ შეიცვლება შუქდიოდების ნათება, თუ მათ ადგილებს გავუცვლით?
    როგორ იმუშავებს წრედი, თუ მწვანე შუქდიოდს შებრუნებით ჩავრთავთ?
    შეიძლება თუ არა შუქდიოდების პარალელურად ჩართვა და რატომ?
  methodology: "რადგან მოთხოვნილია მხოლოდ ერთი რეზისტორის გამოყენება, ამოცანა იხსნ\
