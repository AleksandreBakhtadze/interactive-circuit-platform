- code: LR.L3.10
  title: ორი შუქდიოდის ნათების ცვლილება ღილაკით
  displayOrder: 10
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ღილაკი, ორი წითელი შუქდიოდი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ორივე შუქდიოდი უნდა აინთოს;
    თუ დავაწვებით ღილაკს, ერთი შუქდიოდის ნათებამ უნდა მოიმატოს, ხოლო მეორე შუქდიოდის ნათებამ უნდა მოიკლოს;
    თუ ავუშვებთ ღილაკს, ორივეს ნათება უნდა დაბრუნდეს საწყის მდგომარეობაში.
  hint: |-
    გამოიყენეთ „შუქდიოდის ნათების მოკლება" ამოცანის წრედი და მოძებნეთ ადგილი, სადაც ღილაკზე დაჭერისას გამავალი დენის ნაკადი იზრდება.
    მეორე შუქდიოდი მიმდევრობით ჩასვით წრედის იმ ნაწილში, სადაც ღილაკზე დაჭერისას დენის ნაკადი იზრდება.
  questions: |-
    როგორ შეიცვლება წრედის მუშაობის პრინციპი, თუ შუქდიოდს, რომლის ნათებაც მცირდება, შებრუნებით ჩავრთავთ?
    როგორ შეიცვლება წრედის მუშაობის პრინციპი, თუ შუქდიოდს, რომლის ნათებაც იზრდება, შებრუნებით ჩავრთავთ?
  methodology: "ამ სავარჯიშოს შესრულება ეხმარება წრედის კარგად გაანალიზებაში, დენი\
    ს ნაკადების ძალისა და მიმართულებების დადგენაში და შუქდიოდებისთვის წრედში სწორი\
    \ პოზიციის მოძებნაში."
  validation:
    cases:
    - label: Switch off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: "Switch on, button released"
      labelKa: "ჩამრთველი ჩართული, ღილაკი არ არის დაჭერილი"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 2.0
      - role: leds
        metric: led_min_forward_current
        op: gt
        value: 1.0E-4
      - role: leds
        metric: led_max_forward_current
        op: gt
        value: 1.0E-4
    - label: "Switch on, button pressed"
      labelKa: "ჩამრთველი ჩართული, ღილაკი დაჭერილი — ერთი იმატებს, მეორე იკლებს"
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 2.0
      - role: leds
        metric: led_min_forward_current
        op: "lt_ref:Switch on, button released"
        value: 0.8
      - role: leds
        metric: led_max_forward_current
        op: "gt_ref:Switch on, button released"
        value: 1.02
      - role: leds
        metric: current_ratio
        op: gt
        value: 2.0
- code: LR.L1.11
  title: წითელი და მწვანე შუქდიოდების ანთება ორი კვების წყაროთი
  displayOrder: 11
