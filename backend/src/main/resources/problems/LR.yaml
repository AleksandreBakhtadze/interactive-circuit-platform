- code: LR.L4.20
  title: გამომრიცხავი შუქდიოდები ორი ღილაკით და ორი კვების წყაროთი
  displayOrder: 20
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ორი ღილაკი, ორი წითელი შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ორივე შუქდიოდი უნდა იყოს ჩამქრალი;
    თუ დავაწვებით პირველ ღილაკს, უნდა აინთოს პირველი შუქდიოდი;
    თუ დავაწვებით მეორე ღილაკს, უნდა აინთოს მეორე შუქდიოდი;
    თუ დავაწვებით ორივე ღილაკს, ორივე შუქდიოდი უნდა ჩაქრეს.

    ეს არის წინა სავარჯიშოს მსგავსი ამოცანა, ოღონდ ორი კვების წყაროს გამოყენებით. ამოხსნისას შეგიძლიათ გამოიყენოთ კვებების მიერთების (შუა) წერტილი.
  hint: |-
    გამოიყენეთ ის ფაქტი, რომ ძაბვა ორი კვების წყაროს მიერთების წერტილში სრული ძაბვის ნახევარია: თუ ორი კვება გვაძლევს 6 ვ-ს, მიერთების წერტილში იქნება 3 ვ.
    თუ ორ ერთნაირ რეზისტორს მიმდევრობით ჩავრთავთ პირდაპირ კვების წყაროზე, მათ მიერთების წერტილშიც ძაბვა იქნება კვების ძაბვის ნახევარი.
    თუ წრედის ორ წერტილს შორის ძაბვა თანაბარია, დენი არც ერთი მიმართულებით არ გაივლის.
  questions: |-
    შეიცვლება თუ არა წრედის მუშაობის პრინციპი, თუ ერთ წითელ შუქდიოდს ჩავანაცვლებთ მწვანით?
    შეიცვლება თუ არა, თუ ორივე წითელ შუქდიოდს ჩავანაცვლებთ ლურჯით?
    წრედი გადააკეთეთ ისე, რომ ერთი შუქდიოდი უფრო ძლიერად ინთებოდეს ვიდრე მეორე, ორივე ღილაკზე დაჭერით კი ისევ ორივე ჩაქრეს.
    გამოიყენეთ დამატებითი რეზისტორები და გადააკეთეთ წრედი ისე, რომ არ გამოიყენოთ კვებების მიერთების წერტილი.
  methodology: "ეს საკმაოდ რთული სავარჯიშოა და ძალიან ეხმარება დენის ნაკადების მოძ\
    რაობის აღქმაში. მუშა წრედში არსებობს უბანი, სადაც დენი ხან ერთი, ხან მეორე მიმ\
    ართულებით გადის — ეს კარგად ჩანს შუქდიოდების საშუალებით. ამოხსნისას უნდა მოიფი\
    ქრონ კვების მიერთების წერტილის ან მიმდევრობით ჩართული რეზისტორებით ძაბვის გამყ\
    ოფის გამოყენება."
  validation:
    cases:
    - label: No button pressed
      labelKa: ღილაკები არ არის დაჭერილი — ორივე ჩამქრალი
      switchStates:
        button_1: open
        button_2: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: Only first button pressed
      labelKa: მხოლოდ პირველი ღილაკი დაჭერილი
      switchStates:
        button_1: closed
        button_2: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
    - label: Only second button pressed
      labelKa: მხოლოდ მეორე ღილაკი დაჭერილი
      switchStates:
        button_1: open
        button_2: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
    - label: Both buttons pressed
      labelKa: ორივე ღილაკი დაჭერილი — ორივე ჩამქრალი
      switchStates:
        button_1: closed
        button_2: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
- code: LR.L4.21
  title: მწვანე ჯობია წითელს ერთი ღილაკით
  displayOrder: 21
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ერთი ღილაკი, ერთი წითელი და ერთი მწვანე შუქდიოდი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, უნდა აინთოს მხოლოდ წითელი შუქდიოდი;
    თუ დავაწვებით ღილაკს, წითელი უნდა ჩაქრეს და აინთოს მწვანე შუქდიოდი;
    თუ ავუშვებთ ღილაკს, წრედი დაბრუნდეს საწყის მდგომარეობაში.

    ეს არის „წითელი ჯობია მწვანეს ერთი ღილაკით" ამოცანის შებრუნებული ვარიანტი.
  hint: |-
    მწვანე შუქდიოდმა დენის ნაკადი უნდა წაართვას წითელ შუქდიოდს, მაგრამ გასათვალისწინებელია, რომ მწვანე ინთება უფრო მაღალ ძაბვაზე ვიდრე წითელი.
    მწვანე შუქდიოდი ღილაკის გავლით პარალელურად მიაერთეთ რეზისტორების ძაბვის გამყოფზე, რომელიც შეამცირებს მწვანე შუქდიოდზე მოდებულ ძაბვას.
    ამ შემცირებული ძაბვის პარალელურად მიაერთეთ წითელი შუქდიოდი.
  questions: |-
    როგორ შეიცვლება წრედის მუშაობის პრინციპი, თუ წითელ შუქდიოდს შეცვლით ლურჯით?
    როგორ შეიცვლება წრედის მუშაობის პრინციპი, თუ მწვანე შუქდიოდს შეცვლით წითლით?
  methodology: "ეს საკმაოდ რთული სავარჯიშოა. მნიშვნელოვანია, რომ სწორად შეარჩიონ დ\
    ა გამოიყენონ რეზისტორების ძაბვის გამყოფი. თუ რეზისტორების ნომინალები კარგად არ\
    \ შეარჩიეს, საჭირო შედეგს ვერ მიიღებენ."
  validation:
    cases:
    - label: Switch off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: led_red
        metric: current
        op: lt
        value: 1.0E-4
      - role: led_green
        metric: current
        op: lt
        value: 1.0E-4
    - label: "Switch on, button released"
      labelKa: "ჩამრთველი ჩართული, ღილაკი არ არის დაჭერილი — წითელი ანთია"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: led_red
        metric: forward_current
        op: gt
        value: 1.0E-4
      - role: led_green
        metric: current
        op: lt
        value: 1.0E-4
    - label: "Switch on, button pressed"
      labelKa: "ჩამრთველი ჩართული, ღილაკი დაჭერილი — მწვანე ანთია, წითელი ჩაქრა"
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: led_green
        metric: forward_current
        op: gt
        value: 1.0E-4
      - role: led_red
        metric: forward_current
        op: "lt_ref:Switch on, button released"
        value: 0.5
