  displayOrder: 15
  difficulty: beginner
  description: |-
    ააწყვეთ სურათზე მოცემული წრედი (ორი 3 ვ კვების წყარო, ჩამრთველი, ღილაკი, ორი მიმდევრობით ჩართული წითელი შუქდიოდი და ორი 1 kΩ რეზისტორი).

    გამოიყენეთ სიმულაცია და დააკვირდით:
    • ჩამრთველით წრედის ჩართვისას;
    • ჩართულ წრედში ღილაკზე დაჭერისას;
    • გამორთულ წრედში ღილაკზე დაჭერისას.

    შემდეგ უპასუხეთ ქვემოთ მოცემულ ტესტის კითხვებს და დააჭირეთ შემოწმებას.
  hint: ზედა კვების წყარო შუქდიოდებს ჩამრთველისა და ზედა რეზისტორის გავლით კვებავს.
    ღილაკი ქვედა კვების წყაროს შუა წერტილს მეორე რეზისტორის გავლით ორ შუქდიოდს შორის
    შუა წერტილს უერთებს.
  questions: |-
    1. რა მოხდება თუ ჩამრთველით ჩავრთავთ წრედს?
    ა. ორივე შუქდიოდი აინთება;
    ბ. შუქდიოდები არ აინთება;
    გ. ერთი შუქდიოდი აინთება, მეორე არა;

    2. როგორ შეიცვლება შუქდიოდების ნათება თუ დავაწვებით ღილაკს?
    ა. ორივე შუქდიოდის ნათება მოიკლებს;
    ბ. ორივე შუქდიოდის ნათება მოიმატებს;
    გ. არ შეიცვლება;
    დ. ზედა შუქდიოდის ნათება მოიკლებს, ქვედასი მოიმატებს;
    ე. ზედა შუქდიოდის ნათება მოიმატებს, ქვედასი მოიკლებს;

    3. რა მოხდება თუ ჩამრთველის ჩართვის გარეშე დავაწვებით ღილაკს?
    ა. შუქდიოდები აინთება;
    ბ. შუქდიოდები არ აინთება;
    გ. ქვედა შუქდიოდი აინთება, ზედა არა;

    4. შეიცვლება თუ არა წრედის მუშაობის პრინციპი ღილაკზე დაჭერისას, თუ ქვედა წითელ შუქდიოდს ჩავანაცვლებთ მწვანით?
    ა. შეიცვლება;
    ბ. არ შეიცვლება;
  methodology: "წინა ორი ტესტისგან განსხვავებით, ამ ამოცანაში კარგად უნდა ახსნან,\
    \ თუ რატომ მცირდება ზედა შუქდიოდში დენის ნაკადი ღილაკზე დაჭერის დროს."
- code: LR.L2.16
  title: ორი შუქდიოდის თანამიმდევრული ანთება ორი ღილაკით
  displayOrder: 16
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ორი ღილაკი, ორი წითელი შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ შუქდიოდები არ უნდა აინთოს;
    თუ დავაწვებით პირველ ღილაკს, უნდა აინთოს პირველი შუქდიოდი;
    თუ დავაწვებით მეორე ღილაკს, უნდა აინთოს ორივე შუქდიოდი.
  hint: |-
    ააწყვეთ წრედი ისე, რომ ერთი ღილაკის გავლით დენის ნაკადმა გაიაროს მხოლოდ ერთ შუქდიოდში, ხოლო მეორე ღილაკის გავლით — ორივეში.
    შუქდიოდები და ერთი ღილაკი ჩართეთ მიმდევრობით, მეორე ღილაკი კი მიაერთეთ შუქდიოდების შეერთების წერტილს.
  questions: |-
    შესაძლებელია თუ არა წრედი აიწყოს მხოლოდ ერთი რეზისტორის გამოყენებით (თუ გამოყენებულია ერთზე მეტი რეზისტორი)?
    გადააკეთეთ წრედი ისე, რომ ორივე ღილაკზე დაჭერის შემთხვევაში ორივე შუქდიოდი დარჩეს ანთებული.
  methodology: "მიუხედავად იმისა, რომ ამ სავარჯიშოს პირობა საკმაოდ მარტივია, ის ძა\
    ლიან ეხმარება წრედებში დენის ნაკადების სწორად გადანაწილების მოფიქრებაში და აჩვ\
    ევს წრედების სწორად დაგეგმვის პროცესს."
  validation:
    cases:
    - label: No button pressed
      labelKa: ღილაკები არ არის დაჭერილი
      switchStates:
        button_1: open
        button_2: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: Only first button pressed
      labelKa: მხოლოდ პირველი ღილაკი დაჭერილი — პირველი შუქდიოდი
      switchStates:
        button_1: closed
        button_2: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
    - label: Only second button pressed
      labelKa: მხოლოდ მეორე ღილაკი დაჭერილი — ორივე შუქდიოდი
      switchStates:
        button_1: open
        button_2: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 2.0
- code: LR.L2.17
  title: ორი შუქდიოდის თანამიმდევრული ჩაქრობა ორი ღილაკით
  displayOrder: 17
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ორი ღილაკი, ორი წითელი შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ორივე შუქდიოდი უნდა აინთოს;
    თუ დავაწვებით პირველ ღილაკს, უნდა ჩაქრეს პირველი შუქდიოდი;
    თუ დავაწვებით მეორე ღილაკს, უნდა ჩაქრეს ორივე შუქდიოდი;
    თუ დავაწვებით ორივე ღილაკს, ორივე შუქდიოდი უნდა იყოს ჩამქრალი.
  hint: "ღილაკები ჩართეთ შუქდიოდების პარალელურად ისე, რომ ერთმა ღილაკმა მხოლოდ ერთ\
    \ შუქდიოდს წაართვას დენის ნაკადი, ხოლო მეორემ — ორივეს."
  questions: |-
    როგორ იმუშავებს წრედი, თუ ორი კვების წყაროს ნაცვლად გამოვიყენებთ მხოლოდ ერთს?
    გადააკეთეთ წრედი ისე, რომ ღილაკებზე დაჭერით შუქდიოდები იმავე წესით მუშაობდნენ, ოღონდ ბოლომდე არ ქრებოდნენ.
  methodology: "ეს სავარჯიშო ეხმარება პარალელური ჩართვების პრაქტიკულ გამოყენებასა\
    \ და გააზრებაში, ასევე ეხმარება წრედების სწორად დაგეგმვის პროცესში."
  validation:
    cases:
    - label: No button pressed
      labelKa: ღილაკები არ არის დაჭერილი — ორივე ანთია
      switchStates:
        button_1: open
        button_2: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 2.0
    - label: Only first button pressed
      labelKa: მხოლოდ პირველი ღილაკი დაჭერილი — პირველი ჩაქრა
      switchStates:
        button_1: closed
        button_2: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
    - label: Only second button pressed
      labelKa: მხოლოდ მეორე ღილაკი დაჭერილი — ორივე ჩაქრა
      switchStates:
        button_1: open
        button_2: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: Both buttons pressed
      labelKa: ორივე ღილაკი დაჭერილი — ორივე ჩამქრალი
      switchStates:
        button_1: closed
        button_2: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
- code: LR.L2.18
  title: წითელი ჯობია მწვანეს ერთი ღილაკით
  displayOrder: 18
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ღილაკი, ერთი წითელი და ერთი მწვანე შუქდიოდი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, მწვანე შუქდიოდი უნდა აინთოს, წითელი — არა;
    თუ დავაწვებით ღილაკს, მწვანე უნდა ჩაქრეს და წითელი აინთოს;
    თუ ავუშვებთ ღილაკს, წრედი დაბრუნდეს საწყის მდგომარეობაში.
  hint: |-
    რა ძაბვებზე ინთება წითელი და მწვანე შუქდიოდები? რომელი შუქდიოდი აინთება, თუ მათ პარალელურად ჩავრთავთ?
    თავიდან წრედში ჩართეთ მხოლოდ მწვანე შუქდიოდი, შემდეგ კი ღილაკის გავლით პარალელურად მიაერთეთ წითელი შუქდიოდი.
  questions: |-
    როგორ იმუშავებს წრედი, თუ ერთი წითელი შუქდიოდის ნაცვლად ჩავრთავთ ორ მიმდევრობით ჩართულ წითელ შუქდიოდს?
    როგორ იმუშავებს წრედი, თუ ორი კვების წყაროს ნაცვლად გამოვიყენებთ ერთს?
  methodology: "სავარჯიშო გათვლილია განსხვავებული ფერის შუქდიოდების სამუშაო ძაბვებ\
    ის სწორად გამოყენებაზე და პარალელური ჩართვის გამოყენებაზე: დაბალ ძაბვაზე მომუშ\
    ავე დეტალი ყოველთვის წაართმევს დენს მაღალ ძაბვაზე მომუშავე დეტალს."
  validation:
    cases:
    - label: Switch off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: led_green
        metric: current
        op: lt
        value: 1.0E-4
      - role: led_red
        metric: current
        op: lt
        value: 1.0E-4
    - label: "Switch on, button released"
      labelKa: "ჩამრთველი ჩართული, ღილაკი არ არის დაჭერილი — მწვანე ანთია"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: led_green
        metric: forward_current
        op: gt
        value: 1.0E-4
      - role: led_red
        metric: current
        op: lt
        value: 1.0E-4
    - label: "Switch on, button pressed"
      labelKa: "ჩამრთველი ჩართული, ღილაკი დაჭერილი — წითელი ანთია, მწვანე ჩაქრა"
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: led_red
        metric: forward_current
        op: gt
        value: 1.0E-4
      - role: led_green
        metric: forward_current
        op: "lt_ref:Switch on, button released"
        value: 0.5
- code: LR.L4.19
  title: გამომრიცხავი შუქდიოდები ორი ღილაკით
