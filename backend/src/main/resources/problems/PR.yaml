        photo_resistor: 0.0
- code: PR.L2.12
  title: ფოტორეზისტორი და შუქდიოდების ანთების ზღვრები
  displayOrder: 10
  difficulty: beginner
  description: |-
    ააწყვეთ სურათზე მოცემული წრედი (ორი 3 ვ კვების წყარო, ფოტორეზისტორი, წითელი და მწვანე შუქდიოდი, 1 kΩ და 5.1 kΩ რეზისტორები).

    გამოიყენეთ სიმულაცია და დააკვირდით:
    • ოთახის განათებაზე წრედის ჩართვისას;
    • ფოტორეზისტორზე ფანრის თანდათან მიახლოებისას;
    • ფოტორეზისტორის შავი საგნით დაფარვისას.

    შემდეგ უპასუხეთ ქვემოთ მოცემულ ტესტის კითხვებს და დააჭირეთ შემოწმებას.
  hint: |-
    ზედა ნაწილი: 5.1 kΩ პარალელურად (1 kΩ + მწვანე შუქდიოდი).
    შუაში — ფოტორეზისტორი.
    ქვედა ნაწილი: 5.1 kΩ პარალელურად (1 kΩ + წითელი შუქდიოდი).
    გაითვალისწინეთ წითელი და მწვანე შუქდიოდების განსხვავებული ანთების ძაბვები.
  methodology: "სავარჯიშოს მიზანია, გაიხსენონ ფოტორეზისტორის წინაღობის მნიშვნელობე\
    ბი სხვადასხვა განათებულობისას, სწორად დათვალონ ძაბვები მიმდევრობით ჩართულ რეზი\
    სტორებზე, ასევე გაითვალისწინონ წითელი და მწვანე შუქდიოდის ანთების ძაბვები."
