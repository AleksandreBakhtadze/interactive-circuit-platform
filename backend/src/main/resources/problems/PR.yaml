    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ორივე შუქდიოდი უნდა აინთოს — ერთი ძლიერად, მეორე კი სუსტად;
    თუ ფოტორეზისტორს დავანათებთ, ორივე შუქდიოდის ნათება უნდა გათანაბრდეს;
    თუ დანათებას შევწყვეტთ, შუქდიოდებმა ისევ ძველებურად უნდა ანათონ.

    ორი განსხვავებულად ანთებული შუქდიოდის ნათება უნდა გათანაბრდეს, როდესაც ფოტორეზისტორს დავანათებთ ფანრით.
  hint: |-
    თავიდან შუქდიოდებში უნდა გადიოდეს განსხვავებული დენი — შუქდიოდებს მიმდევრობით ჩაურთეთ განსხვავებული წინაღობები.
    შუქდიოდები ჩართეთ ერთმანეთის პარალელურად ფოტორეზისტორის გავლით: როდესაც ფოტორეზისტორის წინაღობა მნიშვნელოვნად შემცირდება, ძაბვები შუქდიოდებზე თითქმის გათანაბრდება.
  questions: |-
    იმუშავებს თუ არა წრედი ანალოგიურად, თუ ერთ-ერთ წითელ შუქდიოდს შევცვლით ლურჯი შუქდიოდით?

