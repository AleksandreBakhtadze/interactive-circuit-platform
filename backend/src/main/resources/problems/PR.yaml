chapter: PR
problems:
- code: PR.L1.1
  title: ფოტორეზისტორის განათებით შუქდიოდის ნათების მომატება
  displayOrder: 1
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ფოტორეზისტორი, ერთი წითელი შუქდიოდი, რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდი უნდა აინთოს;
    თუ ფოტორეზისტორს დავანათებთ ფანრით, შუქდიოდის ნათებამ უნდა მოიმატოს;
    თუ ფოტორეზისტორს დავაფარებთ, შუქდიოდი უნდა ჩაკრეს.

    ფოტორეზისტორის ფანრით დანათების დროს შუქდიოდი უნდა ინთებოდეს ძლიერად, ფოტორეზისტორის დაფარვის დროს კი ჩაკრებოდეს. შუქდიოდის ნათების სიძლიერე დამოკიდებული უნდა იყოს ფოტორეზისტორის დანათების სიძლიერეზე.
  hint: |-
    გამოიყენეთ ფოტორეზისტორის თვისება — მისი წინაღობა მნიშვნელოვანია, თუ დავანათებთ შუქს. ფოტორეზისტორი და შუქდიოდი ჩართეთ მიმდევრობით.
    ფანრით დანათებისთვის მიუახლოვეთ ფანრი ფოტორეზისტორს; დაფარვისთვის გამოიყენეთ დამფარავი.
  questions: |-
    შეიცვლება თუ არა წრედის სამუშაო პრინციპი, თუ წრედში არსებულ ნებისმიერ ან დეტალებს გავუცვლით ადგილებს?

    რა დანიშნულება აქვს შუქდიოდის მიმდევრობით ჩართული რეზისტორის გამოყოფას?
  methodology: "ეს არის ფოტორეზისტორის სამუშაო პრინციპისა და გამოყენებების გაცნობი\
    თი სავარჯიშო. მიღებული წრედით პრაქტიკულად უნდა ნახონ ფოტორეზისტორის წინაღობის\
    \ ცვლილება და შესაბამისად შუქდიოდის განათების ცვლილება, როდესაც ფოტორეზისტორს\
    \ დავანათებთ ფანრით ან დავაფარებთ."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 5.0E-4
    - label: switch_on_ambient
      labelKa: ჩამრთველი ჩართული — ნათელი
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 8.0E-5
      lightLevels:
        photo_resistor: 0.352
    - label: switch_on_torch
      labelKa: ფანრით დატენა — ნათება იზრდება
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.001
      - role: led_1
        metric: forward_current_vs_prior_ratio
        op: gt
        value: 2.0
      lightLevels:
        photo_resistor: 1.0
    - label: switch_on_cover
      labelKa: დაფარვა — შუქდიოდი ჩაკრება
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 3.0E-4
      lightLevels:
        photo_resistor: 0.0
- code: PR.L1.2
  title: ფოტორეზისტორის განათებით შუქდიოდის ჩაქრობა
  displayOrder: 2
  difficulty: beginner
  description: |-
    გამოიყვანეთ მხოლოდ შემდეგი დეტალები: ფოტორეზისტორი, ერთი წითელი შუქდიოდი, რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდი უნდა აინთოს;
    თუ ფოტორეზისტორს დავანათებთ ფანრით, შუქდიოდის ნათებამ უნდა მოიკლოს;
    თუ ფანრს გამოვრთავ, შუქდიოდი ისევ უნდა აინთოს.

    ეს არის წინა სავარჯიშოს შებრუებული ამოცანა — პარალელურად ჩართვისას ფოტორეზისტორის განაწყობა დენს იზიდავს, ამიტომ განათებისას შუქდიოდი ნათება უნდა შესუსტდეს.
  hint: "გამოიყენეთ ფოტორეზისტორის თვისება — მისი წინაღობა მნიშვნელოვანია, თუ დავა\
    ნათებთ შუქს. ფოტორეზისტორი და შუქდიოდი ჩართეთ ერთმანეთის პარალელურად."
  questions: |-
    შეიცვლება თუ არა წრედის სამუშაო პრინციპი, თუ შუქდიოდს და ფოტორეზისტორს გავუცვლით ადგილებს?

    როგორ იმუშავებს წრედი, თუ შუქდიოდის პარალელურად ჩავრთავთ 470 µF კონდესატორს?
  methodology: "ამ სავარჯიშოს მიზანია ფოტორეზისტორის პრაქტიკული გამოყოფა, მიმდინარ\
    ეობისა და პარალელურად ჩართვის გახსენება. ასევე უნდა მოიფიქრონ — წინა ამოცანაში\
    \ ფოტორეზისტორი შუქდიოდის მიმდევრობით იყო ჩართული; აქ შებრუებული პირობის დროს\
    \ უნდა ჩართოთ პარალელურად."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 5.0E-4
    - label: switch_on_ambient
      labelKa: ჩამრთველი ჩართული — ნათელი
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.001
      lightLevels:
        photo_resistor: 0.352
    - label: switch_on_torch
      labelKa: ფანრით დატენა — ნათება მცირდება
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.001
      - role: led_1
        metric: forward_current_vs_prior_ratio
        op: gt
        value: 3.0
      lightLevels:
        photo_resistor: 1.0
- code: PR.L2.3
  title: ფოტორეზისტორის განათებით შუქდიოდის ნათების შემცირება
  displayOrder: 3
  difficulty: beginner
  description: |-
    გამოიყვანეთ მხოლოდ შემდეგი დეტალები: ფოტორეზისტორი, ერთი წითელი შუქდიოდi, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდი უნდა აინთოს;
    თუ ფოტორეზისტორს დავანათებთ ფანრით, შუქდიოდის ნათებამ უნდა მოიკლოს; ფანრის მიახლოვებით კიდევ უფრო უნდა შესუსტდეს, მაგრამ ბოლომდე არ უნდა ჩაკრეს;
    თუ ფანრს გამოვრთავ, შუქდიოდი ისევ უნდა აინთოს.

    ეს არის წინა სავარჯიშოს მსგავსი ამოცანა — ძლიერ დანათების დროსაც შუქდიოდი ბოლომდე არ უნდა ჩაკრეს.
  hint: "გაიხსენეთ წინა ამოცანის შედეგი: ფოტორეზისტორის წინაღობა ძლიერი განათებისა\
    ს ძალიან მცირდება. ფოტორეზისტორთან მიმდევრობით ჩართეთ რეზისტორი, რათა მისი წინ\
    აღობა არ მისცეს საშუალებას სრულად „მოიპაროს“ დენი შუქდიოდის გვერდით."
  questions: |-
    როგორ იმუშავებს წრედი, თუ წითელ შუქდიოდს პარალელურად ჩავრთავთ მწვან და ლურჯ შუქდიოდებს?

    რომელ დეტალებთან ერთად შეგვიძლია გავუცვალოთ ადგილი ფოტორეზისტორს ისე, რომ წრედის სამუშაო პრინციპი არ შეიცვალოს?
  methodology: "ეს არის წინა სავარჯიშოს გაგრძელება. უნდა მოიფიქროთ, როგორ გაზარდოთ\
    \ ძალიან დაბალი ფოტორეზისტორის წინაღობის ეფექტი — მასთან დამატებითი რეზისტორი\
    \ მიმდევრობით ჩართვით."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 5.0E-4
    - label: switch_on_ambient
      labelKa: ჩამრთველი ჩართული — ნათელი
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.001
      lightLevels:
        photo_resistor: 0.352
    - label: switch_on_torch
      labelKa: "ფანრით დატენა — ნათება მცირდება, მაგრამ არ ჩაკრება"
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 1.5E-4
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.009
      - role: led_1
        metric: forward_current_vs_prior_ratio
        op: gt
        value: 1.15
      lightLevels:
        photo_resistor: 1.0
- code: PR.L2.4
  title: ფოტორეზისტორის განათებით შუქდიოდის ნათების მომატება-შემცირება
  displayOrder: 4
  difficulty: beginner
  description: |-
    გამოიკენეთ მხოლოდ შემდეგი დეტალები: გადამრთველი, ფოტო რეზისტორი, ერთი ლურჯი შუქდიოდi, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    აწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდი უნდა აინთოს;
    თუ ფოტორეზისტორს დავანათებთ ფანრით, შუქდიოდის ნათებამ უნდა მოიმატოს;
    თუ გადამრთველს გადავრთავ და ხელახლა დავანათებთ ფოტორეზისტორს, ამ შემთხვევაში შუქდიოდის ნათებამ უნდა მოიკლოს, ძლიერ განათებაზე კი ჩაკრეს;
    თუ გადამრთველს უკან დავაბრუნებთ, დანათებით შუქდიოდის ნათება ისევ უნდა მატულობდეს.

    ეს არის წინა ორი სავარჯიშოს გაერთიანებული ამოცანა — ერთ წრედში ორივე რეჟიმი; რეჟიმის შეცვლა გადამრთველით.
  hint: |-
    გამოიყენეთ წინა ამოცანების შედეგები, შეადარეთ ფოტორეზისტორების ჩართვები წრედებში.
    გადამრთველით ფოტორეზისტორი მიაერთეთ ისე, რომ ხან პარალელურად და ხან მიმდევრობით იყოს ჩართული შუქდიოდთან.
  questions: |-
    გადამრთველი ჩაანაცვლეთ ღილაკით და რელით ისე, რომ წრედი მუშაობდეს ანალოგიური პრინციპით.

    წრედი შეცვალეთ ისე, რომ შემცირების რეჟიმში შუქდიოდი ბოლომდე არ ჩაკრეს ძლიერი განათების დროსაც კი.
  methodology: ეს არის წინა სავარჯიშოების შემადგენელი ამოცანა — გაიხსენონ გადამრთველის
    გამოყოფა და ერთ წრედში მოახერხონ ფოტორეზისტორის მიმდევრობითი და პარალელური ჩართვა
    შუქდიოდთან.
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        slide_switch: left
        switch: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 5.0E-4
    - label: slide_left_ambient
      labelKa: "გადამრთველი A–B — ჩართული, ნათელი"
      switchStates:
        slide_switch: left
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.001
      lightLevels:
        photo_resistor: 0.352
    - label: slide_left_torch
      labelKa: "A–B — ფანრით დატენა, ნათება იზრდება"
      switchStates:
        slide_switch: left
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.004
      - role: led_1
        metric: forward_current_vs_prior_ratio
        op: gt
        value: 2.0
      lightLevels:
        photo_resistor: 1.0
    - label: slide_right_ambient
      labelKa: "გადამრთველი A–C — ჩართული, ნათელი"
      switchStates:
        slide_switch: right
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.001
      lightLevels:
        photo_resistor: 0.352
    - label: slide_right_torch
      labelKa: "A–C — ფანრით დატენა, შუქდიოდი ჩაკრება"
      switchStates:
        slide_switch: right
        switch: closed
