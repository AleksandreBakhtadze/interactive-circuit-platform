- code: PR.L3.6
  title: ფოტორეზისტორის წინაღობა ოთახის განათებაზე
  displayOrder: 6
  difficulty: beginner
  description: |-
    გამოიყვანეთ მხოლოდ შემდეგი დეტალები: ფოტორეზისტორი, ორი კვების წყარო; ასევე შეგიძლიათ გამოიყვანოთ ნებისმიერი დეტალები ნაკრებიდან.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    გაზომეთ ფოტორეზისტორის წინაღობა ჩვენეულობებით, ოთახის განათების პირობებში;
    ფოტორეზისტორი ისე ჩართეთ წრედში, რომ მას არ ეცემოდეს ძლიერი სხივი ან პირიქით, ზემოდან არ ეფარებოდეს რამე საგანი.

    არანაირი შეზღუდვა წრედსა და დეტალებზე არ არის — შეგიძლიათ ნებისმიერი (უკვე ნაცნობი) დეტალების გამოყენება.
  hint: |-
    გამოიყენეთ ორი ერთნაირი შუქდიოდი: ერთს მიმდევრობით ჩაურთეთ ფოტორეზისტორი, მეორეს კი ერთი ან რამდენიმე ჩვენეული რეზისტორი.
    რეზისტორების მიმდევრობითი და პარალელური ჩართვით შეგიძლიათ მათი ჯამური წინაღობის ცვლა; რეზისტორების გადარჩევით მიაღწიეთ შუქდიოდების ერთნაირ ნათებას.
    შუქდიოდების ნათების უფრო ზუსტად შესადარებლად შეგიძლიათ მათი პარალელური ჩართვა ღილაკის გავლით — ღილაკზე დაჭერით ნათებების გათანაბრება/განსხვავება უკეთ გამოჩნდება.
  questions: |-
    შეცვალეთ ოთახის განათებულობა და ხელახლა ჩაატარეთ გაზომვა.

    უხეშად შეაფასეთ თქვენი გაზომვის სიზუსტე და განსაზღვრეთ გაზომილი ფოტორეზისტორის წინაღობის ზედა და ქვედა ზღვრები.
  methodology: "ფოტორეზისტორის წინაღობის გაზომვა უნდა მოახერხონ ექსპერიმენტულად: ნ\
    აკრებში არსებული წინაღობების გამოყენებით უნდა მიიღონ დაახლოებით ფოტორეზისტორის\
    \ ტოლი წინაღობა; შედარების მახასიათებლად კი გამოიყენონ შუქდიოდების განათებების\
    \ ერთმანეთთან შედარება."
