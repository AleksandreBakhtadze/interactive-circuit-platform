    თუ ფანრით დავანათებთ ფოტორეზისტორს, წითელი შუქდიოდი უნდა ჩაკრეს და აინთოს მწვანე; რაც უფრო ახლოს მივიტანთ ფანარს, მით უფრო ძლიერად;
    თუ ფანარს თანდათან მოვაშორებთ, მწვანე შუქდიოდის ნათებამ უნდა მოიკლოს, შემდეგ ჩაკრეს და მხოლოდ ამის შემდეგ დაიწყოს წითელმა ანთება და ნათების მომატება;
    ოთახის განათებაზე ენთოს მხოლოდ წითელი შუქდიოდი, ფოტორეზისტორის ფანრით დანათების დროს კი მხოლოდ მწვანე. განათების არც ერთ შემთხვევაში მწვანე და წითელი შუქდიოდები ერთად არ უნდა ენთოს.
  hint: |-
    შუქდიოდები ჩართეთ პარალელურად, ერთმანეთის შებრუნებით — დენის ერთი მიმართულებით გავლაზე აინთება მწვანე, მეორეზე კი წითელი შუქდიოდი.
    ფოტორეზისტორით და ჩვეულებრივი რეზისტორით გააკეთეთ ძაბვის გამყოფი; ფოტორეზისტორის განათებისას მათი გადაბმის წერტილში ძაბვის მნიშვნელობა შესამჩნევად შეიცვლება.
    გამოიყენეთ კვებების შეერთების წერტილი და სწორი ჩართვის ადგილი მოუძებნეთ შუქდიოდებს.
  questions: |-
    როგორ იმუშავებს წრედი, თუ ორივე შუქდიოდს ჩავანაცვლებთ ლურჯი შუქდიოდებით?

    შეუძლებელია თუ არა, ამოცანა გავაკეთოთ კვებების შეერთების წერტილის გამოყენების გარეშე?

    წრედი გადააკეთეთ ისე, რომ მწვანე შუქდიოდთან ერთად ინთებოდეს ლურჯი შუქდიოდიც.
  methodology: "სავარჯიშოს მიზანია, მოიფიქრონ და პირობის შესაბამისად სწორად ჩართონ\
    \ შუქდიოდები ერთმანეთის მიმართ: რადგან ორივე შუქდიოდი ერთდროულად არ უნდა ენთოს\
    , შესაძლებელია მათი ერთმანეთის შებრუნებით და პარალელურად ჩართვა. ბოლოს წრედში\
    \ უნდა მოძებნონ ორი ისეთი წერტილი, სადაც ფოტორეზისტორის განათების მიხედვით დენ\
    ი ხან ერთი მიმართულებით გადის, ხან მეორე."
  validation:
    cases:
    - label: ambient_red_only
      labelKa: ოთახის განათება — მხოლოდ წითელი
      checks:
      - role: led_red
        metric: forward_current
        op: gt
        value: 2.5E-4
      - role: led_green
        metric: forward_current
        op: lt
        value: 1.0E-4
      lightLevels:
        photo_resistor: 0.352
    - label: torch_green_only
      labelKa: ფანრით დანათება — მხოლოდ მწვანე
      checks:
      - role: led_green
        metric: forward_current
        op: gt
        value: 0.005
      - role: led_red
        metric: forward_current
        op: lt
        value: 1.0E-4
      lightLevels:
        photo_resistor: 1.0
    - label: cover_red_only
      labelKa: დაფარვა — მხოლოდ წითელი
      checks:
      - role: led_red
        metric: forward_current
        op: gt
        value: 2.5E-4
      - role: led_green
        metric: forward_current
        op: lt
        value: 1.0E-4
      lightLevels:
        photo_resistor: 0.0
- code: PR.L3.11
  title: დღისით წითელი და ღამით მწვანე
  displayOrder: 9
  difficulty: beginner
  description: |-
    გამოიყვანეთ მხოლოდ შემდეგი დეტალები: ფოტორეზისტორი, ერთი წითელი და ერთი მწვანე შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ორივე შუქდიოდი უნდა აინთოს;
    თუ ფოტორეზისტორს თანდათან მივუახლოვებთ ფანარს, წითელი შუქდიოდის ნათებამ უნდა მოიმატოს, როცა მწვანისამ უნდა მოიკლოს და ჩაკრეს;
    თუ ფოტორეზისტორს თანდათან დავაფარებთ შავ საგანს, მწვანე შუქდიოდის ნათებამ უნდა მოიმატოს, როცა წითლისამ უნდა მოიკლოს და ჩაკრეს;
    ეს არის წინა სავარჯიშოს მსგავსი ამოცანა, იმ განსხვავებით, რომ ფერები არის შენაცვლებული და ოთახის განათებაზე ორივე ფერის შუქდიოდი უნდა ენთოს.
  hint: |-
    რადგან ორივე შუქდიოდი შეიძლება ერთდროულად ენთოს, შუქდიოდები ჩართეთ ერთმანეთის მიმდევრობით.
    ფოტორეზისტორით და ჩვეულებრივი რეზისტორით გააკეთეთ ძაბვის გამყოფი; ფოტორეზისტორის განათებისას მათი გადაბმის წერტილში ძაბვა მნიშვნელოვნად იცვლება.
    შუქდიოდები და ძაბვის გამყოფი ისე დააკავშირეთ ერთმანეთს, რომ ძაბვის ცვლილებისას ხან ერთი შუქდიოდი ჩაქრეს, ხან მეორე.
  questions: |-
    შეუძლებელია თუ არა, ამოცანა გავაკეთოთ მხოლოდ ერთი კვების წყაროს გამოყენებით?

    წრედი გადააკეთეთ ისე, რომ მწვანე და წითელი შუქდიოდებთან ერთად ინთებოდეს ლურჯი შუქდიოდებიც.
  methodology: "წინა ამოცანისგან განსხვავებით ამ სავარჯიშოში მთავარია მიხვდნენ, რო\
    მ შუქდიოდები უნდა ჩართონ ერთმანეთის მიმდევრობით; ამ შემთხვევაშიც ფოტორეზისტორი\
    თ და რეზისტორით მიიღონ განათებით ცვალებადი ძაბვის გამყოფი და სწორად დააკავშირო\
    ნ ეს ძაბვის გამყოფი შუქდიოდებთან."
  validation:
    cases:
    - label: ambient_both_on
      labelKa: ოთახის განათება — ორივე ანთებულია
      checks:
      - role: led_red
        metric: forward_current
        op: gt
        value: 1.6E-4
      - role: led_green
        metric: forward_current
        op: gt
        value: 4.0E-4
      lightLevels:
        photo_resistor: 0.352
    - label: torch_red_only
      labelKa: ფანრით დანათება — მხოლოდ წითელი
      checks:
      - role: led_red
        metric: forward_current
        op: gt
        value: 5.0E-4
      - role: led_green
        metric: forward_current
        op: lt
        value: 1.0E-4
      lightLevels:
        photo_resistor: 1.0
    - label: cover_green_strong
      labelKa: "დაფარვა — მწვანე ძლიერი, წითელი სუსტი"
      checks:
      - role: led_green
        metric: forward_current
        op: gt
        value: 4.0E-4
      - role: leds
        metric: current_ratio
