    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ერთი შუქდიოდი უნდა ანთდეს, მეორე — არა;
    თუ ერთ-ერთ გადამრთველს გადავრთავთ, ორივე შუქდიოდმა უნდა შეიცვალოს მდგომარეობა (მაგ. თუ მწვანე ანთებულია და წითელი არა, ორივემ უნდა შეიცვალოს);
    იგივე უნდა მოხდეს მეორე გადამრთველის გადართვისასაც.

