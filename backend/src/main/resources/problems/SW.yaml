- code: SW.L3.11
  title: გამომრიცხავი შუქდიოდები ერთი წითელი შუქდიოდით
  displayOrder: 11
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ერთი ღილაკი, ერთი გადამრთველი, ერთი წითელი, ერთი მწვანე და ერთი ლურჯი შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ან ლურჯი ან მწვანე შუქდიოდი უნდა აინთოს;
    თუ გადამრთველს გადავრთავთ, მწვანემ და ლურჯმა შუქდიოდებმა უნდა შეიცვალონ მდგომარეობა — ანთებული ჩაქრეს და ჩამქრალი აინთოს;
    თუ ღილაკს დავაწვებით, ანთებული (ლურჯი ან მწვანე) შუქდიოდი უნდა ჩაქრეს და წითელი აინთოს;
    გადამრთველით უნდა ხდებოდეს ლურჯი ან მწვანე შუქდიოდის არჩევა, ღილაკით კი ანთებული შუქდიოდის ჩანაცვლება წითლის ანთებით.
  hint: |-
    მწვანე და ლურჯი შუქდიოდები ჩართეთ გადამრთველზე ისე, რომ ერთი ინთებოდეს ან მეორე;
    გაითვალისწინეთ, რა ძაბვაზე ინთება წითელი და მწვანე/ლურჯი შუქდიოდები;
    ერთ პოლუსზე (მაგ. ლურჯთან) ღილაკით პარალელურად ჩართეთ წითელი შუქდიოდი — დაბალი Vf გამორიცხავს მაღალი Vf შუქდიოდს.
  questions: |-
    როგორ იმუშავებს წრედი, თუ ლურჯ და მწვანე შუქდიოდებს გავუცვლით ადგილებს?
    როგორ იმუშავებს წრედი, თუ წითელ და ლურჯ შუქდიოდებს გავუცვლით ადგილს? ახსენით, რატომ.
    გადააკეთეთ წრედი ისე, რომ ღილაკზე დაჭერისას წითელი აინთოს, მაგრამ მწვანე ბოლომდე არ ჩაქრეს, ლურჯი კი ბოლომდე ჩაქრეს.
  methodology: "სავარჯიშოს მიზანია ღილაკის და გადამრთველის ერთდროული გამოყენება, შ\
    უქდიოდებისთვის სწორი პოზიციების მოძებნა და შუქდიოდების პარალელურად ჩართვის პრა\
    ქტიკული გამოყენება."
  validation:
    cases:
    - label: slide_left_color
      labelKa: გადამრთველი A–B — ანთებულია ლურჯი ან მწვანე
      switchStates:
        slide_switch: left
        button_1: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
      - role: led_red
        metric: forward_current
        op: lt
        value: 5.0E-4
    - label: slide_right_swap
      labelKa: გადამრთველი A–C — მწვანე/ლურჯი შეიცვალა
      switchStates:
        slide_switch: right
        button_1: open
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
      - role: leds
        metric: lit_set_changed
        op: gt
        value: 0.0
      - role: led_red
        metric: forward_current
        op: lt
        value: 5.0E-4
    - label: press_right
      labelKa: ღილაკი დაჭერილია (A–C) — ერთი შუქდიოდი ანთებულია
      switchStates:
        slide_switch: right
        button_1: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
      - role: leds
        metric: exclusive_red
        op: gte
        value: 0.0
    - label: press_left
      labelKa: ღილაკი დაჭერილია (A–B) — ერთი შუქდიოდი ანთებულია
      switchStates:
        slide_switch: left
        button_1: closed
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
      - role: leds
        metric: exclusive_red
        op: gte
        value: 0.0
      - role: leds
        metric: saw_exclusive_red
        op: gt
        value: 0.0
- code: SW.L1.13
  title: ნათურის და შუქდიოდის ნათების მომატება გადამრთველით
  displayOrder: 13
