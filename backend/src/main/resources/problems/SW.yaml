    ნათურის პარალელურად რეზისტორის გავლით ჩართეთ შუქდიოდი.
  questions: |-
    გამოიყენეთ ჩამრთველი და წრედი შეცვალეთ ისე, რომ ჩამრთველის გათიშვით ნათურაც და შუქდიოდიც გაითიშოს.
    მწვანე და ლურჯი შუქდიოდები დაამატეთ წრედში ისე, რომ ინთებოდნენ წითელ შუქდიოდთან ერთად.
  methodology: "ეს არის საკმაოდ მარტივი სავარჯიშო წინა ამოცანებთან ერთად, მაგრამ ა\
    მ ამოცანის წინასწარ შესრულებულობა კარგია შემდეგ, საკმაოდ რთული ამოცანის ამოსახ\
