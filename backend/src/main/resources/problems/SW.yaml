    თუ ღილაკს დავაწვებით, შუქდიოდის ნათებამ უნდა მოიმატოს;
    ნათების მომატება დამოკიდებული უნდა იყოს გადამრთველის პოზიციაზე — ერთ პოზიციაზე ნათების მომატება უნდა იყოს სუსტი, მეორე პოზიციაზე კი ძლიერი;
    ღილაკით უნდა მოხდეს ნათების მომატება, გადამრთველით კი შეიცვალოს მომატების სიძლიერე.
