chapter: SW
problems:
- code: SW.L1.1
  title: ორი შუქდიოდის ანთება გადამრთველით
  displayOrder: 1
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: გადამრთველი, ორი წითელი შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ უნდა აინთოს მხოლოდ ერთი შუქდიოდი;
    თუ გადამრთველს გადავრთავთ, ანთებული შუქდიოდი უნდა ჩაქრეს და აინთოს მეორე;
    თუ გადამრთველს ისევ გადავრთავთ, შუქდიოდები უნდა დაბრუნდნენ საწყის მდგომარეობაში.

    გადამრთველის ერთ პოზიციაზე უნდა ანთდეს ერთი შუქდიოდი, მეორე პოზიციაზე — მეორე.
  hint: |-
    კვების წყაროს ერთი პოლუსი მიაერთეთ გადამრთველის A პოლუსს; გადართვის შემდეგ კვება მიეწოდება ან B პოლუსს, ან C-ს.
    შუქდიოდები მიაერთეთ გადამრთველის B და C პოლუსებს.
  questions: |-
    გადააკეთეთ წრედი ისე, რომ ერთი შუქდიოდი ინთებოდეს უფრო ძლიერად, მეორე სუსტად.
    გამოიყენეთ ჩამრთველი და ჩასვით წრედში ისე, რომ შეიძლებოდეს წრედის ჩართვა-გამორთვა.
  methodology: "სავარჯიშო გათვლილია გადამრთველის მუშაობის პრინციპის გაცნობისთვის დ\
    ა პრაქტიკული გამოყენებისთვის. თუ წრედში ორი რეზისტორი გამოიყენეთ, გაამარტივეთ\
    \ და დატოვეთ მხოლოდ ერთი."
  validation:
    cases:
    - label: slide_left_one_led
      labelKa: გადამრთველი A–B — ანთებულია მხოლოდ ერთი შუქდიოდი
      switchStates:
        slide_switch: left
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
    - label: slide_right_other_led
      labelKa: გადამრთველი A–C — ანთებულია მეორე შუქდიოდი
      switchStates:
        slide_switch: right
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
      - role: leds
        metric: lit_set_changed
        op: gt
        value: 0.0
- code: SW.L1.2
  title: შუქდიოდის ნათების მომატება გადამრთველით
  displayOrder: 2
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: გადამრთველი, წითელი შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ შუქდიოდი უნდა აინთოს სუსტად;
    თუ გადამრთველს გადავრთავთ, შუქდიოდის ნათებამ უნდა მოიმატოს;
    თუ გადამრთველს დავაბრუნებთ უკან, შუქდიოდი კვლავ სუსტად უნდა ანათებდეს.

    გადამრთველის ერთ პოზიციაზე შუქდიოდი უნდა ანთდეს სუსტად, მეორე პოზიციაზე — ძლიერად.
  hint: |-
    გადამრთველის ერთ პოზიციაზე შუქდიოდში გაატარეთ სუსტი დენი, მეორე პოზიციაზე — ძლიერი; გამოიყენეთ განსხვავებული რეზისტორები (მაგ. A–B / მარცხენა — 5.1 kΩ სუსტი ნათებისთვის, A–C / მარჯვენა — 1 kΩ ძლიერი ნათებისთვის).
    კვების წყაროს ერთი პოლუსი მიაერთეთ გადამრთველის A პოლუსს; რეზისტორები მიაერთეთ B და C პოლუსებს.
  questions: |-
    გადააკეთეთ წრედი ისე, რომ შუქდიოდი თავიდან აინთოს სუსტად და ნათება მოიმატოს ძლიერად.
    გადააკეთეთ წრედი ისე, რომ შუქდიოდი თავიდან აინთოს ძლიერად და ნათება შემცირდეს.
    იმუშავებს თუ არა წრედი მხოლოდ ერთ კვების წყაროზე?
  methodology: "წინა სავარჯიშოს მსგავსად ესეც მარტივი, გაცნობითი ამოცანაა. მიზანია\
    \ ვიზუალურად დაინახონ, როგორ იმართება დენის ნაკადი გადამრთველით."
  validation:
    cases:
    - label: slide_left_lit
      labelKa: გადამრთველი A–B — შუქდიოდი ანთებულია
      switchStates:
        slide_switch: left
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 5.0E-4
    - label: slide_right_different_brightness
      labelKa: გადამრთველი A–C — ნათება შესამჩნევად განსხვავებულია
      switchStates:
        slide_switch: right
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 5.0E-4
      - role: led_1
        metric: forward_current_vs_prior_ratio
        op: gt
        value: 1.8
- code: SW.L2.3
  title: შუქდიოდის ნათების მომატება გადამრთველით და ერთი რეზისტორით
  displayOrder: 3
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: გადამრთველი, წითელი შუქდიოდი, მხოლოდ ერთი რეზისტორი და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ შუქდიოდი უნდა აინთოს სუსტად;
    თუ გადამრთველს გადავრთავთ, შუქდიოდის ნათებამ უნდა მოიმატოს;
    თუ გადამრთველს დავაბრუნებთ უკან, შუქდიოდი კვლავ სუსტად უნდა ანათებდეს.

    ეს არის წინა სავარჯიშოს მსგავსი ამოცანა იმ განსხვავებით, რომ უნდა გამოიყენოთ მხოლოდ ერთი რეზისტორი.
  hint: |-
    რადგან მხოლოდ ერთი რეზისტორის გამოყენების უფლება გვაქვს, შუქდიოდს განსხვავებული ნათებისთვის უნდა მივაწოდოთ განსხვავებული ძაბვა.
    განსხვავებული ძაბვის მისაღებად გამოიყენეთ კვების წყაროების შეერთების წერტილი (ნახევარი ძაბვა) და სრული ძაბვა: A–B — ნახევარი (სუსტი), A–C — სრული (ძლიერი).
  questions: |-
    წრედი გადააკეთეთ ისე, რომ ერთი წითელი შუქდიოდის ნაცვლად იგივე პირობით ინთებოდეს ორი მწვანე შუქდიოდი.
    გამოიყენეთ დამატებითი დეტალები და არ გამოიყენოთ კვების წყაროების შეერთების წერტილი.
  methodology: სავარჯიშოს მიზანია გაიხსენონ კვების შეერთების წერტილის (ნახევარი ძაბვა)
    უპირატესობა და გადამრთველით ორი განსხვავებული ძაბვის მიწოდება შუქდიოდზე.
  validation:
    cases:
    - label: slide_left_dim
      labelKa: გადამრთველი A–B — შუქდიოდი ანთებულია სუსტად
      switchStates:
        slide_switch: left
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 5.0E-4
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.007
    - label: slide_right_bright
      labelKa: გადამრთველი A–C — შუქდიოდის ნათება მომატებულია
      switchStates:
        slide_switch: right
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.002
      - role: led_1
        metric: forward_current_vs_prior
        op: gt
        value: 1.8
- code: SW.L2.4
  title: ნათურის ნათების მომატება გადამრთველით
  displayOrder: 4
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: გადამრთველი, ნათურა და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ნათურა უნდა აინთოს სუსტად;
    თუ გადამრთველს გადავრთავთ, ნათურის ნათებამ უნდა მოიმატოს;
    თუ გადამრთველს დავაბრუნებთ უკან, ნათურა კვლავ სუსტად უნდა ანათებდეს.

    გადამრთველის ერთ პოზიციაზე ნათურა უნდა ანთდეს სუსტად, მეორე პოზიციაზე — ძლიერად. ეს არის წინა სავარჯიშოს მსგავსი ამოცანა იმ განსხვავებით, რომ შუქდიოდის ნაცვლად უნდა გამოიყენოთ ნათურა.
  hint: გამოიყენეთ წინა ამოცანის შედეგი და გადამრთველით ჩართეთ ნათურა მაღალ და დაბალ
    ძაბვაზე (კვების შეერთების წერტილი — ნახევარი ძაბვა; სრული ძაბვა — ძლიერი ნათება).
  questions: |-
    გამოიყენეთ ჩამრთველი და წრედი გადააკეთეთ ისე, რომ ჩამრთველით შეეძლებოდეს წრედის ჩართვა-გამორთვა.
    გადააკეთეთ წრედი ისე, რომ ნათურასთან ერთად იცვლებოდეს შუქდიოდის ნათებაც.
  methodology: "ეს სავარჯიშო იგივეა, რაც წინა ამოცანა, მხოლოდ შუქდიოდი და რეზისტორ\
    ი უნდა ჩაანაცვლონ ნათურით. ასევე ეს სავარჯიშო მნიშვნელოვანია შემდგომი ამოცანის\
    \ ამოსახსნელად."
  validation:
    cases:
    - label: slide_left_dim
      labelKa: გადამრთველი A–B — ნათურა ანთებულია სუსტად
      switchStates:
        slide_switch: left
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.02
      - role: lamp
        metric: current
        op: lt
        value: 0.09
    - label: slide_right_bright
      labelKa: გადამრთველი A–C — ნათურის ნათება მომატებულია
      switchStates:
        slide_switch: right
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.08
      - role: lamp
        metric: current_vs_prior
        op: gt
        value: 1.5
- code: SW.L2.5
  title: ნათურის ნათების მომატება გადამრთველით და ორი კვებით
  displayOrder: 5
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: გადამრთველი, ნათურა, ორი კვების წყარო და ერთი ნებისმიერი დეტალი ნაკრებიდან.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ნათურა უნდა აინთოს სუსტად;
    თუ გადამრთველს გადავრთავთ, ნათურის ნათებამ უნდა მოიმატოს;
    თუ გადამრთველს დავაბრუნებთ უკან, ნათურა კვლავ სუსტად უნდა ანათებდეს.

    წინა სავარჯიშოსგან განსხვავებით ამ ამოცანაში არ გამოიყენოთ კვების შეერთების წერტილი.
  hint: |-
    რადგან კვების შეერთების წერტილის გამოყენების უფლება არ გვაქვს, ნათურაში გამავალი დენის შესამცირებლად გამოიყენეთ რეზისტორი.
    გამოიყენეთ რაც შეიძლება მცირე წინაღობა (მაგ. 20 Ω): ერთ პოზიციაზე რეზისტორი სერიულად, მეორეზე — შემოვლითი გზა.
  questions: |-
    შეუძლებელია თუ არა მსგავსი შედეგის მიღება 20 Ω რეზისტორის ნაცვლად სხვა დეტალების გამოყენებით?
    წრედი გადააკეთეთ ისე, რომ გადამრთველის ერთ პოზიციაზე ნათურა ანათებდეს სუსტად, მეორეზე კი კიდევ უფრო სუსტად.
  methodology: "ამ სავარჯიშოს მიზანია მიხვდნენ, რომელი დეტალი უნდა გამოიყენონ ნათუ\
    რის ნათების შესამცირებლად; უნდა აირჩიონ მაქსიმალურად დაბალი წინაღობის მქონე რე\
    ზისტორი და სწორად ჩართონ წრედში."
  validation:
    cases:
    - label: slide_left
      labelKa: გადამრთველი A–B — ნათურა ანთებულია (დაბალი R გზა)
