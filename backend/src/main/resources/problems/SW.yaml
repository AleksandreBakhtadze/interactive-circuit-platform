  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ორი გადამრთველი, ნათურა და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ნათურა შეიძლება ანთებული იყოს ან არა;
    თუ ერთ-ერთ გადამრთველს გადავრთავთ, ნათურამ უნდა შეიცვალოს მდგომარეობა (თუ ანთებულია — ჩაქრეს, თუ ჩაქრობილია — აინთოს);
    თუ მეორე გადამრთველს გადავრთავთ, ნათურამ ამ შემთხვევაშიც უნდა შეიცვალოს მდგომარეობა.

    პირობა ასეც შეიძლება ჩამოყალიბდეს: თუ ერთ-ერთ გადამრთველს შევუცვლით მდგომარეობას, ნათურამაც უნდა შეიცვალოს მდგომარეობა. ეს არის რევერსული ჩამრთველი, რომელსაც ხშირად ვიყენებთ სხვადასხვა ადგილიდან განათების ჩასართავად ან გამოსართავად.
  hint: |-
    ერთი გადამრთველის B და C პოლუსები მიაერთეთ მეორე გადამრთველის C და B პოლუსებს (ჯვარედინად).
    გამოიყენეთ გადამრთველების ორივე A პოლუსი — შეამოწმეთ, როგორ გაატარებს დენს ეს პოლუსები გადართვისას.
  questions: |-
    გამოიყენეთ ჩამრთველი და წრედი გადააკეთეთ ისე, რომ ჩამრთველით შეეძლებოდეს წრედის ჩართვა-გამორთვა.
    წრედი გადააკეთეთ ისე, რომ ნათურის ნაცვლად ინთებოდეს ლურჯი შუქდიოდი.
    წრედი გადააკეთეთ ისე, რომ ნათურის ნაცვლად ინთებოდეს წითელი და მწვანე შუქდიოდები ერთად.
