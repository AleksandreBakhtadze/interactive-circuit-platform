    წრედის აწყობის შემდეგ ნათურა უნდა აინთოს სუსტად, შუქდიოდი კი ძლიერად;
    თუ გადამრთველს გადავრთავთ, ნათურის ნათებამ უნდა მოიმატოს, შუქდიოდის კი შემცირდეს;
    თუ გადამრთველს დავაბრუნებთ უკან, ორივე უნდა დაბრუნდეს საწყის მდგომარეობაში.

    ეს არის წინა სავარჯიშოს ანალოგიური ამოცანა იმ განსხვავებით, რომ ერთის ნათება რომ ძლიერდება, მეორის სუსტდება.
  hint: |-
    გამოიყენეთ წინა ამოცანის შედეგი და წრედში მოძებნეთ ისეთი ორი წერტილი, რომელთა შორის ძაბვა მცირდება მაშინ, როდესაც ნათურის ნათება იმატებს;
    თუ წრედი ისე მოიქცევა, როგორც წინა დახმარებაში, ჩართეთ შუქდიოდი ამ წერტილებს შორის.
  questions: |-
    გამოიყენეთ ჩამრთველი და წრედი შეცვალეთ ისე, რომ თუ ჩამრთველი ჩართულია შუქდიოდი მუშაობდეს როგორც პირობაშია მოცემული, ხოლო თუ გამორთულია — შუქდიოდი ძლიერად აინთოს.
    წითელი შუქდიოდი ჩაანაცვლეთ მწვანე და ლურჯი შუქდიოდებით — ორივე ერთდროულად უნდა მუშაობდეს ისე, როგორც მუშაობდა წითელი შუქდიოდი.
  methodology: წრედის მუშაობისას კარგად აღიქვამენ სხვადასხვა წერტილებს შორის ძაბვის
    ცვლილებებს; კვანძის გამოყოფა ორი სხვადასხვა წერტილიდან რეზისტორებით ძაბვის გამყოფის
    მიღება და გამოყენება.
  validation:
    cases:
    - label: slide_left_inverse
      labelKa: "გადამრთველი A–B — ნათურა სუსტად, შუქდიოდი ძლიერად"
      switchStates:
        slide_switch: left
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.02
      - role: lamp
        metric: current
        op: lt
        value: 0.09
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.002
    - label: slide_right_swapped
      labelKa: "გადამრთველი A–C — ნათურა ძლიერად, შუქდიოდი სუსტად"
      switchStates:
        slide_switch: right
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.08
      - role: lamp
        metric: current_vs_prior
        op: gt
        value: 1.5
      - role: led_1
        metric: forward_current_vs_prior
        op: lt
        value: 0.7
