    გამოიყენეთ მხოლოდ შემდეგი დეტალები: გადამრთველი, ნათურა, ერთი წითელი შუქდიოდი, რეზისტორები და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ ნათურა და შუქდიოდი უნდა აინთოს სუსტად;
    თუ გადამრთველს გადავრთავთ, ნათურის და შუქდიოდის ნათებამ უნდა მოიმატოს;
    თუ გადამრთველს დავაბრუნებთ უკან, ორივე უნდა დაბრუნდეს საწყის მდგომარეობაში.

    გადამრთველის ერთ პოზიციაზე ორივე უნდა ანათებდეს სუსტად, მეორეზე კი ძლიერად.
