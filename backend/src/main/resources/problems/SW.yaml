- code: SW.L2.10
  title: ღილაკით და გადამრთველით ორი შუქდიოდის ნათების ცვალებადობა
  displayOrder: 10
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ერთი ღილაკი, ერთი გადამრთველი, ერთი მწვანე და ერთი ლურჯი შუქდიოდი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ერთ-ერთი შუქდიოდი უნდა აინთოს;
    თუ ღილაკს დავაწვებით, ანთებული შუქდიოდის ნათებამ უნდა მოიმატოს;
    თუ გადამრთველს გადავრთავთ, ანთებული შუქდიოდი უნდა ჩაქრეს და მეორე აინთოს;
    თუ ღილაკს ხელახლა დავაწვებით, ანთებული (მეორე) შუქდიოდის ნათებამ უნდა მოიმატოს;
    ღილაკით უნდა მოხდეს ნათების მომატება, გადამრთველით კი შეიცვალოს ანთებული შუქდიოდი.
  hint: |-
    ღილაკი და რეზისტორები ჩართეთ ისე, რომ ღილაკზე დაჭერით დენის ნაკადი იზრდებოდეს (მაგ. ორი რეზისტორი სერიულად, ღილაკი ერთს შემოავლოს);
    გადამრთველზე შუქდიოდები ჩართეთ ისე, რომ გადართვის შედეგად დენი ხან ერთში გადიოდეს, ხან მეორეში.
  questions: |-
    წრედი გადააკეთეთ ისე, რომ ლურჯი შუქდიოდი ჩართული იყოს მუდმივად, მწვანემ კი იმუშაოს ისე, როგორც პირობაშია.
    წრედი გადააკეთეთ ისე, რომ ლურჯი შუქდიოდი ინთებოდეს უფრო ძლიერად, ვიდრე მწვანე.
  methodology: "წინა სავარჯიშოს მსგავსად ამოცანა უნდა განიხილონ დამოუკიდებელ ნაწილ\
    ებად; აჩვევს, რომ ერთმანეთისგან დამოუკიდებელი წრედები გააერთიანონ საერთო წრედშ\
    ი. შეეცადონ, რომ წრედი გამოვიდეს მაქსიმალურად კომპაქტური."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ორივე შუქდიოდი ჩამქრალია
      switchStates:
        switch: open
        button_1: open
        slide_switch: left
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 0.0
    - label: slide_left_dim
      labelKa: ჩამრთველი ჩართულია (A–B) — ერთი შუქდიოდი ანთებულია სუსტად
      switchStates:
        switch: closed
        button_1: open
        slide_switch: left
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
      - role: leds
        metric: lit_forward_current
        op: gt
        value: 3.0E-4
      - role: leds
        metric: lit_forward_current
        op: lt
        value: 0.004
    - label: slide_left_boost
      labelKa: ღილაკი დაჭერილია (A–B) — ნათება მომატებულია
      switchStates:
        switch: closed
        button_1: closed
        slide_switch: left
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
      - role: leds
        metric: lit_forward_current_vs_prior
        op: gt
        value: 1.25
    - label: slide_right_swap
      labelKa: გადამრთველი A–C — ანთებულია მეორე შუქდიოდი
      switchStates:
        switch: closed
        button_1: open
        slide_switch: right
      checks:
      - role: leds
        metric: lit_count
        op: eq
        value: 1.0
      - role: leds
        metric: lit_set_changed
        op: gt
        value: 0.0
      - role: leds
        metric: lit_forward_current
        op: gt
        value: 3.0E-4
      - role: leds
        metric: lit_forward_current
        op: lt
        value: 0.004
    - label: slide_right_boost
      labelKa: ღილაკი დაჭერილია (A–C) — მეორე შუქდიოდის ნათება მომატებულია
      switchStates:
        switch: closed
