chapter: TCP
problems:
- code: TCP.L1.1
  title: შუქდიოდის ანთება დიდი ხნით
  displayOrder: 1
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN ტრანზისტორი, ღილაკი, მხოლოდ ერთი კონდენსატორი, წითელი შუქდიოდი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდი არ უნდა აინთოს;
    თუ დავაწვებით ღილაკს, შუქდიოდი უნდა აინთოს მყისიერად;
    თუ ავუშვებთ ღილაკს, შუქდიოდი უნდა დარჩეს ანთებული რამდენიმე წამი მაინც და შემდეგ ჩაქრეს.

    ღილაკზე დაჭერით შუქდიოდი უნდა აინთოს მყისიერად და აშვების შემდეგ შეინარჩუნოს ნათება რამდენიმე წამი მაინც.
  hint: |-
    გამოიყენეთ ტრანზისტორის დენის გაძლიერების თვისება — თუ ბაზა-ემიტერში გავატარებთ სუსტ დენს, კოლექტორ-ემიტერში გაივლის ბევრჯერ უფრო ძლიერი დენი;
    ღილაკით დამუხტეთ კონდენსატორი და მაღალი წინაღობის რეზისტორით მცირე დენი გაატარეთ ტრანზისტორის ბაზა-ემიტერში.
  questions: |-
    დამატებით გამოიყენეთ მეორე ანალოგიური კონდენსატორი და შუქდიოდის ნათების ხანგრძლივობა გაზარდეთ.
    დამატებით გამოიყენეთ მეორე ანალოგიური კონდენსატორი და შუქდიოდის ნათების ხანგრძლივობა შეამცირეთ.
    დამატებითი კონდენსატორის გამოყენების გარეშე შუქდიოდის ნათების ხანგრძლივობა გაანახევრეთ;
    წრედი შეცვალეთ ისე, რომ ღილაკის აშვების შემდეგ შუქდიოდის ნათება გახანგრძლივდეს ერთ წუთამდე.
  methodology: "ეს არის ტრანზისტორის და კონდენსატორის ერთობლივი გამოყენების პირველ\
    ი სავარჯიშო; შედეგის მისაღებად მთავარია მიხვდნენ, რომ დამუხტული კონდენსატორის\
    \ ენერგია რაც შეიძლება ნელა, მცირე დენის მოხმარებით დახარჯონ, მოხმარებული მცირ\
    ე დენი კი გამოიყენონ ტრანზისტორით შუქდიოდის ასანთებად. ამოცანა გააკეთონ როგორც\
    \ კოლექტორული, ასევე ემიტერული ჩართვით და შეადარონ ერთმანეთს."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — შუქდიოდი ჩამქრალია
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.001
    - label: switch_on_button_open
      labelKa: ჩამრთველი ჩართულია — შუქდიოდი ჩამქრალია
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.001
    - label: button_pressed_instant_on
      labelKa: ღილაკი დაჭერილია — შუქდიოდი მყისიერად ანთია
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.003
    - label: release_hold_then_fade
      labelKa: ღილაკის გაშვების შემდეგ ნათება რამდენიმე წამი რჩება და ჩაქრება
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: led_1
        metric: tran_forward_current_start
        op: gt
        value: 0.003
      - role: led_1
        metric: tran_forward_current_end
        op: lt
        value: 0.001
      simPhase: discharge
- code: TCP.L1.2
  title: შუქდიოდის ჩაქრობა დიდი ხნით
  displayOrder: 2
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN ტრანზისტორი, ღილაკი, მხოლოდ ერთი კონდენსატორი, წითელი შუქდიოდი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდი უნდა აინთოს;
    თუ დავაწვებით ღილაკს, შუქდიოდი უნდა ჩაქრეს მყისიერად;
    თუ ავუშვებთ ღილაკს, შუქდიოდი უნდა დარჩეს ჩამქრალი რამდენიმე წამი მაინც და შემდეგ აინთოს.

    ეს არის წინა ამოცანის შებრუნებული პირობა — ღილაკზე დაჭერით ანთებული შუქდიოდი უნდა ჩაქრეს მყისიერად და ღილაკის გათიშვის შემდეგ აინთოს რამდენიმე წამის დაგვიანებით.
  hint: |-
    გამოიყენეთ წინა ამოცანის შედეგი და შუქდიოდი ისე ჩართეთ წრედში, რომ როდესაც ტრანზისტორი გაიხსნება, შუქდიოდი ჩაქრეს;
    შუქდიოდი ჩართეთ ტრანზისტორის პარალელურად, კოლექტორ-ემიტერის პარალელურად.
  questions: |-
    როგორ შეიცვლება შუქდიოდის მუშაობა, თუ კონდენსატორის პარალელურად ჩავრთავთ 1µF კონდენსატორს?
    როგორ შეიცვლება შუქდიოდის მუშაობა, თუ კონდენსატორის მიმდევრობით ჩავრთავთ 1µF კონდენსატორს?
    გამოიყენეთ ლურჯი შუქდიოდი და წრედი შეცვალეთ ისე, რომ როდესაც ტრანზისტორი გაიხსნება, ლურჯი შუქდიოდი აინთოს, დაკეტილზე კი ჩაქრეს.
  methodology: "ეს არის წინა სავარჯიშოს მსგავსი ამოცანა; ამოსახსნელად მთავარია სწო\
    რი პოზიცია შეურჩიონ შუქდიოდს, გაიხსენონ პარალელური ჩართვა და ტრანზისტორით მოახ\
    დინონ შუქდიოდის შუნტირება. დასმული შეკითხვების დროს პრაქტიკულად უნდა შეამოწმონ\
    \ კონდენსატორის ტევადობის ცვლა მიმდევრობითი და პარალელური ჩართვისას."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — შუქდიოდი ჩამქრალია
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.001
    - label: switch_on_led_on
      labelKa: ჩამრთველი ჩართულია — შუქდიოდი ანთია
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 0.003
    - label: button_pressed_instant_off
      labelKa: ღილაკი დაჭერილია — შუქდიოდი მყისიერად ჩამქრალია
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 0.001
    - label: release_hold_off_then_on
      labelKa: "ღილაკის გაშვების შემდეგ რამდენიმე წამი ჩამქრალია, შემდეგ ანთება"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: led_1
        metric: tran_forward_current_start
        op: lt
        value: 0.001
      - role: led_1
        metric: tran_forward_current_end
        op: gt
        value: 0.003
      simPhase: discharge
- code: TCP.L1.3
  title: ნათურის ანთება დიდი ხნით
  displayOrder: 3
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN ტრანზისტორი, ღილაკი, კონდენსატორები, ნათურა, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ნათურა არ უნდა აინთოს;
    თუ დავაწვებით ღილაკს, ნათურა უნდა აინთოს მყისიერად;
    თუ ავუშვებთ ღილაკს, ნათურა უნდა დარჩეს ანთებული რამდენიმე წამი მაინც და შემდეგ ჩაქრეს.

    ღილაკზე დაჭერით ნათურა უნდა აინთოს მყისიერად და აშვების შემდეგ შეინარჩუნოს ნათება რამდენიმე წამი მაინც.
  hint: |-
    გამოიყენეთ წინა ამოცანების გამოცდილება და გაითვალისწინეთ, რომ ნათურა მოიხმარს ბევრად მეტ დენს ვიდრე შუქდიოდი;
    ნათურისთვის გამოიყენეთ კოლექტორული ჩართვა; გამოიყენეთ ორივე 470µF კონდენსატორი და პარალელურად ჩართეთ ისინი.
  questions: |-
    მიახლოებით გამოთვალეთ, რა ენერგიას გასცემს კონდენსატორი ღილაკის დაჭერიდან სრულ განმუხტვამდე პერიოდში?
    მიახლოებით გამოთვალეთ, რა ენერგიას მოიხმარს ნათურა ღილაკის დაჭერიდან სრულ ჩაქრობამდე და შეადარეთ კონდენსატორის მიერ გაცემულ ენერგიას;
    ააწყვეთ წრედი როგორც კოლექტორული, ასევე ემიტერული ჩართვით და ნახეთ, რა განსხვავება იქნება მათ შორის.
  methodology: "ამ სავარჯიშოს მთავარი მიზანია, რომ ნათურის მკვებავი ტრანზისტორი მა\
    ქსიმალურად დიდი ხნის განმავლობაში შეინარჩუნონ გახსნილ მდგომარეობაში. ამოცანის\
    \ შესრულების შემდეგ კარგი იქნება, თუ შეადარონ ნათურის მუშაობა და მასზე ძაბვის\
    \ ცვლილება კოლექტორული და ემიტერული ჩართვების დროს."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ნათურა ჩამქრალია
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_button_open
      labelKa: ჩამრთველი ჩართულია — ნათურა ჩამქრალია
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: button_pressed_instant_on
      labelKa: ღილაკი დაჭერილია — ნათურა მყისიერად ანთია
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: lamp
        metric: tran_current_abs_early
        op: gt
        value: 0.05
      - role: lamp
        metric: tran_current_abs_end
        op: gt
        value: 0.05
      simPhase: pressed
    - label: release_hold_then_fade
      labelKa: ღილაკის გაშვების შემდეგ ნათება რამდენიმე წამი რჩება და ჩაქრება
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: lamp
        metric: tran_current_abs_start
        op: gt
        value: 0.05
      - role: lamp
        metric: tran_current_abs_end
        op: lt
        value: 0.01
      simPhase: discharge
- code: TCP.L1.4
  title: ნათურის ნელი ანთება
  displayOrder: 4
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN ტრანზისტორი, ღილაკი, კონდენსატორები, ნათურა, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ნათურა არ უნდა აინთოს;
    თუ დავაწვებით ღილაკს, ნათურა უნდა აინთოს თანდათან და საკმაოდ ნელა;
    თუ ავუშვებთ ღილაკს, ნათურა ანთებასთან შედარებით ბევრად უფრო ჩქარა უნდა ჩაქრეს.

    ღილაკზე დაჭერით ნათურა უნდა აინთოს ნელა და ღილაკის აშვების შემდეგ ჩაქრეს საკმაოდ ჩქარა.
  hint: |-
    გამოიყენეთ წინა ამოცანების შედეგები და გაითვალისწინეთ, რომ რაც უფრო მაღალი წინაღობის გავლით დავმუხტავთ კონდენსატორს, მით უფრო ნელა გაიზრდება მასზე ძაბვა;
    წრედის ასაწყობად შეგიძლიათ გამოიყენოთ კოლექტორული და ემიტერული ჩართვებიც;
    ემიტერული ჩართვის დროს ტრანზისტორის გასახსნელად საჭიროა მაღალი ძაბვა და შედარებით სუსტი დენის ნაკადი; კოლექტორული ჩართვის დროს საკმარისია დაბალი ძაბვაც, მაგრამ მოითხოვს შედარებით უფრო ძლიერ დენის ნაკადს.
  questions: |-
    გამოიყენეთ ძრავი და ღილაკზე დაჭერის შემდეგ ძრავმა თანდათან მოიმატოს სიჩქარეს.
    ააწყვეთ წრედი როგორც კოლექტორული, ასევე ემიტერული ჩართვით და ნახეთ, რა განსხვავება იქნება მათ შორის.
  methodology: "წინა სავარჯიშოებისგან განსხვავებით, ამ ამოცანაში მაქსიმალურად უნდა\
    \ გაზარდონ კონდენსატორის დამუხტვის პერიოდი; სწორად უნდა შეარჩიონ დამმუხტავი რე\
    ზისტორის წინაღობა ჩართვის წრედის ტიპიდან გამომდინარე. ამ სავარჯიშოშიც სასურველ\
    ია, რომ ააწყონ ორივე — კოლექტორული და ემიტერული — და შეადარონ ერთმანეთს."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ნათურა ჩამქრალია
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_button_open
      labelKa: ჩამრთველი ჩართულია — ნათურა ჩამქრალია
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: press_slow_brighten
      labelKa: ღილაკის დაჭერა — ნათურა თანდათან ანთდება
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: lamp
        metric: tran_current_abs_start
        op: lt
        value: 0.02
      - role: lamp
        metric: tran_current_abs_early
        op: lt
        value: 0.03
      - role: lamp
        metric: tran_current_abs_end
        op: gt
        value: 0.05
      simPhase: pressed
    - label: release_faster_fade
      labelKa: ღილაკის გაშვება — ნათურა შედარებით ჩქარა ჩაქრება
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: lamp
        metric: tran_current_abs_start
        op: gt
        value: 0.05
      - role: lamp
        metric: tran_current_abs_end
        op: lt
        value: 0.025
      - role: lamp
        metric: tran_current_abs_fall
        op: gt
        value: 0.04
      simPhase: discharge
- code: TCP.L3.5
  title: ბუნებრივი ანთება ღილაკზე პერიოდული დაჭერით
  displayOrder: 5
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN ტრანზისტორი, ღილაკი, კონდენსატორები, ნათურა, რეზისტორები, ორი კვების წყარო და ჩამრთველი; ასევე შეგიძლიათ გამოიყენოთ ნებისმიერი სხვა დეტალები ნაკრებიდან.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ნათურა არ უნდა აინთოს;
    თუ დავაწვებით ღილაკს, ნათურა შეიძლება მომენტალურად აინთოს და ჩაქრეს;
    თუ ავუშვებთ ღილაკს, ნათურა უნდა დარჩეს ჩამქრალი;
    თუ ღილაკს პერიოდულად ჩავრთავთ-გავთიშავთ საკმარისად ჩქარა, ნათურა უნდა აინთოს;
    ღილაკზე პერიოდული დაჭერით ნათურა უნდა აინთოს — თუ შევწყვეტთ ღილაკზე დაჭერას, ნათურა უნდა ჩაქრეს.
  hint: |-
    გამოიყენეთ კონდენსატორის დენის გატარების თვისება: კონდენსატორი არ ატარებს მუდმივ დენს და, მისგან განსხვავებით, კარგად ატარებს ცვალებად დენს;
    კონდენსატორი ჩართეთ ტრანზისტორის ბაზაზე მიმავალ წრედში; მის მეორე ბოლოზე ღილაკის ჩართვა-გათიშვით მიიღეთ ცვალებადი დენი;
    გაითვალისწინეთ, რომ ტრანზისტორის ბაზა-ემიტერის გადასვლა ჩვეულებრივი დიოდია და დენს კარგად ატარებს მხოლოდ ერთი მიმართულებით.
  questions: |-
    როგორ შეიცვლება ნათურის ნათება, თუ კონდენსატორის პარალელურად ჩავრთავთ მეორე იგივე ტევადობის კონდენსატორს?
    როგორ შეიცვლება ნათურის ნათება, თუ კონდენსატორის მიმდევრობით ჩავრთავთ მეორე იგივე ტევადობის კონდენსატორს?
  methodology: "ეს არის საკმაოდ განსხვავებული სავარჯიშო წინა ამოცანებთან შედარებით\
    . უნდა გამოიყენონ კონდენსატორის მიერ მხოლოდ ცვალადი დენის გატარების თვისება და\
    \ კონდენსატორის დამუხტვა-განმუხტვის ციკლისთვის გამოიყენონ დიოდის რევერსული ჩარ\
    თვა, რადგან მოაგვარონ ბაზა-ემიტერის მიერ დენის მხოლოდ ცალმხრივად გატარების პრო\
    ბლემა."
