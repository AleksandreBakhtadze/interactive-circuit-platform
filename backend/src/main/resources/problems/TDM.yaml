chapter: TDM
problems:
- code: TDM.L2.3
  title: ძრავის ორმხრივი დატრიალება გადამრთველით
  displayOrder: 3
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ორი NPN და ერთი PNP ტრანზისტორი, გადამრთველი, ძრავი, ორი 1k რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ძრავი უნდა დატრიალდეს ერთი მიმართულებით მაქსიმალური სიჩქარით;
    თუ გადამრთველს გადავრთავთ, ძრავმა უნდა შეიცვალოს ბრუნვის მიმართულება და ისევ მაქსიმალური სიჩქარით დატრიალდეს;

    ეს არის პირველი ამოცანის მსგავსი სავარჯიშო იმ განსხვავებით რომ რელეს ნაცვლად უნდა გამოიყენოთ ტრანზისტორები.

    გადამრთველის ერთ პოზიციაზე ძრავი უნდა ტრიალებდეს ერთი მიმართულებით ხოლო მეორე პოზიციაზე მეორე მიმართულებით, არ გამოიყენოთ კვებების ნახევარი ძაბვა.
  hint: |-
    გამოიყენეთ პირველი ამოცანის შედეგი და რელე ჩანაცვლეთ NPN, PNP ტრანზისტორების წყვილით, ამ წყვილმა უნდა უზრუნველყოს ძრავის ერთ პოლუსზე კვების პოლარობის ცვლა;
    ტრანზისტორების წყვილის სამართავად გამოიყენეთ NPN ტრანზისტორი რომლის გაიხსნა-დაკეტვა გადამრთველით იქნება შესაძლებელი;
    წყვილის სამართავი NPN ტრანზისტორი ისე ჩართეთ წრედში რომ ძრავის პოლუსებზე ყოველთვის განსხვავებული ძაბვა მიეწოდებოდეს.
  questions: |-
    როგორ შეიცვლება წრედის მუშაობის პრინციპი თუ 1k რეზისტორებს ჩავანაცვლებთ 100 და შემდეგ 10k რეზისტორებით?
    ააწყვეთ იგივე წრედი ორი PNP და ერთი NPN ტრანზისტორის გამოყენებით.
  methodology: "ეს სავარჯიშოში უნდა გამოიყენონ წინა ორი ამოცანის გამოცდილება, NPN-PNP\
    \ წყვილით გა ჩაანაცვლონ რელე და მიხვდნენ რომ წინა ამოცანისგან განსხვავებით წყვ\
    ილის სამართავი ღილაკი შეცვალონ NPN ტრანზისტორით. პირველ შეკითხვაში, რეზისტორებ\
    ის შეცვლით წრედის მუშაობის პრინციპი არ შეიცვლება, მხოლოდ უნდა ახსნან რატომ შემ\
    ცირდება 10k წინაღობების გამოყენების დროს ძრავის სიმძლავრე."
  validation:
    cases:
    - label: slide_left
      labelKa: გადამრთველი A–B — ძრავი ტრიალებს
      switchStates:
        slide_switch: left
        switch: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.04
    - label: slide_right_reversed
      labelKa: გადამრთველი A–C — ბრუნვის მიმართულება შეცვლილია
      switchStates:
        slide_switch: right
        switch: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.04
      - role: motor_1
        metric: current_reversed_vs_prior
        op: gt
        value: 0.5
- code: TDM.L2.4
  title: ძრავის ორმხრივი დატრიალება ორი ღილაკით
  displayOrder: 4
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ორი NPN და ორი PNP ტრანზისტორი, ძრავი, ორი ღილაკი, ორი 1k რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ძრავი არ უნდა დატრიალდეს;
    თუ პირველ ღილაკს დავაწვებით ძრავმა უნდა დატრიალდეს ერთი მიმართულებით მაქსიმალური სიჩქარით;
    თუ მეორე ღილაკს დავაწვებით ძრავმა უნდა დატრიალდეს მეორე მიმართულებით მაქსიმალური სიჩქარით;
    თუ ორივე ღილაკს დავაწვებით ძრავი უნდა გაჩერდეს;

    ერთ ღილაკზე დაჭერით ძრავი უნდა დატრიალდეს ერთი მიმართულებით, მეორე ღილაკზე დაჭერით მეორე მიმართულებით, ორივეზე დაჭერით კი გაჩერდეს.
  hint: "გამოიყენეთ წინა ამოცანების გამოცდილება და ძრავის ორივე პოლუსი ჩართეთ NPN,\
    \ PNP ტრანზისტორების წყვილებზე; ერთი ღილაკი გამოიყენეთ ერთი წყვილის სამართავად\
    , მეორე ღილაკი მეორე წყვილის სამართავად."
  questions: |-
    თეორიულად განიხილეთ, როგორ (რა სიმძლავრით) დატრიალდება ძრავი რომ შეგვეძლოს ღილაკზე წამში 100-ჯერ თითის დაჭერა და აშვება? ჩათვალეთ რომ ღილაკზე დაჭერის და აშვების პერიოდი ერთნაირია.
    არ გამოიყენოთ დამატებითი დეტალები და შეცვალეთ წრედის ლოგიკა, თუ არც ერთ ღილაკს არ დავაწვებით ძრავი დატრიალდეს ერთი მიმართულებით თუ დავაწვებით ორივეს დატრიალდეს მეორე მიმართულებით ხოლო თუ დავაწვებით ერთ-ერთ ღილაკს ძრავი გაჩერდეს.
  methodology: "ამ სავარჯიშოს მიზანია პრაქტიკულად ნახონ H-Bridge-ის მუშაობის პრინც\
    იპი, სასურველია ახსნან ძრავში დენის ნაკადის მოძრაობა ღილაკების ყველა შესაძლო ვ\
    არიანტისთვის, განიხილონ როგორც ძირითადი ასევე მეორე შეკითხვაში მოცემული ამოცან\
    ის პირობა. პირველ შეკითხვაში უნდა ახსნან თუ რატომ განახევრდება ძრავის სიმძლავრ\
    ე, მიაქციონ ყურადღება როგორ შეიძლება ძრავის სიმძლავრის მართვა ციფრული იმპულსებ\
    ის გამოყენებით."
  validation:
    cases:
    - label: idle_stop
      labelKa: "ჩამრთველი ჩართულია, ღილაკები აშვებული — ძრავი გაჩერებულია"
      switchStates:
        switch: closed
        button_1: open
        button_2: open
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.001
    - label: button1_spin
      labelKa: პირველი ღილაკი — ძრავი ტრიალებს
      switchStates:
        switch: closed
        button_1: closed
        button_2: open
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.04
    - label: button2_reversed
      labelKa: მეორე ღილაკი — მიმართულება შეცვლილია
      switchStates:
        switch: closed
        button_1: open
        button_2: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.04
      - role: motor_1
        metric: current_reversed_vs_prior
        op: gt
        value: 0.5
    - label: both_stop
      labelKa: ორივე ღილაკი — ძრავი გაჩერებულია
      switchStates:
        switch: closed
        button_1: closed
        button_2: closed
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.02
- code: TDM.L3.5
  title: ძრავის ორმხრივი დატრიალება ერთი ღილაკით
  displayOrder: 5
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ორი NPN და ორი PNP ტრანზისტორი, NPN დარლინგტონის წყვილი, ძრავი, ღილაკი, სამი 1k რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ძრავი უნდა დატრიალდეს ერთი მიმართულებით მაქსიმალური სიჩქარით;
    თუ ღილაკს დავაწვებით ძრავმა უნდა შეიცვალოს ბრუნვის მიმართულება და ისევ მაქსიმალური სიჩქარით დატრიალდეს;
    თუ ღილაკს ავუშვებთ ძრავი უნდა დაუბრუნდეს ძველ ბრუნვის მიმართულებას;

    ღილაკზე დაჭერით ძრავი უნდა იცვლიდეს ბრუნვის მიმართულებას, აშვების შემდეგ კი ბრუნდებოდეს ძველ ბრუნვის მიმართულებაზე.
  hint: |-
    გამოიყენეთ წინა ამოცანის შედეგი და ერთი ღილაკი ჩაანაცვლეთ NPN დარლინგტონის წყვილით;
    NPN წყვილი ისე დააკავშირეთ ღილაკთან რომ როდესაც ღილაკს დავაწვებით NPN წყვილი დაიკეტოს, სხვა შემთხვევაში გახსნილი იყოს;
    დარლინგტონის ბაზა ღილაკის კვანძს 1k რეზისტორით დააკავშირეთ, რომ ორივე H-ხიდის მხარე ერთდროულად არ ჩაირთოს.
  questions: |-
    შეცვალეთ წრედი ისე რომ NPN დარლინგტონის წყვილის ნაცვლად გამოიყენოთ PNP წყვილი;
    დამატებით გამოიყენეთ ერთი ღილაკი და წრედი შეცვალეთ ისე რომ, ამ ღილაკზე დაჭერის დროს ძრავი ჩერდებოდეს;
    თეორიულად განიხილეთ, როგორ დატრიალდება ძრავი რომ შეგვეძლოს ღილაკზე წამში 100-ჯერ თითის დაჭერა და აშვება? ჩათვალეთ რომ ღილაკზე დაჭერის და აშვების პერიოდი ერთნაირია. უხეშად შეაფასეთ რა სიმძლავრეს მოიხმარს ძრავი ამ დროს.
  methodology: "საკმაოდ მარტივი სავარჯიშოა წინა ამოცანის შესრულების შემდეგ. შედეგი\
    ს მისაღებად თითქმის არ დაჭირდებათ ძველი წრედის გადაკეთება, მთავარია სწორი პოზი\
    ცია მოუძებნონ NPN წყვილს და დააკავშირონ ღილაკთან. მესამე შეკითხვაში გა ახსნან\
    \ თუ რატომ არ დატრიალდება ძრავი ღილაკზე პერიოდული დაჭერით, გაითვალისწინონ გაჩე\
    რებული ძრავის შიდა წინაღობა და შეაფასონ მოხმარებული სიმძლავრე (ძრავის შიდა ინდ\
    უქტიურობა უგულებელყონ)."
  validation:
    cases:
    - label: idle_spin
      labelKa: "ჩამრთველი ჩართულია, ღილაკი აშვებული — ძრავი ტრიალებს"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.04
    - label: button_reversed
      labelKa: ღილაკი — ბრუნვის მიმართულება შეცვლილია
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.04
      - role: motor_1
        metric: current_reversed_vs_prior
        op: gt
        value: 0.5
- code: TDM.L1.7
  title: ძრავის კონტროლი ცვლადი რეზისტორით I
  displayOrder: 7
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: NPN და PNP ტრანზისტორი, ძრავი, ცვლადი რეზისტორი და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ წრედის აწყობის შემდეგ, ცვლადი რეზისტორის ცოცია დააყენეთ ცენტრში ძრავი არ უნდა დატრიალდეს;
    თუ ცოციას ცენტრიდან გადავაადგილებთ ერთი მიმართულებით ძრავმა უნდა დაიწყოს ტრიალი და თანდათან მოუმატოს ბრუნვის სიჩქარე;
    თუ ცოციას ცენტრიდან გადავაადგილებთ მეორე მიმართულებით ძრავმა უნდა დაიწყოს მეორე მიმართულებით ტრიალი და თანდათან მოუმატოს ბრუნვის სიჩქარე;

    ცენტრიდან ცოციას ერთი მიმართულებით გადაადგილების დროს ძრავი უნდა დატრიალდეს ერთი მიმართულებით, ცენტრიდან მეორე მიმართულებით გადაადგილებისას კი დატრიალდეს მეორე მიმართულებით. შეგიძლიათ გამოიყენოთ კვების ნახევარი ძაბვა.
  hint: |-
    ერთმანეთს მიაერთეთ ტრანზისტორების ბაზები და ემიტერები, მიიღებთ მიმდევრობით ჩართულ ორ ტრანზისტორს რომელთაც საერთო ბაზა ექნებათ;
    ტრანზისტორის კოლექტორები ჩართეთ კვების პოლუსებზე, ძრავი ჩართეთ ტრანზისტორების ემიტერზე, ცვლადი რეზისტორი გამოიყენეთ როგორც ძაბვის გამყოფი და ცოციას ძაბვა მიაწოდეთ ბაზაზე.
  questions: |-
    დამატებით გამოიყენეთ ღილაკი და წრედი შეცვალეთ ისე რომ, ღილაკზე დაჭერის დროს ძრავი ჩერდებოდეს;
    რა სიმძლავრეს მოიხმარს ძრავი თუ ცოციას გადავაადგილებთ ერთ-ერთ განაპირა მხარეს?
    დამატებით გამოიყენეთ წითელი და მწვანე შუქდიოდები და წრედი შეცვალეთ ისე რომ ძრავის ერთი მიმართულებით ბრუნვისას აინთოს წითელი ხოლო მეორე მიმართულებით ბრუნვის დროს კი მწვანე შუქდიოდი.
  methodology: "არ არის რთული სავარჯიშო, ამოცანის პირობაში იმდენად შეზღუდული აქვთ\
    \ დეტალების არჩევანი რომ მარტივად უნდა მიხვდნენ შედეგის მისაღებად გამოიყენონ NPN\
    \ და PNP ტრანზისტორებით აწყობილი \"half-bridge\"-ის წრედი. მიღებული წრედი კარგ\
    ად დაეხმარებათ მომდევნო ორი ამოცანის ამოხსნაში. ამ ამოცანაში, რადგან ძრავი ემი\
    ტერულად არის ჩართული ტრანზისტორებთან და მასზე მოდებული მაქსიმალური ძაბვა არის\
    \ მხოლოდ კვების ძაბვის ნახევარი, ცვლადი რეზისტორის საკმაოდ დიდ სეგმენტზე ძრავი\
    \ იქნება გაჩერებული, მხოლოდ განაპირა მხარეებთან დაიწყებს ტრიალს."
  validation:
    cases:
    - label: pot_center_stop
      labelKa: ცოცია ცენტრში — ძრავი გაჩერებულია
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.001
      potPositions:
        variable_resistor: 0.5
    - label: pot_one_end_spin
      labelKa: ცოცია ერთ ნაპირზე — ძრავი ტრიალებს
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.04
      potPositions:
        variable_resistor: 0.0
    - label: pot_other_end_reversed
      labelKa: ცოცია მეორე ნაპირზე — მიმართულება შეცვლილია
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.04
      - role: motor_1
        metric: current_reversed_vs_prior
        op: gt
        value: 0.5
      potPositions:
        variable_resistor: 1.0
- code: TDM.L2.8
  title: ძრავის კონტროლი ცვლადი რეზისტორით II
  displayOrder: 8
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ორი NPN და ერთი PNP ტრანზისტორი, ძრავი, ცვლადი რეზისტორი, 1k რეზისტორი და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ წრედის აწყობის შემდეგ, ცვლადი რეზისტორის ცოციას დააყენეთ ერთ-ერთ განაპირა მხარეს ძრავი უნდა დატრიალდეს;
    თუ ცოციას გადავაადგილებთ მეორე განაპირა მხარეს, ცოციას გარკვეულ პოზიციაზე ძრავი უნდა ჯერ გაჩერდეს, შემდეგ კი მალევე დატრიალდეს და შეიცვალოს ბრუნვის მიმართულება;
    თუ ცოციას დავაბრუნებთ პირველ განაპირა მხარეს, ცოციას იგივე პოზიციაზე ძრავმა ძველი მიმართულებით უნდა დაიწყოს ბრუნვა;

    ცოციას ერთი ბოლოდან მეორე ბოლოსკენ გადაადგილების დროს ცოციას გარკვეულ პოზიციაზე ძრავი საკმაოდ სწრაფად უნდა ჩერდებოდეს და შემდეგ მალევე იცვლიდეს ბრუნვის მიმართულებას.
  hint: |-
    გამოიყენეთ წინა ამოცანის შედეგი, და დამატებითი NPN ტრანზისტორით მაქსიმალურად მყისიერად შეცვალეთ ძაბვა NPN და PNP ტრანზისტორების წყვილის საერთო ბაზაზე;
    დამატებითი NPN ტრანზისტორი კოლექტორულად ჩართეთ წყვილი ტრანზისტორების საერთო ბაზასა და ცვლად რეზისტორს შორის.
  questions: |-
    გამოიყენეთ ჩამრთველი და ისე ჩართეთ წრედში რომ ძრავი ითიშებოდეს ჩამრთველით;
    გამოიყენეთ სხვა დეტალები და წრედი შეცვალეთ ისე რომ არ გამოიყენოთ კვების ნახევარი ძაბვა;
    გამოიყენეთ სხვა დეტალები და წრედი შეცვალეთ ისე რომ ძრავი ბრუნვის მიმართულებას იცვლიდეს მაშინ როცა ცოცია გაივლის შუა წერტილს.
  methodology: "არ არის რთული სავარჯიშო, მთავარია მიხვდნენ რომ დამატებითი ტრანზისტ\
    ორის ჩართვა გამოიყენონ ცვლადი რეზისტორის ძაბვის მაქსიმალურად მყისიერად შეცვლის\
    თვის. დამატებითი ტრანზისტორი გაიხსნება და დაიკეტება ცვლადი რეზისტორის საკმაოდ\
    \ მცირე სეგმენტზე. მეორე შეკითხვაში ისე უნდა შეარჩიონ დამატებითი რეზისტორები რ\
    ომ ძრავის გადართვის წერტილი ცვლადი რეზისტორის მაქსიმალურად ცენტრში აღმოჩნდეს."
  validation:
