      potPositions:
        variable_resistor: 0.0
    - label: rising_near_on_stays_on
      labelKa: ცოცია ქვემოდან ოდნავ ასწიეთ — ნათურა ჯერ ანთია
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: gt
