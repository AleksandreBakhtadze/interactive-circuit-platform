- code: TFB.L3.3
  title: ნათურის დისკრეტული ანთება ცვალებადი რეზისტორით
  displayOrder: 3
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN და PNP ტრანზისტორი, ნათურა, ცვალებადი რეზისტორი, სამი მუდმივი 1 kΩ რეზისტორი, სამი რბილი გამტარი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    ცოცია დააყენეთ ცვალებადი რეზისტორის განაპირა მხარეს; თუ ჩავრთავთ წრედს, ნათურა არ უნდა აინთოს;
    თუ ცოციას გადავაადგილებთ მეორე განაპირა მხარეს, NPN ტრანზისტორის ბაზა–ემიტერზე უნდა გაიზარდოს ძაბვა და ცოციას გარკვეულ პოზიციაზე ნათურა უნდა აინთოს მყისიერად;
    თუ ცოციას გადავაადგილებთ პირველ განაპირა მხარეს, NPN ტრანზისტორის ბაზა–ემიტერზე ძაბვა უნდა შემცირდეს და გარკვეული პოზიციიდან ნათურამ უნდა ჩაქრეს მყისიერად;

    ცოციას ძალიან ნელი გადაადგილებითაც კი ნათურის სანახევროდ ანთება შეუძლებელი უნდა იყოს — ნათურა ან სრულად უნდა აინთოს, ან სრულად უნდა ჩაქრეს.

    ეს არის წინა სავარჯიშოების მსგავსი ამოცანა იმ განსხვავებით, რომ დამატებით შეგიძლიათ გამოიყენოთ მესამე 1 kΩ რეზისტორი; თუ ადრე შეიძლებოდა ნათურის არასრული ნათების მიღწევა ცოციას ძალიან ზუსტად გადაადგილების შედეგად, ახლა ეს შეუძლებელი უნდა იყოს.
  hint: |-
    გამოიყენეთ წინა ამოცანის შედეგი და ის ფაქტი, რომ ბაზაზე ძაბვის ზრდა იწვევს კოლექტორზე ძაბვის ზრდას;
    ცვლადი რეზისტორი გამოიყენეთ როგორც ძაბვის გამყოფი: ცოცია (პინი A, სამკუთხედის წვერო) მიაერთეთ NPN-ის ბაზასთან, B და C — კვების სარკინეთებთან;
    1 kΩ რეზისტორი გამოიყენეთ დადებითი უკუკავშირის მისაღებად;
    1 kΩ რეზისტორი ჩართეთ NPN ტრანზისტორის ბაზასა და PNP ტრანზისტორის კოლექტორს შორის.
  questions: |-
    როგორი უკუკავშირი წერია და რატომ არის შეუძლებელი ნათურის სანახევროდ ანთება?
    როგორ იმუშავებს წრედი, თუ უკუკავშირის 1 kΩ რეზისტორს ჩავანაცვლებთ 5 kΩ, 10 kΩ, 100 kΩ რეზისტორებით? შეამოწმეთ პრაქტიკაში.
  methodology: "ამ სავარჯიშოს ძირითადი მიზანია დადებითი უკუკავშირის პრაქტიკული გამ\
    ოყენება და შესაბამისი შედეგის მიღება. უნდა შეადარონ წინა ამოცანას და ახსნან, რ\
    ამ გამოიწვია ნათურის ნათების მყისიერი ანთება და რატომ არის შეუძლებელი ნათურის\
    \ ნაწილობრივი ანთების მიღება. მეორე შეკითხვისას განსაკუთრებული ყურადღება მიაქც\
    იონ, თუ როგორ ცვლის სხვადასხვა რეზისტორი ნათურის ასანთებ და ჩასაქრობ პოზიციას\
    \ ცოციასთვის."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ნათურა ჩამქრალია
      switchStates:
        switch: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      potPositions:
        variable_resistor: 0.0
    - label: switch_on_pot_off
      labelKa: "ჩამრთველი ჩართულია, ცოცია ნაპირზე — ნათურა ჩამქრალია"
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.01
      potPositions:
        variable_resistor: 0.0
    - label: rising_near_off_stays_off
      labelKa: ცოცია ქვემოდან ოდნავ ასწიეთ — ნათურა ჯერ ჩამქრალია
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.01
      potPositions:
        variable_resistor: 0.05
      priorPotPositions:
        variable_resistor: 0.0
    - label: rising_snap_on
      labelKa: ცოცია შუაში ქვემოდან — ნათურა მყისიერად სრულად ანთია
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
      potPositions:
        variable_resistor: 0.5
      priorPotPositions:
        variable_resistor: 0.0
    - label: falling_near_off_stays_on
      labelKa: ცოცია ზემოდან იგივე ზონაში — უკუკავშირი ნათურას ანთებულს ტოვებს
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
      - role: lamp
        metric: current_vs_prior
        op: lt
        value: 1.4
      potPositions:
        variable_resistor: 0.05
      priorPotPositions:
        variable_resistor: 1.0
    - label: falling_off
      labelKa: ცოცია ისევ ნაპირზე — ნათურა მყისიერად ჩაქრება
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.01
      potPositions:
        variable_resistor: 0.0
      priorPotPositions:
        variable_resistor: 1.0
- code: TFB.L3.4
  title: ნათურის მართვა ორი ღილაკით
  displayOrder: 4
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN და PNP ტრანზისტორი, ორი ღილაკი, ნათურა, ცვალებადი რეზისტორი, სამი მუდმივი 1 kΩ რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის ჩართვის შემდეგ ნათურა არ უნდა აინთოს;
    თუ პირველ ღილაკს დავაწვებით, ნათურა უნდა აინთოს და დარჩეს ანთებული;
    თუ მეორე ღილაკს დავაწვებით, ანთებული ნათურა უნდა ჩაქრეს და დარჩეს ჩამქრალი;

    ერთმა ღილაკმა უნდა აანთოს ნათურა და დატოვოს ანთებული, მეორემ კი უნდა ჩააქროს და დატოვოს ჩამქრალი.
  hint: |-
    გამოიყენეთ წინა ამოცანის შედეგი და გაითვალისწინეთ, რომ ცოციას გარკვეულ პოზიციაზე ნათურა შეიძლება იყოს ანთებულიც და ჩამქრალიც, იმის მიხედვით, რა მდგომარეობაში იყო მანამდე;
    ცოცია დააყენეთ ნათურის ჩამრთველ და გამთიშველ პოზიციებს შორის;
    ერთი ღილაკი ისე ჩართეთ, რომ დაჭერისას ტრანზისტორი იძულებით გახსნას, ხოლო მეორე ისე, რომ დაჭერისას ტრანზისტორი ჩაკეტოს.
  questions: |-
    როგორ შეიცვლება წრედის მუშაობა, თუ უკუკავშირის 1 kΩ რეზისტორს ჩავანაცვლებთ 10 kΩ რეზისტორით?
    შეცვალეთ წრედი ისე, რომ არ გამოიყენოთ ცვლადი რეზისტორი.
  methodology: "სავარჯიშოს მიზანია ჰისტერეზისის ეფექტის ნახვა და წინა ამოცანაში მი\
    ღებული ლათჩის გამოყენება. მოსწავლემ სწორად უნდა ჩართოს ტრანზისტორის გამხსნელი\
    \ და ჩამკეტი ღილაკები. პირველ შეკითხვაში უნდა შეაფასოს, როგორ ცვლის უკუკავშირი\
    ს რეზისტორის მნიშვნელობა ჰისტერეზისის დიაპაზონს და რატომ შეიძლება იყოს ეს უკეთ\
    ესი ან უარესი კონკრეტული შედეგისთვის."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ნათურა ჩამქრალია
      switchStates:
        switch: open
        button_1: open
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      potPositions:
        variable_resistor: 0.05
    - label: power_on_idle_off
      labelKa: ჩამრთველი ჩართულია — ნათურა ჩამქრალია
      switchStates:
        switch: closed
        button_1: open
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.01
      potPositions:
        variable_resistor: 0.05
    - label: press_set_on
      labelKa: პირველ ღილაკზე დაჭერა — ნათურა ანთია
      switchStates:
        switch: closed
        button_1: closed
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
      potPositions:
        variable_resistor: 0.05
      priorSwitchStates:
        switch: closed
        button_1: open
        button_2: open
    - label: release_after_set_stays_on
      labelKa: პირველი ღილაკის გაშვება — ნათურა ანთებული რჩება
      switchStates:
        switch: closed
        button_1: open
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
      - role: lamp
        metric: current_vs_prior
        op: lt
        value: 1.4
      potPositions:
        variable_resistor: 0.05
      priorSwitchStates:
        switch: closed
        button_1: closed
        button_2: open
    - label: press_reset_off
      labelKa: მეორე ღილაკზე დაჭერა — ნათურა ქრება
      switchStates:
        switch: closed
        button_1: open
        button_2: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.01
      potPositions:
        variable_resistor: 0.05
      priorSwitchStates:
        switch: closed
