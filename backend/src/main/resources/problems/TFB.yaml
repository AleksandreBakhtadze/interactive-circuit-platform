chapter: TFB
problems:
- code: TFB.L1.1
  title: ნათურის სინქრონული ანთება ცვალებადი რეზისტორით I
  displayOrder: 1
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN დარლინგტონის წყვილი, ნათურა, ცვალებადი რეზისტორი, ერთი მუდმივი 1 kΩ რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    ცოცია დააყენეთ ცვალებადი რეზისტორის განაპირა მხარეს; თუ ჩავრთავთ წრედს, ნათურა არ უნდა აინთოს;
    თუ ცოციას თანდათან გადავაადგილებთ მეორე განაპირა მხარეს, ტრანზისტორის ბაზა–ემიტერზე უნდა გაიზარდოს ძაბვა და ცოციას გარკვეული პოზიციიდან ნათურამ უნდა დაიწყოს ანთება და ნათების მომატება;
    თუ ცოციას დავაყენებთ მეორე განაპირა მხარეს, ნათურა უნდა აინთოს მაქსიმალურად;
    თუ ცოციას თანდათან გადავაადგილებთ ისევ პირველ განაპირა მხარეს, ტრანზისტორის ბაზა–ემიტერზე ძაბვა უნდა შემცირდეს, გარკვეული პოზიციიდან ნათურამ უნდა დაიწყოს ნათების მოკლება და მალევე ჩაქრეს;

    ცოციას მიერ ნათურის ანთების და ჩაქრობის პოზიციები უნდა იყოს ერთმანეთთან რაც შეიძლება ახლოს; ცოციას გადაადგილებისას ნათურა რაც შეიძლება ძლიერად უნდა ინთებოდეს ან ქრებოდეს.

    ცოციას ერთი მიმართულებით გადაადგილებისას ტრანზისტორის ბაზა–ემიტერზე ძაბვა უნდა გაიზარდოს და ნათურა აინთოს, მეორე მიმართულებით გადაადგილებისას კი ძაბვა შემცირდეს და ნათურა ჩაქრეს. მთავარი პირობაა: ტრანზისტორზე ძაბვის ზრდა უნდა იწვევდეს ნათების მატებას, შემცირება კი — კლებას.
  hint: |-
    რადგან ნათურა უნდა აინთოს მაქსიმალურად სწრაფად, გამოიყენეთ კოლექტორული ჩართვა;
    ცვალებადი რეზისტორი გამოიყენეთ როგორც კვების ძაბვის გამყოფი; ცვალებადი რეზისტორის ცოცია მიაერთეთ ტრანზისტორის ბაზაზე;
    ტრანზისტორის ბაზაში დენის შესაზღუდად გამოიყენეთ 1 kΩ რეზისტორი.
  questions: |-
    როგორ იცვლება ძაბვები ტრანზისტორის ბაზაზე და კოლექტორზე? როგორ აფასებთ ძაბვებს თითოეულ წერტილში?
    გამოიყენეთ დამატებითი რეზისტორები და წრედი შეცვალეთ ისე, რომ ნათურა ანთდეს, როდესაც ცოცია იქნება ცენტრში;
    როგორ შეიცვლება წრედის მუშაობის პრინციპი თუ ცვალებადი რეზისტორის პარალელურად (დაბოლოებებს შორის) ჩავრთავთ წითელ შუქდიოდს?
  methodology: "ეს და მომდევნო რამდენიმე სავარჯიშო გათვლილია უკუკავშირის შესასწავლ\
    ად. ამ ამოცანით უნდა ნახონ, ბაზაზე ძაბვის ცვლილების შედეგად როგორ იცვლება ძაბვ\
    ა კოლექტორზე; ბაზაზე მოდებული ძაბვის შეფასება შეუძლიათ ცოციას მდებარეობით, ხოლ\
    ო კოლექტორის ძაბვის შეფასება — ნათურის ნათების სიძლიერით. ამ სავარჯიშოში ბაზაზ\
    ე ძაბვის ზრდა იწვევს კოლექტორის ძაბვის შემცირებას."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ნათურა ჩამქრალია
      switchStates:
        switch: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      potPositions:
        variable_resistor: 0.0
    - label: switch_on_pot_off
      labelKa: "ჩამრთველი ჩართულია, ცოცია ნაპირზე — ნათურა ჩამქრალია"
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.01
      potPositions:
        variable_resistor: 0.0
    - label: switch_on_pot_mid_on
      labelKa: ცოცია შუა ზონაში — ნათურა უკვე ძლიერად ანთია
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
      potPositions:
        variable_resistor: 0.5
    - label: switch_on_pot_max
      labelKa: ცოცია ბოლოში — ნათურა მაქსიმალურად ანთია
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
      - role: lamp
        metric: current_vs_prior
        op: lt
        value: 1.4
      potPositions:
        variable_resistor: 1.0
- code: TFB.L1.2
  title: ნათურის სინქრონული ანთება ცვალებადი რეზისტორით II
  displayOrder: 2
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN და PNP ტრანზისტორი, ნათურა, ცვალებადი რეზისტორი, ორი მუდმივი 1 kΩ რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    ცოცია დააყენეთ ცვალებადი რეზისტორის განაპირა მხარეს; თუ ჩავრთავთ წრედს, ნათურა არ უნდა აინთოს;
    თუ ცოციას თანდათან გადავაადგილებთ მეორე განაპირა მხარეს, NPN ტრანზისტორის ბაზა–ემიტერზე უნდა გაიზარდოს ძაბვა და ცოციას გარკვეული პოზიციიდან ნათურამ უნდა დაიწყოს ანთება და ნათების მომატება;
    თუ ცოციას დავაყენებთ მეორე განაპირა მხარეს, ნათურა უნდა აინთოს მაქსიმალურად;
    თუ ცოციას თანდათან გადავაადგილებთ ისევ პირველ განაპირა მხარეს, NPN ტრანზისტორის ბაზა–ემიტერზე ძაბვა უნდა შემცირდეს, გარკვეული პოზიციიდან ნათურამ უნდა დაიწყოს ნათების მოკლება და მალევე ჩაქრეს;

    ცოციას მიერ ნათურის ანთების და ჩაქრობის პოზიციები უნდა იყოს ერთმანეთთან რაც შეიძლება ახლოს; ცოციას გადაადგილებისას ნათურა რაც შეიძლება ძლიერად უნდა ინთებოდეს ან ქრებოდეს.

    ეს არის წინა სავარჯიშოს მსგავსი ამოცანა, მხოლოდ იმ განსხვავებით, რომ NPN დარლინგტონის წყვილის ნაცვლად უნდა გამოიყენოთ NPN და PNP ტრანზისტორები; აქაც შეეცადეთ, რომ ცოციას გადაადგილებისას ნათურა რაც შეიძლება მყისიერად ინთებოდეს ან ქრებოდეს.
  hint: |-
    გამოიყენეთ წინა ამოცანის გამოცდილება; ნათურისთვის გამოიყენეთ კოლექტორული ჩართვა;
    ცვალებადი რეზისტორი გამოიყენეთ როგორც კვების ძაბვის გამყოფი; ცვალებადი რეზისტორის ცოცია მიაერთეთ NPN ტრანზისტორის ბაზაზე;
    NPN ტრანზისტორის ბაზაში დენის შესაზღუდად გამოიყენეთ 1 kΩ რეზისტორი.
  questions: |-
    შეადარეთ, როგორ იცვლება ძაბვები NPN ტრანზისტორის ბაზაზე და PNP ტრანზისტორის კოლექტორზე;
    გადააკეთეთ წრედი ისე, რომ ნათურა ჩართული იყოს NPN ტრანზისტორის კოლექტორზე.
  methodology: "წინა სავარჯიშოს მსგავსად ამ ამოცანის მიზანია შემავალი და გამომავალ\
    ი ძაბვების ურთიერთდამოკიდებულების შეფასება; წინასგან განსხვავებით, ამ სავარჯიშ\
    ოში ბაზაზე ძაბვის ზრდა იწვევს კოლექტორზეც ძაბვის ზრდას. ეს გარემოება გვაძლევს\
    \ საშუალებას, რომ მომდევნო ამოცანებში გამოვიყენოთ დადებითი უკუკავშირი და მისი\
    \ თვისებები."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ნათურა ჩამქრალია
      switchStates:
        switch: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      potPositions:
        variable_resistor: 0.0
    - label: switch_on_pot_off
      labelKa: "ჩამრთველი ჩართულია, ცოცია ნაპირზე — ნათურა ჩამქრალია"
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.01
      potPositions:
        variable_resistor: 0.0
    - label: switch_on_pot_mid_on
      labelKa: ცოცია შუა ზონაში — ნათურა უკვე ძლიერად ანთია
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
      potPositions:
        variable_resistor: 0.5
    - label: switch_on_pot_max
      labelKa: ცოცია ბოლოში — ნათურა მაქსიმალურად ანთია
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
      - role: lamp
        metric: current_vs_prior
        op: lt
        value: 1.4
      potPositions:
        variable_resistor: 1.0
- code: TFB.L2.5
  title: ნათურის ასინქრონული ანთება ცვალებადი რეზისტორით I
  displayOrder: 5
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ორი ცალი NPN ტრანსზისტორი, ნათურა, ცვალებადი რეზისტორი, ორი მუდმივი 1 kΩ რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    ცოცია დააყენეთ ცვალებადი რეზისტორის განაპირა მხარეს; თუ ჩავრთავთ წრედს, ნათურა უნდა აინთოს;
    თუ ცოციას გადავაადგილებთ მეორე განაპირა მხარეს, ერთი ტრანზისტორის ბაზა–ემიტერზე უნდა გაიზარდოს ძაბვა და ცოციას გარკვეულ პოზიციაზე ნათურა უნდა ჩაქრეს მყისიერად;
    თუ ცოციას გადავაადგილებთ პირველ განაპირა მხარეს, ტრანზისტორის ბაზა–ემიტერზე ძაბვა უნდა შემცირდეს და გარკვეული პოზიციიდან ნათურამ უნდა აინთოს მყისიერად;

    ცოციას ძალიან ნელი გადაადგილებითაც კი ნათურის არასრული ანთება შეუძლებელი უნდა იყოს — ნათურა ან სრულად უნდა აინთოს, ან სრულად უნდა ჩაქრეს.

    ეს არის „სინქრონული ნათურის ანთების“ შებრუნებული ამოცანა: ცოციას ერთი მიმართულებით გადაადგილებისას შემავალი ტრანზისტორის ბაზა–ემიტერზე ძაბვის გაზრდა უნდა იწვევდეს ნათურის მყისიერ ჩაქრობას, მეორე მიმართულებით კი ძაბვის შემცირება — ნათურის მყისიერ ანთებას. ნათურისთვის გამოიყენეთ კოლექტორული ჩართვა.
  hint: |-
    პირობის თანახმად ნათურისთვის უნდა გამოიყენოთ კოლექტორული ჩართვა;
    შემავალი ტრანზისტორი ისე ჩართეთ წრედში, რომ მისი გახსნა იწვევდეს ნათურის ტრანზისტორის დაკეტვას;
    შემავალი ტრანზისტორი ჩართეთ მეორე ტრანზისტორის ბაზა–ემიტერის პარალელურად.
  questions: |-
    რატომ ხდება ნათურის მყისიერი ანთება და ჩაქრობა როდესაც არ არის გამოყენებული უკუკავშირის რეზისტორი?
    გამოიყენეთ პარალელურად ჩართული წითელი და მწვანე შუქდიოდები და წრედი შეცვალეთ ისე, რომ თუ ნათურა ანთებულია ენთოს მწვანე შუქდიოდი, ხოლო თუ ჩამქრალია — წითელი.
  methodology: "წინა სავარჯიშოებისგან განსხვავებით ამ ამოცანაში ბაზა–ემიტერზე ძაბვ\
    ის მატება და ნათურის ანთება ერთმანეთის საპირისპიროდ ხდება, შესაბამისად ტრანზის\
    ტორები განსხვავებულად უნდა ჩართონ ერთმანეთთან. ამ სავარჯიშოში საკმაოდ მნიშვნელ\
    ოვანია პირველი შეკითხვის კარგად განხილვა. მიღებულ წრედში მცირე დადებითი უკუკავ\
    შირი ავტომატურად მყარდება, რადგან ნათურის ანთება იწვევს კვების ძაბვის ოდნავ შე\
    მცირებას, რაც თავისთავად იწვევს შემავალი ტრანზისტორის ოდნავ დაკეტვას და შედეგა\
    დ ნათურის ტრანზისტორი კიდევ უფრო კარგად გახსნას. სასურველია, თუ ამ პროცესის და\
    მოუკიდებლად მიხვდებიან და ახსნიან."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ნათურა ჩამქრალია
      switchStates:
        switch: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
      potPositions:
        variable_resistor: 0.0
    - label: switch_on_pot_on
      labelKa: "ჩამრთველი ჩართულია, ცოცია ნაპირზე — ნათურა ანთია"
      switchStates:
        switch: closed
