- code: DTR.L2.12
  title: ნათურის შეყოვნებით ანთება II
  displayOrder: 12
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN დარლინგტონის წყვილი, ნათურა, ღილაკი, მხოლოდ ერთი 100 µF კონდენსატორი, მხოლოდ ორი 100 kΩ რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ნათურა არ უნდა აინთოს;
    თუ ღილაკს დავაწვებით, ნათურა უნდა აინთოს მხოლოდ 2–3 წამის შემდეგ;
    თუ ღილაკს ავუშვებთ, ნათურა უნდა დარჩეს ანთებული გარკვეული პერიოდი და შემდეგ თანდათან ჩაქრეს.

    ღილაკზე დაჭერით ნათურა უნდა ინთებოდეს მცირე შეყოვნებით და აშვების შემდეგ დარჩეს ანთებული გარკვეული პერიოდით.
  hint: |-
    ნათურისთვის გამოიყენეთ კოლექტორული ჩართვა;
    კონდენსატორი დაამუხტეთ 100 kΩ რეზისტორის გავლით, რადგან ნათურა შეყოვნებით უნდა აინთოს;
    კონდენსატორი განმუხტეთ ბაზა–ემიტერის და 100 kΩ რეზისტორის გავლით, რადგან ნათურა გარკვეული პერიოდი უნდა ანთდეს.
  questions: |-
    როგორ შეიცვლება წრედის მუშაობის პრინციპი თუ 100 kΩ რეზისტორს ჩავანაცვლებთ 10 kΩ რეზისტორით — ჯერ მხოლოდ ერთს და შემდეგ მხოლოდ მეორეს?
    როგორ შეიცვლება წრედის მუშაობის პრინციპი თუ ერთი 100 kΩ რეზისტორის პარალელურად ჩავრთავთ მეორე 100 µF კონდენსატორს?
    როგორ შეიცვლება წრედის მუშაობის პრინციპი თუ მეორე 100 kΩ რეზისტორის პარალელურად ჩავრთავთ მეორე 100 µF კონდენსატორს?
  methodology: "წინა სავარჯიშოების გათვალისწინებით საკმაოდ მარტივი ამოცანაა; რეზის\
    ტორების გამოყოფა შეზღუდულია, რაც წრედის აწყობის ვარიანტებს კიდევ უფრო ამცირებს\
    . ამ სავარჯიშოში მიღებული შედეგი დაეხმარება შემდეგი ამოცანების ამოხსნას. დასმუ\
    ლი შეკითხვები საკმაოდ რთულია და სანამ პრაქტიკაში გადაამოწმებენ, სტუდენტებმა უნ\
    და ახსნან წრედის მუშაობის პრინციპის ცვლილება."
  validation:
    cases:
