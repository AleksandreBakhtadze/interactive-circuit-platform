chapter: DTR
problems:
- code: DTR.L2.4
  title: ღილაკით ძრავის 10 წამიანი დატრიალება
  displayOrder: 4
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN დარლინგტონის წყვილი, ძრავი, ღილაკი, 1 µF კონდენსატორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ძრავი არ უნდა დატრიალდეს;
    თუ ღილაკზე დავაწვებით, ძრავი უნდა დატრიალდეს;
    თუ ღილაკს ავუშვებთ, ძრავი უნდა ბრუნავდეს 10 წამი მაინც და თანდათან გაჩერდეს.

    ღილაკზე დაჭერით ძრავი უნდა დატრიალდეს და აშვების შემდეგ მინიმუმ 10 წამი უნდა იტრიალოს, შემდეგ გაჩერდეს.
  hint: |-
    რადგან კონდენსატორი არის დაბალი ტევადობის, მისი განმუხტვა უნდა მოხდეს რაც შეიძლება დიდი დენით;
    გამოიყენეთ ემიტერული ჩართვა, რაც ძალიან შეამცირებს ბაზაში გამავალი დენის ნაკადს.
  questions: |-
    როგორ შეიცვლება წრედის მუშაობის პრინციპი, თუ არსებულ კონდენსატორს პარალელურად ჩავრთავთ მეორე ასეთივე კონდენსატორს?
    როგორ შეიცვლება წრედის მუშაობის პრინციპი, თუ ღილაკის პარალელურად ჩავრთავთ გამოყენებული კონდენსატორის მსგავს მეორე კონდენსატორს? ახსენით რატომ.
  methodology: |-
    ამ სავარჯიშოში რეზისტორების გამოყენება არ შეუძლიათ, რაც გარკვეულ მინიმიზაციას შეუძლია გამოადგეს ემიტერული ჩართვისთვის.
    ჩართვამდე აუცილებლად წრედი კარგად შეამოწმონ, რადგან არასწორი ჩართვით შეიძლება ტრანზისტორის გადატვირთვა გამოიწვიონ. ამოცანაში მთავარია მიხვდნენ, რომ ძრავისთვის გამოიყენონ ემიტერული ჩართვა.
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ძრავი არ ტრიალებს
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_button_open
      labelKa: ჩამრთველი ჩართულია — ძრავი არ ტრიალებს
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.001
    - label: button_pressed_spins
      labelKa: ღილაკი დაჭერილია — ძრავი ტრიალებს
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.08
    - label: release_hold_10s_then_stop
      labelKa: ღილაკის გაშვების შემდეგ ძრავი ≥10 წმ ტრიალებს და ჩერდება
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: motor_1
        metric: tran_current_abs_start
        op: gt
        value: 0.05
      - role: motor_1
        metric: tran_current_abs_at_10
        op: gt
        value: 0.015
      - role: motor_1
        metric: tran_current_abs_end
        op: lt
        value: 0.005
      simPhase: discharge
- code: DTR.L2.5
  title: ღილაკით ძრავის 10 წამიანი სწრაფი დატრიალება
  displayOrder: 5
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN დარლინგტონის წყვილი, ძრავი, ღილაკი, 10 µF კონდენსატორი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ძრავი უნდა დატრიალდეს ძალიან ნელა;
    თუ ღილაკზე დავაწვებით, ძრავი უნდა დატრიალდეს სწრაფად;
    თუ ღილაკს ავუშვებთ, სიჩქარე თანდათან უნდა შემცირდეს 10 წამის განმავლობაში და შემდეგ გააგრძელოს ძალიან ნელა ბრუნვა.

    ღილაკზე დაჭერით ძრავი უნდა დატრიალდეს სწრაფად და აშვების შემდეგ მინიმუმ 10 წამი უნდა მცირდებოდეს მისი ბრუნი, შემდეგ კი გააგრძელოს ძალიან ნელი ტრიალი.
  hint: |-
    კოლექტორული ჩართვა: ძრავი VCC→კოლექტორი, ემიტერი→GND.
    მაღალი წინაღობის რეზისტორი (510 kΩ) რელსიდან ბაზაზე — ნელი ბრუნვა ჩამრთველის ჩართვისას;
    ღილაკი + 10 µF + 10 kΩ ბაზაზე — სწრაფი ბრუნვა დაჭერისას; აშვებისას კონდენსატორი ნელა ცარიელდება (~10 წმ) და რჩება ნელი ბრუნვა.
  questions: |-
    შეიცვლება თუ არა ძრავის ნელი ბრუნვის სიჩქარე, თუ კონდენსატორის ტევადობას გავაორმაგებთ?
    წრედი შეცვალეთ ისე, რომ ღილაკზე დაჭერის შემდეგ ძრავის ბრუნი თანდათან (რამდენიმე წამის განმავლობაში) იზრდებოდეს და არა მყისიერად.
  methodology: "ეს არის წინა სავარჯიშოს გაგრძელება. ამ ამოცანაში ორი ძირითადი საკი\
    თხია მოსაფიქრებელი — პირველი, უნდა მიხვდნენ, რომ მაღალი წინაღობით ტრანზისტორი\
    \ გახსნან ისე, რომ ძრავი ნელა ბრუნავდეს; მეორე, კონდენსატორის მუხტი მაქსიმალურ\
    ად დიდი ხნით შეინარჩუნონ ბაზის წრედში."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ძრავი გაჩერებულია
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_slow
      labelKa: ჩამრთველი ჩართულია — ძრავი ძალიან ნელა ტრიალებს
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.008
      - role: motor_1
        metric: current
        op: lt
        value: 0.08
    - label: button_pressed_fast
      labelKa: ღილაკი დაჭერილია — ძრავი სწრაფად ტრიალებს
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.15
    - label: release_then_slow
      labelKa: აშვების შემდეგ სიჩქარე იკლებს და ნელა რჩება
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: motor_1
        metric: tran_current_abs_start
        op: gt
        value: 0.15
      - role: motor_1
        metric: tran_current_abs_end
        op: gt
        value: 0.008
      - role: motor_1
        metric: tran_current_abs_end
        op: lt
        value: 0.08
      simPhase: discharge
- code: DTR.L2.6
  title: ღილაკით ძრავის 20 წამიანი დატრიალება
  displayOrder: 6
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN დარლინგტონის წყვილი, ძრავი, ღილაკი, 10 µF კონდენსატორი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ძრავი არ უნდა დატრიალდეს;
    თუ ღილაკზე დავაწვებით, ძრავი უნდა დატრიალდეს სწრაფად;
    თუ ღილაკს ავუშვებთ, ძრავმა 15–20 წამით მაინც უნდა შეინარჩუნოს სწრაფი ბრუნი და შემდეგ მალე გაჩერდეს.

    ღილაკზე დაჭერით ძრავი უნდა დატრიალდეს სწრაფად და აშვების შემდეგ მინიმუმ 15–20 წამი შეინარჩუნოს სწრაფი ბრუნი; შემდეგ, წინა ამოცანებისგან განსხვავებით, ბევრად უფრო სწრაფად გაჩერდეს.
  hint: |-
    რადგან ძრავის ბრუნი არ უნდა იცვლებოდეს თანდათანობით, გამოიყენეთ კოლექტორული ჩართვა;
    კოლექტორულ ჩართვაში ბაზა–ემიტერი კარგი გამტარია, ამიტომ ბაზის დენის შესაზღუდად გამოიყენეთ მაქსიმალურად დიდი წინაღობა (ორი 510 kΩ ერთად ≈ 1 MΩ) — ეს აფერხებს კონდენსატორის სწრაფ განმუხტვას.
  questions: |-
    უხეშად შეაფასეთ, რა ენერგიას გასცემს კონდენსატორი ღილაკის აშვებიდან ძრავის გაჩერებამდე?
    უხეშად შეაფასეთ, რა ენერგიას გასცემს ძრავი ღილაკის აშვებიდან მის გაჩერებამდე? შეადარეთ წინა გამოთვლას.
  methodology: "წინა სავარჯიშოების შემდეგ მთავარია მიხვდნენ კოლექტორული ჩართვის და\
    \ ორივე 510 kΩ წინაღობის ერთდროულად გამოყენების აუცილებლობას; დარლინგტონს იმდე\
    ნად მაღალი გაძლიერება აქვს, რომ 1 MΩ-შიც კი გამავალი დენი საკმარისია ძრავის და\
    სატრიალებლად, ხოლო 1 MΩ აფერხებს კონდენსატორის სწრაფ განმუხტვას."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ძრავი გაჩერებულია
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_off
      labelKa: ჩამრთველი ჩართულია — ძრავი არ ტრიალებს
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.001
    - label: button_pressed_fast
      labelKa: ღილაკი დაჭერილია — ძრავი სწრაფად ტრიალებს
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.15
    - label: release_hold_15s_then_stop
      labelKa: "აშვების შემდეგ ≥15 წმ სწრაფი ბრუნი, შემდეგ სწრაფად ჩერდება"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: motor_1
        metric: tran_current_abs_start
        op: gt
        value: 0.15
      - role: motor_1
        metric: tran_current_abs_at_15
        op: gt
        value: 0.1
      - role: motor_1
        metric: tran_current_abs_end
        op: lt
        value: 0.05
      simPhase: discharge
- code: DTR.L2.11
  title: ნათურის შეყოვნებით ანთება I
  displayOrder: 11
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN დარლინგტონის წყვილი, ნათურა, ღილაკი, მხოლოდ ერთი 100 µF კონდენსატორი, მხოლოდ ორი 100 kΩ რეზისტორი, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ნათურა უნდა აინთოს;
    თუ ღილაკს დავაწვებით, ნათურა უნდა ჩაქრეს მყისიერად და დარჩეს გათიშული;
    თუ ღილაკს ავუშვებთ, ნათურა უნდა აინთოს მხოლოდ 2–3 წამის შემდეგ.

    ღილაკზე დაჭერით ნათურა უნდა ქრებოდეს მყისიერად და აშვების შემდეგ უნდა აინთოს მხოლოდ 2–3 წამის დაყოვნებით.
  hint: |-
    რადგან ნათურა უნდა აინთოს ერთბაშად, სასურველია გამოიყენოთ კოლექტორული ჩართვა;
    ანთების შეყოვნება შექმენით კონდენსატორის დამუხტვის პროცესით — ტრანზისტორი დახურულია, სანამ კონდენსატორი არ დაიმუხტება გარკვეულ ძაბვამდე;
    კონდენსატორი და ღილაკი ჩართეთ ბაზა–ემიტერის პარალელურად და შეყოვნების გასაზრდელად კონდენსატორი დაამუხტეთ 100 kΩ რეზისტორის გავლით (ორი 100 kΩ).
  questions: |-
    დაახლოებით რა დრო დასჭირდება კონდენსატორის დამუხტვას ღილაკის აშვების შემდეგ?
    გამოიყენეთ დამატებითი რეზისტორები და შეყოვნების დრო გაასამმაგეთ;
    მხოლოდ უკვე გამოყოფილი დეტალებით წრედი გადააკეთეთ ისე, რომ ღილაკზე დაჭერისას ნათურა ჩაქრეს მყისიერად და თითის აუღებლად აინთოს 2–3 წამის დაგვიანებით.
  methodology: სავარჯიშოს მიზანია კარგად გაიაზრონ პირობის ლოგიკა და წრედში სწორი პოზიცია
    მოუძებნონ კონდენსატორსა და ღილაკს; მესამე შეკითხვა პირობას ცვლის და შესაბამისად
    დეტალების განლაგებაც უნდა შეიცვალოს.
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ნათურა ჩამქრალია
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_lamp_on
      labelKa: ჩამრთველი ჩართულია — ნათურა ანთია
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
    - label: button_pressed_off
      labelKa: ღილაკი დაჭერილია — ნათურა მყისიერად ჩაქრა
      switchStates:
        switch: closed
