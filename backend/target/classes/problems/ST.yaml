chapter: ST
problems:
- code: ST.L1.1
  title: ნათურის ანთება ღილაკით
  displayOrder: 1
  difficulty: beginner
  validation:
    cases:
    - label: button_pressed
      labelKa: ღილაკი დაჭერილი
      switchStates:
        button_1: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.01
    - label: button_released
      labelKa: ღილაკი არ არის დაჭერილი
      switchStates:
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
- code: ST.L1.2
  title: ნათურის ანთება ღილაკით და ორი კვების წყაროთი
  displayOrder: 2
  difficulty: beginner
  description: "გამოიყენეთ მხოლოდ შემდეგი დეტალები: ღილაკი, ნათურა, ორი კვების წყა\
    რო და გამტარები. ააწყვეთ წრედი, რომელიც იმუშავებს ასე: თუ ღილაკს დავაწვებით, ნ\
    ათურა უნდა აინთოს; თუ ღილაკს ავუშვებთ, ნათურა უნდა ჩაქრეს. ეს არის წინა სავარჯ\
    იშოს მსგავსი ამოცანა იმ განსხავავებით, რომ ერთი კვების წყაროს ნაცვლად უნდა გამ\
    ოიყენოთ ორი. წრედის აწყობის შემდეგ, აღწერეთ რა შეიცვალა წინა ამოცანასთან შედარ\
    ებით და რამ გამოიწვია ეს ცვლილება?"
  hint: ერთი კვების წყაროს დადებითი პოლუსი მიაერთეთ მეორე კვების წყაროს უარყოფით პოლუსს.
    ნათურის ასანთებად გამოიყენეთ დარჩენილი თავისუფალი პოლუსები.
  questions: |-
    როგორ იმუშავებს წრედი თუ ნათურას ჩავრთავთ კვების წყაროებს შორის?
    როგორ იმუშავებს წრედი თუ კვებების მერთების თანამიმდევრობას შევცვლით — ერთი კვების დადებით პოლუსს მივაერთებთ მეორე კვების დადებითს? ახსენით რატომ?
  methodology: "ამ სავარჯიშოში პირველად უნდა გამოიყენონ მიმდევრობით ჩართული ორი კვ\
    ების წყარო. ნათურის ნათების მომატებით პრაქტიკულად უნდა ნახონ, რომ ორი კვების წ\
    ყაროს ძაბვა იკრიბება და ჯამური ძაბვა იზრდება."
  validation:
    cases:
    - label: button_pressed
      labelKa: ღილაკი დაჭერილი
      switchStates:
        button_1: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.01
    - label: button_released
      labelKa: ღილაკი არ არის დაჭერილი
      switchStates:
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
- code: ST.L1.3
  title: ნათურის ანთება ღილაკით და ჩამრთველით
  displayOrder: 3
  difficulty: beginner
  description: "გამოიყენეთ მხოლოდ შემდეგი დეტალები: ღილაკი, ნათურა, ჩამრთველი, ერთ\
    ი კვების წყარო და გამტარები. ააწყვეთ წრედი, რომელიც იმუშავებს ასე: წრედის აწყო\
    ბის შემდეგ, თუ მხოლოდ ჩამრთველით ჩართავთ წრედს (ღილაკის გარეშე), ნათურა არ უნდ\
    ა აინთოს; თუ ღილაკს დავაწვებით, ნათურა უნდა აინთოს; თუ ღილაკს ავუშვებთ, ნათურა\
    \ უნდა ჩაქრეს. ამოცანაში დამატებით უნდა გამოიყენოთ ჩამრთველი — აწყობის პროცესშ\
    ი ის გამორთული უნდა იყოს; დარწმუნდების შემდეგ, რომ წრედი სწორად არის აწყობილი\
    , შეგიძლიათ ჩართოთ."
  hint: წრედში დენმა უნდა გაიაროს ჩამრთველის გავლით. ჩამრთველი ჩართეთ ღილაკამდე (საშუალო
    თავაური — კვების დადებითი პოლუსის მხრიდან).
  questions: |-
    შეიცვლება თუ არა წრედის სამუშაო პრინციპი თუ ღილაკს და ჩამრთველს გავუცვლით ადგილები?
    შეიცვლება თუ არა წრედის სამუშაო პრინციპი თუ ბუნებრივად შემოვატრიალებთ?
  methodology: ამ სავარჯიოiათი უნდა გაეცნონ ჩამრთველის პრაქტიკულ გამოყენებას. წრედის
    აწყობის დროს ჩამრთველი გამორთული უნდა იყოს; სასურველია მიერთოთ კვების დადებით
    პოლუსთან და ჩართოთ მხოლოდ აწყობის დასრულებისა და შემოწმების შემდეგ.
  validation:
    cases:
    - label: switch_off_button_open
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_off_button_pressed
      labelKa: "ჩამრთველი გამორთული, ღილაკი დაჭერილი"
      switchStates:
        switch: open
        button_1: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_button_open
      labelKa: "ჩამრთველი ჩართული, ღილაკი არ არის დაჭერილი"
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_button_pressed
      labelKa: "ჩამრთველი ჩართული, ღილაკი დაჭერილი"
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.01
- code: ST.L2.4
  title: ნათურის ანთება ორი ღილაკით
  displayOrder: 4
  difficulty: beginner
  description: "გამოიყენეთ მხოლოდ შემდეგი დეტალები: ორი ღილაკი, ნათურა, ჩამრთველი\
    , ორი კვების წყარო და გამტარები. ააწყვეთ წრედი, რომელიც იმუშავებს ასე: წრედის\
    \ აწყობის შემდეგ, თუ ჩამრთველით ჩართავთ წრედს, ნათურა არ უნდა აინთოს; ნათურა უ\
    ნდა აინთოს მხოლოდ მაშინ, როდესაც ერთდროულად დავაჭერით ორივე ღილაკს; თუ დავაჭერ\
    ით მხოლოდ ერთ ღილაკს, ნათურა არ უნდა აინთოს."
  hint: "ღილაკები ერთმანეთის მიმართ ჩართეთ ისე, რომ მათში დენის ნაკადმა გაიაროს მხ\
    ოლოდ მაშინ, როდესაც ორივე მათგანს დავაჭერით. ჩამრთველი, ღილაკები და ნათურა ჩარ\
    თეთ მიმდევრობით."
  questions: |-
    ნათურა რომ მოვათავსოთ ღილაკებს შორის, შეიცვლება თუ არა წრედის მუშაობის პრინციპი?
    ჩამრთველი რომ მოვათავსოთ კვების წყაროებს შორის, შეიცვლება თუ არა წრედის მუშაობის პრინციპი?
  methodology: "ეს სავარჯიშო უფრო ლოგიკური ამოცანაა: უნდა მიხვდეთ, რომ წრედი იკვრე\
    ბა მხოლოდ მაშინ, როდესაც ორივე ღილაკია ჩართული. განიხილეთ შემთხვევა, როდესაც ჩ\
    ამრთველია ჩართული კვებებს შორის — ასე წრედი უფრო კომპაქტური გამოდის."
  validation:
    cases:
    - label: switch_off_both_open
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
        button_1: open
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_both_open
      labelKa: "ჩამრთველი ჩართული, ღილაკები არ არის დაჭერილი"
      switchStates:
        switch: closed
        button_1: open
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_button1_only
      labelKa: ჩართულია მხოლოდ პირველი ღილაკი
      switchStates:
        switch: closed
        button_1: closed
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_button2_only
      labelKa: ჩართულია მხოლოდ მეორე ღილაკი
      switchStates:
        switch: closed
        button_1: open
        button_2: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_both_pressed
      labelKa: "ჩამრთველი ჩართული, ორივე ღილაკი დაჭერილი"
      switchStates:
        switch: closed
        button_1: closed
        button_2: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.01
- code: ST.L1.5
  title: ნათურის ნათების შემცირება
  displayOrder: 5
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ნათურა, რეზისტორი, ჩამრთველი და ორი კვების წყარო.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ თუ ჩავრთავთ ჩამრთველს, ნათურა უნდა აინთოს;

    დააკვირდით როგორი სიმძლავრით ანათებს ნათურა. დამატებით გამოიყენეთ ერთი რეზისტორი და წრედი გადააკეთეთ ისე, რომ
    ჩართვის შემდეგ ნათურის ნათება იყოს უფრო მცირე — ანუ რეზისტორის გამოყენებით ნათურა უფრო სუსტად უნდა ანათებდეს.
  hint: "ორი კვების წყაროს (6V) შემთხვევაში ნათურა მოიხმარს დაახლოებით 0.25A დენს\
    . შეაფასეთ, რომელი რეზისტორით შეგიძლიათ მასში გამავალი დენის შემცირება ისე, რო\
    მ ნათურა ბოლომდე არ ჩაქრეს."
  questions: |-
    დამოკიდებულია თუ არა ნათურის ნათება იმაზე, თუ სად განვათავსებთ რეზისტორს — ნათურამდე თუ ნათურის შემდეგ?
    როგორ შეიცვლის ნათურის ნათება თუ რეზისტორს მიმდევრობით ჩავურთავთ კიდევ ერთ რეზისტორს?
    როგორ შეიცვლება ნათურის ნათება თუ რეზისტორს პარალელურად ჩავურთავთ კიდევ ერთ რეზისტორს?
  methodology: "სავარჯიშოს მიზანია რეზისტორის მუშაობის პრაქტიკული შემოწმება, რეზის\
    ტორების მიმდევრობითი და პარალელური ჩართვის შედეგების ნახვა. შეფასდეს, რომ ნათუ\
    რის შემთხვევაში დაახლოებით 100Ω-ზე მაღალი წინაღობის გამოყენებას ხშირად აზრი აღ\
    არ აქვს (ნათურა შეიძლება ძალიან დაბნელდეს)."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_dimmed
      labelKa: ჩამრთველი ჩართული (ნათება შემცირებულია)
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.01
      - role: lamp
        metric: current
        op: lt
        value: 0.2
- code: ST.L1.6
  title: კვების წყაროს მოკლე ჩართვის შემთხვევები
  displayOrder: 6
  difficulty: beginner
- code: ST.L1.7
  title: შუქდიოდის გამოყენების მაგალითები
  displayOrder: 7
  difficulty: beginner
- code: ST.L1.8
  title: წითელი შუქდიოდის ანთება ღილაკით
  displayOrder: 8
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ღილაკი, წითელი შუქდიოდი, რეზისტორი, ერთი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    წრედის აწყობის შემდეგ თუ ჩართავთ ჩამრთველს, შუქდიოდი არ უნდა აინთოს;
    თუ ღილაკს დავაჭერთ, შუქდიოდი უნდა აინთოს;
    თუ ღილაკს ავუშვებთ, შუქდიოდი უნდა ჩაქრეს.

    გაითვალისწინეთ: შუქდიოდს აქვს პოლარობა და არასწორი მიმართულებით ჩართვისას ის არ აინთება.
  hint: "გამოიყენეთ წინა ამოცანის გამოცდილება: ღილაკი, რეზისტორი და შუქდიოდი ჩართე\
    თ მიმდევრობით. დარწმუნდით, რომ შუქდიოდი სწორ პოლარობით არის ჩართული."
  questions: |-
    როგორ იმუშავებს წრედი, თუ წითელ შუქდიოდს შევცვლით ჯერ მწვანით, შემდეგ ლურჯ შუქდიოდით?
