    NPN ტრანზისტორი, ნათურა, ღილაკი, რეზისტორები, ორი კვების წყარო და ჩამრთველი. არ გამოიყენოთ 1k-ზე ნაკლები რეზისტორი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ნათურა უნდა აინთოს;
    თუ ღილაკს დავაწვებით, ნათურის ნათებამ უნდა მოიმატოს;
    თუ ღილაკს ავუშვებთ, ნათურა უნდა დაბრუნდეს ძველ მდგომარეობაში.

    ღილაკზე დაჭერით ნათურის ნათება უნდა იზრდებოდეს; გამოიყენეთ რეზისტორები 1k ან მეტი.
  hint: |-
    გამოიყენეთ ტრანზისტორის კოლექტორული ჩართვა;
    თავიდან ტრანზისტორი გახსენით მხოლოდ ერთი რეზისტორის დენით — რეზისტორის გავლით დენი გაატარეთ ბაზა-ემიტერს შორის;
    ღილაკზე დაჭერით ტრანზისტორის ბაზაში გაატარეთ დამატებითი დენი დამატებითი რეზისტორის გავლით.
  questions: |-
    წრედი შეცვალეთ ისე, რომ ნათურა თავიდანვე ენთოს ძლიერად და ღილაკზე დაჭერით ნათება მოემატოს ცოტათი;
    წრედი შეცვალეთ ისე, რომ ნათურა თავიდან ენთოს სუსტად და ღილაკზე დაჭერით ნათება მოემატოს ძლიერად.
  methodology: "ამდაგვარი ამოცანა წინა თემებში უკვე შესრულებული აქვთ შუქდიოდებით დ\
    ა რეზისტორებით. ამ და მომდევნო სავარჯიშოში დაბალი წინაღობების გამოყენება პირობ\
    აში შეზღუდულია, შესაბამისად უნდა გამოიყენონ ტრანზისტორის გაძლიერების უნარი და\
    \ შედარებით მაღალი წინაღობებით შეცვალონ ნათურაში გამავალი დენი და მისი ნათების\
    \ ინტენსივობა."
  validation:
    cases:
    - label: switch_off
