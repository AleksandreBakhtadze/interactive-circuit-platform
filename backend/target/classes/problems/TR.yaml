chapter: TR
problems:
- code: TR.L2.9
  title: კოლექტორული და ემიტერული ჩართვის შედარება
  displayOrder: 9
  difficulty: beginner
  description: |-
    ააწყვეთ სურათზე მოცემული წრედი (ორი 3 ვ კვების წყარო, ჩამრთველი, ორი NPN ტრანზისტორი, ორი წითელი შუქდიოდი, ორი 10 kΩ ცვლადი რეზისტორი, ორი 100 Ω და ორი 1 kΩ რეზისტორი).

    ერთი შუქდიოდი კოლექტორულ ჩართვაშია, მეორე — ემიტერულში; თითოეულს საკუთარი ცვლადი რეზისტორი მართავს.

    გამოიყენეთ სიმულაცია და დააკვირდით:
    • ორივე ცოცია ყველაზე ქვედა წერტილში და ჩამრთველით წრედის ჩართვისას;
    • ორივე ცოცია შუა წერტილში;
    • ორივე ცოცია ყველაზე ზედა წერტილში;
    • ორივე ცოციას სინქრონულად ქვემოდან ზევით გადაადგილებისას.

    შემდეგ უპასუხეთ ქვემოთ მოცემულ ტესტის კითხვებს და დააჭირეთ შემოწმებას.
  hint: |-
    კოლექტორული ჩართვა: შუქდიოდი + 1 kΩ კოლექტორზე, ემიტერი მიწაზე.
    ემიტერული ჩართვა: კოლექტორი კვებაზე, შუქდიოდი + 1 kΩ ემიტერზე.
    თითოეულ ცვლად რეზისტორს ზემოდან დაამატეთ 100 Ω რეზისტორი; ცოცია მიაერთეთ ტრანზისტორის ბაზასთან (საჭიროებისას გამოიყენეთ მავთული).
  questions: |-
    1. რა მოხდება თუ ორივე ცოციას დავაყენებთ განაპირა, ყველაზე ქვედა წერტილში და ჩამრთველით ჩავრთავთ წრედს?
    ა. ორივე შუქდიოდი აინთება;
    ბ. მხოლოდ ემიტერულის აინთება;
    გ. მხოლოდ კოლექტორულის აინთება;
    დ. არც ერთი არ აინთება;

    2. რა მოხდება თუ ორივე ცოციას თანაბრად გადავაადგილებთ ცენტრში?
    ა. ემიტერული აინთება უფრო ძლიერად;
    ბ. კოლექტორული აინთება უფრო ძლიერად;
    გ. ორივე აინთება თანაბრად;
    დ. არც ერთი არ აინთება;

    3. რა მოხდება თუ ორივე ცოციას თანაბრად გადავაადგილებთ განაპირა, ყველაზე ზედა წერტილში?
    ა. ორივე შუქდიოდი აინთება ძლიერად;
    ბ. ემიტერული აინთება უფრო ძლიერად;
    გ. კოლექტორული აინთება უფრო ძლიერად;
    დ. ორივე შუქდიოდი აინთება სუსტად;

    4. როგორ შეიცვლება შუქდიოდების ნათება თუ ორივე ცოციას სინქრონულად გადავაადგილებთ ყველაზე ქვედა წერტილიდან ზევით?
    ა. შუქდიოდების ნათება მოიმატებს სინქრონულად თანაბრად;
    ბ. კოლექტორული ჩართვის შუქდიოდი უფრო მალე მიაღწევს მაქსიმალურ ნათებას;
    გ. ემიტერული ჩართვის შუქდიოდი უფრო მალე მიაღწევს მაქსიმალურ ნათებას;
    დ. შუქდიოდების ნათება მოიკლებს სინქრონულად თანაბრად;
  methodology: "ეს არის კარგი სავარჯიშო ტრანზისტორის მუშაობის რეჟიმების შესასწავლა\
    დ. პასუხების შემდეგ პრაქტიკულად უნდა შეამოწმონ და ვიზუალურადაც ნახონ, რა განსხ\
    ვავებაა ტრანზისტორის კოლექტორულ და ემიტერულ ჩართვებს შორის. საკმაოდ ხშირად ამო\
    ცანის პირობის დასაკმაყოფილებლად შეიძლება გამოიყენონ მაგ. ემიტერული ჩართვა, მაშ\
    ინ როცა უფრო კარგ შედეგს კოლექტორული ჩართვა იძლევა, ან პირიქით. ყოველთვის უნდა\
    \ დასვან კითხვა და გადაამოწმონ, ხომ არ იქნება უფრო ეფექტური ტრანზისტორის სხვა\
    \ რეჟიმში გამოყენება."
- code: TR.L2.10
  title: ძრავის მყისიერი დატრიალება ცვლადი რეზისტორით
  displayOrder: 10
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN ტრანზისტორი, ძრავი, ერთი ცვლადი რეზისტორი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    ცოცია დააყენეთ ცვლადი რეზისტორის განაპირა მხარეს;
    თუ ჩამრთველით ჩართავთ წრედს, ძრავი არ უნდა დატრიალდეს;
    თუ ცოციას ნელა გადავაადგილებთ რეზისტორის მეორე მხარეს, ძრავმა რაღაც ეტაპზე უნდა დაიწყოს ბრუნვა და ცოციას მცირე გადაადგილების შემდეგ მალევე უნდა მიაღწიოს მაქსიმალურ ბრუნვის სიჩქარეს;
    ცოციას ბოლომდე გადაადგილებით ძრავის ბრუნვის სიჩქარე უნდა დარჩეს მაქსიმალური;
    თუ ცოციას უკან დავაბრუნებთ, ანალოგიურად შებრუნებული თანამიმდევრობით ძრავის ბრუნმა რაღაც ეტაპზე ჯერ უნდა მოიკლოს და შემდეგ გაჩერდეს.

    ცვლადი რეზისტორის გადაადგილებით ძრავი უნდა ირთვებოდეს ისე, რომ ცოციას მცირე გადაადგილება საკმარისი იყოს ძრავის ბრუნვის დაწყებიდან მაქსიმალური სიჩქარის მიღწევამდე.
  hint: |-
    ცვლადი რეზისტორი გამოიყენეთ როგორც კვების ძაბვის გამყოფი და მისი გავლით მიიღეთ რეგულირებადი ძაბვა ნულიდან კვების ძაბვამდე.
    გამოიყენეთ ტრანზისტორის კოლექტორული ჩართვა, რადგან გვჭირდება ძრავის ერთბაშად ჩართვა.
  questions: |-
    როგორ იმუშავებს ნათურა ძრავის ნაცვლად?
    წრედი გადააკეთეთ ისე, რომ ძრავი ტრიალს იწყებდეს განაპირა პოზიციიდან, ცოციას გადაადგილების დაწყებისთანავე.
    ცვლად რეზისტორზე მოძებნეთ ცოციას ის მდებარეობა, რომლის შემდეგაც ძრავის ბრუნვის სიჩქარე აღარ იზრდება.
  methodology: "ეს და მომდევნო სავარჯიშო გათვლილია კოლექტორული და ემიტერული ჩართვე\
    ბის შესასწავლად. კარგი იქნება, თუ ორივე ამოცანაში ძრავს ჩაანაცვლებენ ნათურით დ\
    ა დააკვირდებიან მისი ნათების ცვლილებასაც."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ძრავი გაჩერებულია
      switchStates:
        switch: open
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.001
      potPositions:
        variable_resistor: 0.0
    - label: switch_on_pot_off
      labelKa: "ჩამრთველი ჩართულია, ცოცია ნაპირზე — ძრავი გაჩერებულია"
      switchStates:
        switch: closed
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.01
      potPositions:
        variable_resistor: 0.0
    - label: switch_on_pot_mid_saturated
      labelKa: ცოცია შუა ზონაში — ძრავი უკვე თითქმის მაქსიმუმზეა
      switchStates:
        switch: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.08
      potPositions:
        variable_resistor: 0.5
    - label: switch_on_pot_max
      labelKa: ცოცია ბოლოში — სიჩქარე რჩება მაქსიმალური
      switchStates:
        switch: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.1
      - role: motor_1
        metric: current_vs_prior
        op: lt
        value: 1.4
      potPositions:
        variable_resistor: 1.0
- code: TR.L2.11
  title: ძრავის თანდათანობით დატრიალება ცვლადი რეზისტორით
  displayOrder: 11
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN ტრანზისტორი, ძრავი, ერთი ცვლადი რეზისტორი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    ცოცია დააყენეთ ცვლადი რეზისტორის განაპირა მხარეს;
    თუ ჩამრთველით ჩართავთ წრედს, ძრავი არ უნდა დატრიალდეს;
    თუ ცოციას ნელა გადავაადგილებთ რეზისტორის მეორე მხარეს, ძრავმა რაღაც ეტაპზე უნდა დაიწყოს ბრუნვა და ცოციას თანდათან გადაადგილებით მისი ბრუნვის სიჩქარეც თანდათან უნდა გაიზარდოს;
    ძრავმა ბრუნვის მაქსიმუმს უნდა მიაღწიოს მხოლოდ ცოციას ბოლომდე გადაადგილების დროს;
    თუ ცოციას უკან დავაბრუნებთ, ანალოგიურად შებრუნებული თანამიმდევრობით ძრავის ბრუნმა თანდათან უნდა დაიწყოს მოკლება და ბოლოს სრულად გაჩერდეს.

    ცვლადი რეზისტორის გადაადგილებით თანაბრად უნდა იცვლებოდეს ძრავის ბრუნვის სიჩქარე; ძრავმა ბრუნვის სიჩქარის მაქსიმუმს უნდა მიაღწიოს მხოლოდ ცოციას ბოლომდე გადაადგილების დროს.
  hint: |-
    ცვლადი რეზისტორი გამოიყენეთ როგორც კვების ძაბვის გამყოფი და მისი გავლით მიიღეთ რეგულირებადი ძაბვა ნულიდან კვების ძაბვამდე.
    გამოიყენეთ ტრანზისტორის ემიტერული ჩართვა, რადგან გვჭირდება ძრავის სიმძლავრის თანდათან მომატება.
  questions: |-
    როგორ იმუშავებს ნათურა ძრავის ნაცვლად?
    წრედი გადააკეთეთ ისე, რომ ძრავი ტრიალს იწყებდეს ცოციას გადაადგილების დაწყებისთანავე.
    ცვლად რეზისტორზე მოძებნეთ ცოციას ის მდებარეობა, რომლის შემდეგაც ძრავის ბრუნვის სიჩქარე აღარ იზრდება; შეადარეთ წინა ამოცანას.
  methodology: ეს სავარჯიშო გათვლილია ტრანზისტორის ემიტერული ჩართვის შესასწავლად.
    მიღებული შედეგი უნდა შეადარონ წინა ამოცანის შედეგს და ნახონ განსხვავებები.
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ძრავი გაჩერებულია
      switchStates:
        switch: open
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.001
      potPositions:
        variable_resistor: 0.0
    - label: switch_on_pot_off
      labelKa: "ჩამრთველი ჩართულია, ცოცია ნაპირზე — ძრავი გაჩერებულია"
      switchStates:
        switch: closed
      checks:
      - role: motor_1
        metric: current
        op: lt
        value: 0.01
      potPositions:
        variable_resistor: 0.0
    - label: switch_on_pot_mid_partial
      labelKa: "ცოცია შუაში — ძრავი უკვე ტრიალებს, მაგრამ ჯერ არა მაქსიმუმზე"
      switchStates:
        switch: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.02
      - role: motor_1
        metric: current
        op: lt
        value: 0.16
      potPositions:
        variable_resistor: 0.5
    - label: switch_on_pot_max
      labelKa: ცოცია ბოლოში — ძრავი მაქსიმალურ სიჩქარეზეა
      switchStates:
        switch: closed
      checks:
      - role: motor_1
        metric: current
        op: gt
        value: 0.08
      - role: motor_1
        metric: current_vs_prior
        op: gt
