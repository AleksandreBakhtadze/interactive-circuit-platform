      switchStates:
        motor_1: running
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
      - role: motor_1
        metric: current
        op: gt
        value: 5.0E-4
    - label: stalled_lamp_off
