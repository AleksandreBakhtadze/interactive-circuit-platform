    გამოიყენეთ მუდმივი დენის ძრავის თვისება: თუ ძრავი მექანიკურად გაჩერებულია, მისი წინაღობა მნიშვნელოვნად მცირდება;
    გამოიყენეთ წინა ამოცანების შედეგები — ტრანზისტორის კოლექტორული ჩართვა.
