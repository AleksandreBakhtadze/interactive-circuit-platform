        switch: open
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_button_open_dim
      labelKa: ჩამრთველი ჩართულია — ნათურა ანთია (სუსტად/საშუალოდ)
      switchStates:
        switch: closed
        button_1: open
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.025
      - role: lamp
        metric: current
        op: lt
        value: 0.105
    - label: switch_on_button_pressed_bright
      labelKa: ღილაკი დაჭერილია — ნათურის ნათება მოემატა
      switchStates:
        switch: closed
        button_1: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.09
      - role: lamp
        metric: current_vs_prior
        op: gt
