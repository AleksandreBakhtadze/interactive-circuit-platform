      - role: lamp
        metric: current
        op: lt
        value: 0.01
      potPositions:
        variable_resistor: 1.0
    - label: switch_on_lamp_end
      labelKa: "ცოცია მეორე ბოლოში — ნათურა ანთია, ძრავი გაჩერებულია"
      switchStates:
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.08
      - role: motor_1
        metric: current
        op: lt
        value: 0.04
      potPositions:
        variable_resistor: 0.0
- code: TR.L2.17
  title: ნათურის ანთება მხოლოდ ორი ღილაკით
  displayOrder: 17
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    ორი NPN ტრანზისტორი, ორი ღილაკი, ნათურა, რეზისტორები მხოლოდ 1k, ორი კვების წყარო და ჩამრთველი; ღილაკების ერთმანეთთან გამტარით დაკავშირება არ შეიძლება.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    თუ ჩამრთველით ჩართავთ წრედს, ნათურა არ უნდა აინთოს;
    თუ დავაწვებით პირველ ღილაკს, ნათურა არ უნდა აინთოს;
    თუ დავაწვებით მეორე ღილაკს, ნათურა არ უნდა აინთოს;
    თუ დავაწვებით ორივე ღილაკს ერთდროულად, ნათურა უნდა აინთოს.

    ნათურა უნდა ინთებოდეს მხოლოდ მაშინ, როდესაც დავაწვებით ორივე ღილაკს ერთდროულად. ღილაკები გამტარით ერთმანეთთან არ უნდა იყოს დაკავშირებული.
  hint: |-
    ტრანზისტორები ჩართეთ ერთმანეთის მიმდევრობით — ერთის ემიტერი მიაერთეთ მეორის კოლექტორზე;
    ერთი ღილაკით და რეზისტორით დენი გაატარეთ პირველი ტრანზისტორის ბაზა-ემიტერში;
    მეორე ღილაკით და რეზისტორით დენი გაატარეთ მეორე ტრანზისტორის ბაზა-ემიტერში.
  questions: |-
    შეიძლება თუ არა იგივე ამოცანა გაკეთდეს მხოლოდ ერთი ტრანზისტორის გამოყენებით?
    დამატებით გამოიყენეთ მწვანე და წითელი შუქდიოდები და წრედი შეცვალეთ ისე, რომ ერთ ღილაკზე დაჭერით აინთოს წითელი, ხოლო მეორეზე დაჭერით აინთოს მწვანე შუქდიოდი.
  methodology: ეს ამოცანა შესაძლებელია გაკეთდეს მხოლოდ ერთი ტრანზისტორის გამოყენებითაც;
    სასურველია ორივე ვარიანტი ააწყონ და შეადარონ ერთმანეთს. ამ სავარჯიშოში პრაქტიკულად
    უნდა ნახონ ორი ტრანზისტორის მიმდევრობით ჩართვა.
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთულია — ნათურა ჩამქრალია
      switchStates:
        switch: open
        button_1: open
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: switch_on_both_open
      labelKa: "ჩამრთველი ჩართულია, ღილაკები არ არის დაჭერილი"
      switchStates:
        switch: closed
        button_1: open
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: only_button_1
      labelKa: მხოლოდ პირველი ღილაკი დაჭერილია — ნათურა ჩამქრალია
      switchStates:
        switch: closed
        button_1: closed
        button_2: open
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: only_button_2
      labelKa: მხოლოდ მეორე ღილაკი დაჭერილია — ნათურა ჩამქრალია
      switchStates:
        switch: closed
        button_1: open
        button_2: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.001
    - label: both_buttons
      labelKa: ორივე ღილაკი დაჭერილია — ნათურა ანთია
      switchStates:
        switch: closed
        button_1: closed
        button_2: closed
      checks:
      - role: lamp
        metric: current
        op: gt
        value: 0.05
