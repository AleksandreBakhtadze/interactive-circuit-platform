    რანზისტორის მუშაობა დამოკიდებულია მეორე ტრანზისტორის მდგომარეობაზე. ტრანზისტორ\
    ების ერთმანეთთან მიერთებისას აუცილებლად გამოიყენონ შემზღუდველი რეზისტორი ბაზა\
    -ემიტერში მაღალი დენის თავიდან ასარიდებლად."
  validation:
