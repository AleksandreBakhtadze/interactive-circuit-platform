        motor_1: stalled
        switch: closed
      checks:
      - role: lamp
        metric: current
        op: lt
        value: 0.01
      - role: motor_1
        metric: current
        op: gt
        value: 0.05
- code: TR.L2.16
  title: ანტაგონისტური ნათურა და ძრავი ცვლადი რეზისტორით
  displayOrder: 16
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები:
    NPN ტრანზისტორი, ნათურა, ძრავი, ცვლადი რეზისტორი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    ცოცია დააყენეთ ცვლადი რეზისტორის ერთ ბოლოში;
    თუ ჩამრთველით ჩართავთ წრედს, ძრავი უნდა დატრიალდეს, ნათურა არ უნდა აინთოს;
    თუ ცოციას თანდათან გადავაადგილებთ ერთი მიმართულებით, ძრავი უნდა გაითიშოს და ნათურა უნდა აინთოს ძლიერად;
    თუ ცოციას დავაბრუნებთ საწყის პოზიციაზე, ნათურაც და ძრავიც უნდა დაბრუნდეს საწყის მდგომარეობაში.

    ცვლადი რეზისტორით უნდა ხდებოდეს ძრავის და ნათურის მუშაობის გადართვა — თუ ძრავი გაჩერდება, ნათურა უნდა აინთოს და პირიქით.
  hint: |-
    ძრავიც და ნათურაც ჩართეთ ტრანზისტორების კოლექტორებზე; ძრავის ტრანზისტორის ბაზა ისე მიაერთეთ ცვლად რეზისტორთან, რომ ცოციას გადაადგილებით ძაბვა ივლებოდეს ბაზა-ემიტერზე;
    ნათურის ტრანზისტორის ბაზა რეზისტორის გავლით მიაერთეთ ძრავის ტრანზისტორის კოლექტორს — როდესაც ძრავის ტრანზისტორი გაიხსნება, დაკეტავს ნათურის ტრანზისტორს.
  questions: |-
    შეიცვლება თუ არა წრედის მუშაობის პრინციპი, თუ ძრავს და ნათურას გავუცვლით ადგილებს?
    დამატებით გამოიყენეთ ორი ლურჯი შუქდიოდი და წრედი შეცვალეთ ისე, რომ ერთი შუქდიოდი აინთოს როდესაც ძრავი გაჩერდება, ხოლო მეორე — როდესაც ნათურა ჩაქრება.
  methodology: "ამ სავარჯიშოს მიზანია პრაქტიკულად ნახონ ერთი ტრანზისტორით მეორე ტრ\
    ანზისტორის მართვის მაგალითი. აქამდე მოცემულ ყველა დავალებაში თითოეული ტრანზისტ\
