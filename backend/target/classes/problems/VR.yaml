        op: lt
        value: 3.0E-4
      - role: led_red
        metric: forward_current
        op: lt
        value: 3.0E-4
      potPositions:
        variable_resistor: 0.5
    - label: pot_one_end_green
      labelKa: ცოცია ერთ ნაპირზე — მწვანე შუქდიოდი ანთებულია
      checks:
      - role: led_green
        metric: forward_current
        op: gt
        value: 3.0E-4
      - role: led_red
        metric: forward_current
        op: lt
        value: 1.0E-4
      potPositions:
        variable_resistor: 0.0
    - label: pot_other_end_red
      labelKa: ცოცია მეორე ნაპირზე — წითელი შუქდიოდი ანთებულია
      checks:
      - role: led_red
