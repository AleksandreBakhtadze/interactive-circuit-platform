    ჩამრთველით ჩართვისას არცერთი შუქდიოდი არ უნდა აინთოს;
    ცოციის თანაბარი გადაადგილებისას ჯერ ლურჯი, შემდეგ მწვანე და ბოლოს წითელი უნდა აინთოს;
