    ცოცია დააყენეთ ცვალადი რეზისტორის ერთ-ერთ განაპირა მხარეს;
    ჩამრთველით ჩართვისას არცერთი შუქდიოდი არ უნდა აინთოს;
    ცოციის თანაბარი გადაადგილებისას ჯერ წითელი, შემდეგ მწვანე და ბოლოს ლურჯი უნდა აინთოს;
    ცოციის უკან დაბრუნებისას ჯერ ლურჯი ჩაქრება, შემდეგ მწვანე და ბოლოს წითელი.
  hint: გაიხსენეთ რა ძაბვებზე ინთება თითოეული ფერის შუქდიოდი. ყველა შუქდიოდისთვის
    გამოიყენეთ ინდივიდუალური დენის შემზღუდველი რეზისტორი და შეარჩიეთ შესაბამისი ნომინალები.
    ცვალადი რეზისტორი გამოიყენეთ შუქდიოდებზე თანდათან მზარდი ძაბვის მისაწოდებლად.
  questions: |-
    გამოიყენეთ ღილაკი და შეცვალეთ წრედი ისე, რომ ცოციის ნებისმიერ მდგომარეობაში ღილაკის დაჭერით სამივე შუქდიოდი აინთოს.

    გამოიყენეთ ღილაკი და შეცვალეთ წრედი ისე, რომ ცოციის ნებისმიერ მდგომარეობაში ღილაკის დაჭერით სამივე შუქდიოდი ჩაკრეს.

    შეცვალეთ წრედი ისე, რომ ანთების წერტილები ცვალად რეზისტორზე თანაბრად იყოს გადანაწილებული: წითელი პირველ მესამედში, მწვანე შუაში, ლურჯი მესამე მესამედში.
