chapter: VR
problems:
- code: VR.L1.10
  title: ცვლადი რეზისტორი და ნათურა
  displayOrder: 10
  difficulty: beginner
  description: |-
    ააწყვეთ სურათზე მოცემული წრედი (ორი 3 ვ კვების წყარო, ჩამრთველი, ცვლადი რეზისტორი და 6 ვ ნათურა).

    გამოიყენეთ სიმულაცია და დააკვირდით:
    • ცოცია შუა წერტილში და ჩამრთველით წრედის ჩართვისას;
    • ცოციას გადაადგილებისას კვებასთან ჩართული პოლუსისკენ;
    • ნათურის ძრავით ჩანაცვლების შემთხვევას (გონებაში ან სიმულაციით).

    შემდეგ უპასუხეთ ქვემოთ მოცემულ ტესტის კითხვებს და დააჭირეთ შემოწმებას.
  hint: |-
    ცვლადი რეზისტორი ჩართეთ როგორც რეოსტატი: კვება ერთ პოლუსზე, ნათურა — ცოციას გავლით.
    გაითვალისწინეთ: ნაკრების ცვლად რეზისტორს აქვს დაახლოებით 50 Ω დამცავი (ბოლო) წინაღობა — მინიმალურ პოზიციაზეც კი დენი შეზღუდულია.
  questions: |-
    1. რა მოხდება თუ ცოციას დავაყენებთ შუა წერტილში და ჩამრთველით ჩავრთავთ წრედს?
    ა. ნათურა აინთება ძლიერად;
    ბ. ნათურა აინთება სუსტად;
    გ. ნათურა არ აინთება;

    2. რა მოხდება თუ ცოციას გადავაადგილებთ კვებასთან ჩართული პოლუსისკენ?
    ა. ნათურა არ აინთება;
    ბ. ნათურა აინთება ძლიერად;
    გ. ნათურა აინთება სუსტად;

    3. რა მოხდება თუ ნათურას ჩავანაცვლებთ ძრავით?
    ა. ძრავი არ დატრიალდება;
    ბ. ძრავი დატრიალდება ნელა;
    გ. ძრავი დატრიალდება ჩქარა;
  methodology: "სავარჯიშოს მიზანია შეაფასონ ნაკრებში არსებული ცვლადი რეზისტორის მა\
    ხასიათებლები და დარწმუნდნენ, რომ ამ ცვლადი რეზისტორის გამოყენებით ძლიერი დენის\
    \ მიღწევა შეუძლებელია."
- code: VR.L2.11
  title: "ცვლადი რეზისტორი, ნათურა და შუქდიოდები"
  displayOrder: 11
  difficulty: beginner
  description: |-
    ააწყვეთ სურათზე მოცემული წრედი (ორი 3 ვ კვების წყარო, ჩამრთველი, ცვლადი რეზისტორი, მწვანე და წითელი შუქდიოდი, ნათურა და რეზისტორები).

    გამოიყენეთ სიმულაცია და დააკვირდით:
    • ცოცია შუა წერტილში და ჩამრთველით წრედის ჩართვისას;
    • ცოციას ზევით გადაადგილებისას;
    • ცოციას ქვევით გადაადგილებისას.

    შემდეგ უპასუხეთ ქვემოთ მოცემულ ტესტის კითხვებს და დააჭირეთ შემოწმებას.
  hint: |-
    პირველი 1 kΩ რეზისტორის შემდეგ მწვანე შუქდიოდი და ცვლადი რეზისტორი (როგორც ძაბვის გამყოფი) პარალელურადაა.
    ცოციიდან იკვებება წითელი შუქდიოდი და ნათურა — თითოეულს თავისი 1 kΩ რეზისტორი აქვს მიმდევრობით.
  questions: |-
    1. რა მოხდება თუ ცოციას დავაყენებთ შუა წერტილში და ჩამრთველით ჩავრთავთ წრედს?
    ა. არც ერთი არ აინთება;
    ბ. ნათურაც და შუქდიოდებიც აინთება;
    გ. მხოლოდ შუქდიოდები აინთება;
    დ. მხოლოდ მწვანე შუქდიოდი აინთება;
    ე. მხოლოდ წითელი შუქდიოდი აინთება;

    2. რა მოხდება თუ ცოციას გადავაადგილებთ ზევით?
    ა. ნათურაც და შუქდიოდებიც აინთება;
    ბ. მხოლოდ შუქდიოდები აინთება;
    გ. მხოლოდ მწვანე შუქდიოდი აინთება;
    დ. მხოლოდ ნათურა აინთება;
    ე. მხოლოდ წითელი შუქდიოდი აინთება;

    3. რა მოხდება თუ ცოციას გადავაადგილებთ ქვევით?
    ა. არც ერთი არ აინთება;
    ბ. მხოლოდ შუქდიოდები აინთება;
    გ. მხოლოდ წითელი შუქდიოდი აინთება;
    დ. მხოლოდ მწვანე შუქდიოდი აინთება;
    ე. ნათურაც და შუქდიოდებიც აინთება;
  methodology: სავარჯიშოს მიზანია შეაფასონ ნაკრებში არსებული ცვლადი რეზისტორის მახასიათებლები;
    სამივე შემთხვევაში გამოთვალონ ნათურაში გამავალი დენი და წითელ შუქდიოდზე მოდებული
    ძაბვა.
- code: VR.L2.12
  title: ცვალებადი ნათება დაწყვილებული ცვალადი რეზისტორებით
  displayOrder: 12
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ორი ცვალადი რეზისტორი, ერთი წითელი შუქდიოდი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    ორივე ცვალადი რეზისტორის ცოცია დააყენეთ ერთმანეთის გასწვრივ;
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდი უნდა აინთოს;
    თუ რომელიმე ცვალადი რეზისტორის ცოციას გადაადგილებთ, შუქდიოდის ნათება უნდა შეიცვალოს;
    თუ ორივე ცვალადი რეზისტორის ცოციას გადაადგილებთ სინქრონულად, შუქდიოდის ნათება ამ შემთხვევაშიც უნდა შეიცვალოს;
    როგორც ცალკე, ასევე დაწყვილებული ცვალადი რეზისტორების გადაადგილებისას შუქდიოდის ნათება უნდა იცვლებოდეს.
  hint: |-
    ორი ცვალადი რეზისტორი ისე გააერთიანეთ ერთმანეთთან, რომ თავისუფალი დაგრჩეთ ცოციას დაბოლოებები; ეს ორი დაბოლოება განიხილეთ როგორც შედგენილი რეზისტორის პოლუსები.
    შუქდიოდი მიმდევრობით ჩართეთ მიღებულ შედგენილ რეზისტორთან.
  questions: |-
    ლურჯი შუქდიოდი ჩართეთ წრედში ისე, რომ ცვალადი რეზისტორების გადაადგილებისას მისი განათება არ იცვლებოდეს.
    შეცვალეთ წრედი ისე, რომ ორივე ცოციას სინქრონულად გადაადგილებისას ერთ-ერთ ბოლოში შუქდიოდი ჩაქრეს.
  methodology: "ამ და მომდევნო რამდენიმე ამოცანაში გამოყენებულია „დაწყვილებული ცვა\
    ლადი რეზისტორები“ — ერთმანეთის გვერდიგვერდ, სიმეტრიულად დამაგრებული ორი ცვალად\
    ი რეზისტორი, რომელთა ცოციები შეგვიძლია გადავაადგილოთ როგორც თანაბრად (სინქრონუ\
    ლად), ასევე დამოუკიდებლად. ამდაგვარ ამოცანებში ძირითადად მოსაფიქრებელია, როგორ\
    \ მიერთდება ეს ორი დაწყვილებული რეზისტორი ერთმანეთთან და შემდეგ როგორ ჩაისმება\
    \ პირობების შესაბამისად წრედში."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 5.0E-4
      potPositions:
        variable_resistor_1: 0.5
        variable_resistor_2: 0.5
    - label: switch_on_aligned
      labelKa: "ჩამრთველი ჩართული, ცოციები გასწორებული — LED ანთებულია"
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 2.0E-4
      potPositions:
        variable_resistor_1: 0.5
        variable_resistor_2: 0.5
    - label: one_pot_moved
      labelKa: ერთი ცოცია გადაადგილებული — ნათება იცვლება
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 1.5E-4
      - role: led_1
        metric: forward_current_vs_prior_ratio
        op: gt
        value: 1.4
      potPositions:
        variable_resistor_1: 0.0
        variable_resistor_2: 0.5
    - label: other_pot_moved
      labelKa: მეორე ცოციაც გადაადგილებული — ნათება ისევ იცვლება
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 1.5E-4
      - role: led_1
        metric: forward_current_vs_prior_ratio
        op: gt
        value: 1.35
      potPositions:
        variable_resistor_1: 0.0
        variable_resistor_2: 0.0
    - label: both_synced
      labelKa: ორივე ცოცია გადაადგილებული — ნათება იცვლება
      switchStates:
        switch: closed
      checks:
      - role: led_1
        metric: forward_current
        op: gt
        value: 1.5E-4
      - role: led_1
        metric: forward_current_vs_prior_ratio
        op: gt
        value: 1.35
      potPositions:
        variable_resistor_1: 1.0
        variable_resistor_2: 0.5
- code: VR.L2.13
  title: უცვლელი ნათება დაწყვილებული ცვალადი რეზისტორებით
  displayOrder: 13
  difficulty: beginner
  description: |-
    გამოიყენეთ მხოლოდ შემდეგი დეტალები: ორი ცვალადი რეზისტორი, ერთი წითელი შუქდიოდი, რეზისტორები, ორი კვების წყარო და ჩამრთველი.

    ააწყვეთ წრედი, რომელიც იმუშავებს ასე:
    ორივე ცვალადი რეზისტორის ცოცია დააყენეთ ერთმანეთის გასწვრივ;
    თუ ჩამრთველით ჩართავთ წრედს, შუქდიოდი უნდა აინთოს;
    თუ რომელიმე ცვალადი რეზისტორის ცოციას გადაადგილებთ, შუქდიოდის ნათება უნდა შეიცვალოს;
    თუ ორივე ცვალადი რეზისტორის ცოციას გადაადგილებთ სინქრონულად, შუქდიოდის ნათება არ უნდა შეიცვალოს;
    დაწყვილებული ცვალადი რეზისტორების გადაადგილებისას შუქდიოდის ნათება უნდა იყოს უცვლელი, ცალ-ცალკე გადაადგილებისას კი უნდა იცვლებოდეს.
  hint: "ცვალადი რეზისტორები ჩართეთ ერთმანეთის მიმდევრობით ისე, რომ სინქრონული გად\
    აადგილებისას ერთის წინაღობა იზრდებოდეს, როცა მეორის მცირდება — ჯამური კი უცვლე\
    ლი დარჩეს."
  questions: |-
    შეიცვლება თუ არა წრედის მუშაობის პრინციპი თუ შუქდიოდს და ჩამრთველს გავუცვლით ადგილს?
    როგორ იმუშავებს წრედი თუ 1 kΩ რეზისტორის ნაცვლად გამოვიყენებთ გამტარს? რა დანიშნულება აქვს ამ რეზისტორს?
  methodology: "თუ წინა სავარჯიშო უკვე შესრულებულია, საკმაოდ მარტივია ამ ამოცანის\
    \ შედეგის მიღება — საკმარისია მხოლოდ ერთ ცვალად რეზისტორზე გამტარს შეუცვალონ პ\
    ოზიცია და წრედი სწორად იმუშავებს. მნიშვნელოვანია, რომ კარგად აღიქვან ერთმანეთთ\
    ან დაკავშირებული ცვალადი რეზისტორების წრედი და მიხვდნენ, რატომ რჩება შუქდიოდის\
    \ ნათება უცვლელი."
  validation:
    cases:
    - label: switch_off
      labelKa: ჩამრთველი გამორთული
      switchStates:
        switch: open
      checks:
      - role: led_1
        metric: forward_current
        op: lt
        value: 5.0E-4
      potPositions:
        variable_resistor_1: 0.5
        variable_resistor_2: 0.5
    - label: switch_on_aligned
