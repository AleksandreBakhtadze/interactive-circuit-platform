    ცვალადი რეზისტორის ცოცია შუაში — შუქდიოდები ჩამქრალია;
    ცოციას ერთი მიმართულებით გადაადგილება — მწვანე შუქდიოდი თანდათან ნათდება;
    ცოციას მეორე მიმართულებით გადაადგილება — წითელი შუქდიოდი თანდათან ნათდება.
  hint: "შუქდიოდები შებრუნებულ-პარალელურად ჩართეთ ერთმანეთთან. გამოიყენეთ კვების გ\
    ადაბმის წერტილი — ცვალადი რეზისტორი ჩართეთ დელიტელად, ისე რომ ცოციის გადაადგილ\
    ებისას ძაბვის პოლარობა შეიცვალოს შუქდიოდებზე."
  questions: |-
    გამოიყენეთ ჩამრთველი და ჩართეთ წრედში ისე, რომ გათიშული ჩამრთველის დროს არცერთი შუქდიოდი არ ანთდეს.

    ახლა გამოიყენეთ შუქდიოდების პარალელური ჩართვა (არა ანტიპარალელური) და გადააკეთეთ ამოცანა ისე, რომ ცოციის შუა პოზიციაში ორივე შუქდიოდი ენთოს, ხოლო განაპირებში ერთ-ერთი მათგანი ძლიერდებოდეს, მეორე კი სუსტდებოდეს.
  methodology: "ეს და მომდევნო ორი სავარჯიშო გათვლილია ანტიპარალელურად ჩართული ორი\
    \ შუქდიოდის და ცვალადი რეზისტორის ერთობლივ გამოყენებაზე. მსგავსი ამოცანა გადამ\
    რთველის გამოყენებით უკვე გაკეთებული აქვთ. სავარჯიშოს ძირითადი მიზანია კარგად ა\
    ღიქვან შუქდიოდების ძაბვის ცვლილებასა და ცოციის გადაადგილებას შორის დამოკიდებულ\
    ება — მიხვდნენ, რომ ცოციის გადაადგილებით შუქდიოდებზე ძაბვის პოლარობა იცვლება,\
    \ ანუ მიიღება ცვალადი ძალა."
  validation:
    cases:
    - label: pot_mid_both_off
      labelKa: ცოცია შუაში — ორივე შუქდიოდი ჩამქრალია
