<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: only light;" version="1.1" width="109px" height="109px" viewBox="0 0 109 109">
  <!-- Dark cover cup - opposite of torch (blocks light) -->
  <g transform="rotate(45, 54.5, 54.5)">
    <!-- Shadow halo -->
    <ellipse cx="54.5" cy="18" rx="18" ry="13" fill="#2a2a2a" opacity="0.35" style="fill: rgb(42, 42, 42);"/>

    <!-- Cup dome (inverted over sensor) -->
    <path d="M 38 24 L 71 24 L 66 42 Q 54.5 48 43 42 Z" fill="#3d3d3d" stroke="#1a1a1a" stroke-width="2.8" stroke-linejoin="round" style="fill: rgb(61, 61, 61); stroke: rgb(26, 26, 26);"/>
    <path d="M 42 26 L 67 26 L 63 40 Q 54.5 44 46 40 Z" fill="#2f2f2f" stroke="none" style="fill: rgb(47, 47, 47);"/>

    <!-- Rim -->
    <rect x="36" y="40" width="37" height="6" rx="2" fill="#434343" stroke="#1a1a1a" stroke-width="2.8" style="fill: rgb(67, 67, 67); stroke: rgb(26, 26, 26);"/>

    <!-- Handle / grip -->
    <rect x="44" y="46" width="21" height="32" rx="4" fill="#434343" stroke="#1a1a1a" stroke-width="2.8" style="fill: rgb(67, 67, 67); stroke: rgb(26, 26, 26);"/>
    <path d="M 47 52 H 62 M 47 58 H 62 M 47 64 H 62" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.4" style="stroke: rgb(26, 26, 26);"/>

    <!-- Blocked light (crossed rays) -->
    <path d="M 48 12 L 61 25 M 61 12 L 48 25" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" style="stroke: rgb(26, 26, 26);"/>

    <!-- Base -->
    <rect x="46" y="78" width="17" height="7" rx="3.5" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2.8" style="fill: rgb(42, 42, 42); stroke: rgb(26, 26, 26);"/>
  </g>
</svg>
