<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: only light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="325px" height="109px" viewBox="0 0 325 109">
  <g transform="translate(0.5,0.5)">
    <!-- White base -->
    <rect x="30.24" y="21.6" width="263.52" height="64.8" rx="32.4" ry="32.4" fill="#ffffff" stroke="#808080" stroke-width="0.86" style="fill: rgb(255, 255, 255); stroke: rgb(128, 128, 128);"/>
    <!-- Orange face -->
    <rect x="35.64" y="27" width="252.72" height="54" rx="27" ry="27" fill="#f8d000" stroke="#ffffff" stroke-width="0.22" style="fill: rgb(248, 208, 0); stroke: rgb(255, 255, 255);"/>
    <!-- Bus line -->
    <path d="M 54 54 L 270 54" fill="#f8d000" stroke="#ffffff" stroke-width="3.78" stroke-miterlimit="10" style="fill: rgb(248, 208, 0); stroke: rgb(255, 255, 255);"/>
    <!-- Light arrows (down-left toward center — mirrored from resistor-rp.svg) -->
    <path d="M 222.48 35.64 L 212.76 43.2 M 214.92 39.42 L 211.68 44.28 L 217.08 42.12 Z M 216 29.7 L 206.28 37.8 M 208.44 34.02 L 205.2 38.88 L 210.6 36.72 Z" fill="#f8d000" stroke="#ffffff" stroke-width="2.16" stroke-miterlimit="10" style="fill: rgb(248, 208, 0); stroke: rgb(255, 255, 255);"/>
    <!-- Resistor body (same as other resistors) -->
    <rect x="129.6" y="39.96" width="62.64" height="28.08" fill="#f8d000" stroke="#ffffff" stroke-width="3.78" style="fill: rgb(248, 208, 0); stroke: rgb(255, 255, 255);"/>
    <!-- RP label -->
    <ellipse cx="108" cy="54" rx="14.04" ry="14.04" fill="#f8d000" stroke="#ffffff" stroke-width="3.78" style="fill: rgb(248, 208, 0); stroke: rgb(255, 255, 255);"/>
    <text x="99.2" y="58.4" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="14.04px" style="fill: rgb(255, 255, 255);">RP</text>
    <!-- Snap terminals -->
    <ellipse cx="54" cy="54" rx="11.88" ry="11.88" fill="#ffffff" stroke="#a0a0a0" stroke-width="1.08" style="fill: rgb(255, 255, 255); stroke: rgb(160, 160, 160);"/>
    <ellipse cx="270" cy="54" rx="11.88" ry="11.88" fill="#ffffff" stroke="#a0a0a0" stroke-width="1.08" style="fill: rgb(255, 255, 255); stroke: rgb(160, 160, 160);"/>
    <ellipse cx="54" cy="54" rx="7.56" ry="7.56" fill="#f6f6f6" stroke="#d0d0d0" stroke-width="1.08" style="fill: rgb(246, 246, 246); stroke: rgb(208, 208, 208);"/>
    <ellipse cx="270" cy="54" rx="7.56" ry="7.56" fill="#f6f6f6" stroke="#d0d0d0" stroke-width="1.08" style="fill: rgb(246, 246, 246); stroke: rgb(208, 208, 208);"/>
    <ellipse cx="54" cy="54" rx="3.24" ry="3.24" fill="#ffffff" stroke="#ffffff" stroke-width="0.54" style="fill: rgb(255, 255, 255); stroke: rgb(255, 255, 255);"/>
    <ellipse cx="270" cy="54" rx="3.24" ry="3.24" fill="#ffffff" stroke="#ffffff" stroke-width="0.54" style="fill: rgb(255, 255, 255); stroke: rgb(255, 255, 255);"/>
  </g>
